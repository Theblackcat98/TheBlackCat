<script>
(() => {
  // ---------------------------------------------------------------------------
  // Deterministic drafting texture and scene palette
  // ---------------------------------------------------------------------------
  function mulberry32(a) {
    return function () {
      let t = (a += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(604);

  function generatePaperOverlay() {
    const canvas = document.getElementById('paper-overlay');
    const w = canvas.width = window.innerWidth;
    const h = canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ede9e0';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(130,120,108,.085)';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 28) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += 28) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    const img = ctx.getImageData(0, 0, w, h);
    const data = img.data;
    const noise = mulberry32(8841);
    for (let i = 0; i < data.length; i += 4) {
      const grain = (noise() - .5) * 15;
      data[i] = Math.max(0, Math.min(255, data[i] + grain));
      data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + grain));
      data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + grain));
    }
    ctx.putImageData(img, 0, 0);
  }
  generatePaperOverlay();

  const PALETTE = {
    marble:    { lit: 0xe8dfcf, mid: 0xd8cbb8, shade: 0xbcae9b, top: 0xf0e8d9, bot: 0x827568 },
    limestone: { lit: 0xd9c9ad, mid: 0xc8b596, shade: 0xa58e70, top: 0xe6d7bd, bot: 0x76634e },
    plaster:   { lit: 0xe9d9bd, mid: 0xd8c4a3, shade: 0xb79f7d, top: 0xf1e3cb, bot: 0x86745b },
    brick:     { lit: 0xb97555, mid: 0x9f6048, shade: 0x754431, top: 0xc88665, bot: 0x4e3027 },
    brickDark: { lit: 0x99523f, mid: 0x814334, shade: 0x603329, top: 0xb76c52, bot: 0x40251f },
    core:      { lit: 0xb7a58d, mid: 0x99866f, shade: 0x766653, top: 0xc8b69a, bot: 0x51483f },
    dark:      { lit: 0x69564a, mid: 0x54443a, shade: 0x392f2a, top: 0x806b58, bot: 0x29231f },
    blue:      { lit: 0x557f91, mid: 0x3e687e, shade: 0x2e4d64, top: 0x729bae, bot: 0x203848 },
    turquoise:{ lit: 0x8bb9b2, mid: 0x6c9d98, shade: 0x4d7774, top: 0xa7c9c1, bot: 0x365956 },
    water:     { lit: 0x9fc9c7, mid: 0x75aaa9, shade: 0x4f8588, top: 0xc0dfd7, bot: 0x315e66 },
    soil:      { lit: 0x7d8055, mid: 0x686d48, shade: 0x50563b, top: 0x969365, bot: 0x3a4030 },
    leaf1:     { lit: 0x82915b, mid: 0x657b49, shade: 0x4c613b, top: 0xa0a86d, bot: 0x354831 },
    leaf2:     { lit: 0x9b9a62, mid: 0x7f874f, shade: 0x5d6c3e, top: 0xb5ae76, bot: 0x465135 },
    leaf3:     { lit: 0x5f8060, mid: 0x496b50, shade: 0x375440, top: 0x7d9a70, bot: 0x2a4034 },
    plaza:     { lit: 0xe7e0d4, mid: 0xd9d1c4, shade: 0xc4baaa, top: 0xf0eadf, bot: 0x968a7b },
    ghost:     { lit: 0xe5dfd3, mid: 0xd9d2c6, shade: 0xd0c8bb, top: 0xebe5da, bot: 0xb7afa3 }
  };

  const container = document.getElementById('canvas-container');
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0xe5e0d6, 1);
  container.insertBefore(renderer.domElement, document.getElementById('paper-overlay'));

  const scene = new THREE.Scene();
  const frustumSize = 53;
  const aspect = window.innerWidth / window.innerHeight;
  const camera = new THREE.OrthographicCamera(-frustumSize * aspect / 2, frustumSize * aspect / 2, frustumSize / 2, -frustumSize / 2, -200, 300);
  const target = new THREE.Vector3(0, 8.7, 0);
  const defaultCameraPosition = new THREE.Vector3(43, 34, 49);
  camera.position.copy(defaultCameraPosition);
  camera.lookAt(target);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(target);
  controls.enableDamping = true;
  controls.dampingFactor = .075;
  controls.minZoom = .55;
  controls.maxZoom = 2.35;
  controls.update();
  window.addEventListener('dblclick', () => {
    camera.position.copy(defaultCameraPosition);
    camera.zoom = 1;
    camera.updateProjectionMatrix();
    controls.target.copy(target);
    controls.update();
  });

  // ---------------------------------------------------------------------------
  // Multi-weight wash and ink drawing engine
  // ---------------------------------------------------------------------------
  const washPositions = [], washColors = [];
  const ink = { bold: [], medium: [], fine: [], rust: [], teal: [], foliage: [], faint: [] };
  const light = new THREE.Vector3(-.42, .68, .72).normalize();
  const color = new THREE.Color();

  function directional(palName, normal) {
    const p = PALETTE[palName] || PALETTE.marble;
    if (normal[1] > .65) return p.top;
    if (normal[1] < -.65) return p.bot;
    const d = normal[0] * light.x + normal[1] * light.y + normal[2] * light.z;
    return d > .28 ? p.lit : d > -.18 ? p.mid : p.shade;
  }
  function pushQuad(p0, p1, p2, p3, hex, shift = 0) {
    color.setHex(hex);
    if (shift) color.offsetHSL(0, 0, shift);
    const r = color.r, g = color.g, b = color.b;
    washPositions.push(...p0, ...p1, ...p2, ...p0, ...p2, ...p3);
    for (let i = 0; i < 6; i++) washColors.push(r, g, b);
  }
  function pushTri(p0, p1, p2, hex) {
    color.setHex(hex);
    washPositions.push(...p0, ...p1, ...p2);
    for (let i = 0; i < 3; i++) washColors.push(color.r, color.g, color.b);
  }
  function line(a, b, layer = 'medium', overshoot = .012) {
    const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
    const len = Math.hypot(dx, dy, dz);
    if (len < 1e-5) return;
    const o = overshoot;
    const j = layer === 'faint' ? 0 : .004;
    const ar = [a[0] - dx / len * o + (rng() - .5) * j, a[1] - dy / len * o + (rng() - .5) * j, a[2] - dz / len * o + (rng() - .5) * j];
    const br = [b[0] + dx / len * o + (rng() - .5) * j, b[1] + dy / len * o + (rng() - .5) * j, b[2] + dz / len * o + (rng() - .5) * j];
    (ink[layer] || ink.medium).push(...ar, ...br);
    if (layer === 'bold') {
      ink.bold.push(ar[0] + .015, ar[1], ar[2] - .015, br[0] + .015, br[1], br[2] - .015);
    }
  }
  function quad(p0, p1, p2, p3, hex, edges = null, shift = 0) {
    pushQuad(p0, p1, p2, p3, hex, shift);
    if (edges) {
      line(p0, p1, edges); line(p1, p2, edges); line(p2, p3, edges); line(p3, p0, edges);
    }
  }

  function box(x, y, z, w, h, d, pal = 'marble', edge = 'medium', opts = {}) {
    const x0 = x, x1 = x + w, y0 = y, y1 = y + h, z0 = z, z1 = z + d;
    const p000 = [x0,y0,z0], p100 = [x1,y0,z0], p110 = [x1,y1,z0], p010 = [x0,y1,z0];
    const p001 = [x0,y0,z1], p101 = [x1,y0,z1], p111 = [x1,y1,z1], p011 = [x0,y1,z1];
    const P = PALETTE[pal];
    quad(p001,p101,p111,p011,P.lit,null,opts.shift || 0);
    quad(p101,p100,p110,p111,P.shade,null,opts.shift || 0);
    quad(p011,p111,p110,p010,P.top,null,opts.shift || 0);
    quad(p000,p100,p101,p001,P.bot,null,opts.shift || 0);
    quad(p100,p000,p010,p110,P.shade,null,opts.shift || 0);
    quad(p000,p001,p011,p010,P.mid,null,opts.shift || 0);
    const E = [[p000,p100],[p100,p101],[p101,p001],[p001,p000],[p010,p110],[p110,p111],[p111,p011],[p011,p010],[p000,p010],[p100,p110],[p101,p111],[p001,p011]];
    E.forEach(e => line(e[0],e[1],edge,.014));
  }

  function cylinder(x, y, z, radius, height, pal = 'marble', segs = 10, edge = 'fine') {
    const points0 = [], points1 = [];
    for (let i = 0; i < segs; i++) {
      const a = i * Math.PI * 2 / segs;
      points0.push([x + Math.cos(a) * radius, y, z + Math.sin(a) * radius]);
      points1.push([x + Math.cos(a) * radius, y + height, z + Math.sin(a) * radius]);
    }
    for (let i = 0; i < segs; i++) {
      const j = (i + 1) % segs;
      const a = (i + .5) * Math.PI * 2 / segs;
      const n = [Math.cos(a), 0, Math.sin(a)];
      pushQuad(points0[i], points0[j], points1[j], points1[i], directional(pal,n), (rng()-.5)*.012);
      if (i % 2 === 0) line(points0[i], points1[i], edge, .008);
      if (i % 2 === 0) line(points1[i], points1[j], 'fine', .006);
    }
    const centerTop = [x,y+height,z], centerBot = [x,y,z];
    for (let i = 0; i < segs; i++) {
      const j = (i + 1) % segs;
      pushTri(centerTop, points1[i], points1[j], PALETTE[pal].top);
      pushTri(centerBot, points0[j], points0[i], PALETTE[pal].bot);
    }
    line(points1[0], points1[Math.floor(segs/2)], edge, 0);
  }

  function prismColumn(x, z, y0, y1, radius = .23, shaft = 'marble') {
    box(x-radius*1.55,y0,z-radius*1.55,radius*3.1,.28,radius*3.1,'limestone','medium');
    box(x-radius*1.3,y0+.28,z-radius*1.3,radius*2.6,.16,radius*2.6,'brick','fine');
    cylinder(x,y0+.44,z,radius,y1-y0-.92,shaft,8,'bold');
    box(x-radius*1.45,y1-.48,z-radius*1.45,radius*2.9,.25,radius*2.9,'marble','medium');
    box(x-radius*1.8,y1-.23,z-radius*1.8,radius*3.6,.23,radius*3.6,'brick','bold');
  }

  // A dark recessed arch bay and a segmented raised voussoir ring on the front plane.
  function archBay(cx, z, baseY, springY, radius, thickness = .34) {
    const pts = [[cx-radius,baseY,z],[cx+radius,baseY,z]];
    for (let i = 0; i <= 12; i++) {
      const a = i * Math.PI / 12;
      pts.push([cx + Math.cos(a)*radius, springY + Math.sin(a)*radius, z]);
    }
    const center = [cx, (baseY + springY + radius*.35)/2, z];
    for (let i = 0; i < pts.length; i++) {
      const j = (i+1)%pts.length;
      pushTri(center, pts[i], pts[j], PALETTE.dark.shade);
    }
    for (let i = 0; i < pts.length; i++) line(pts[i], pts[(i+1)%pts.length], 'fine', .004);
    const steps = 8;
    for (let i = 0; i < steps; i++) {
      const a0 = i*Math.PI/steps, a1 = (i+1)*Math.PI/steps;
      const inner0 = [cx+Math.cos(a0)*radius, springY+Math.sin(a0)*radius, z+.12];
      const inner1 = [cx+Math.cos(a1)*radius, springY+Math.sin(a1)*radius, z+.12];
      const outer0 = [cx+Math.cos(a0)*(radius+thickness), springY+Math.sin(a0)*(radius+thickness), z+.12];
      const outer1 = [cx+Math.cos(a1)*(radius+thickness), springY+Math.sin(a1)*(radius+thickness), z+.12];
      const pal = i % 3 === 1 ? 'brick' : 'limestone';
      quad(inner0,inner1,outer1,outer0,PALETTE[pal].lit,'medium',(rng()-.5)*.015);
      line(inner0,inner1,'bold',.008);
      line(outer0,outer1,'medium',.008);
      line(inner0,outer0,'fine',.006);
    }
  }

  // Convex polygon, filled as a drafting wash fan in the X/Z plane or an arbitrary plane.
  function polygonFan(points, hex) {
    const c = [0,0,0];
    points.forEach(p => { c[0]+=p[0]/points.length; c[1]+=p[1]/points.length; c[2]+=p[2]/points.length; });
    for (let i=0;i<points.length;i++) pushTri(c, points[i], points[(i+1)%points.length], hex);
    for (let i=0;i<points.length;i++) line(points[i],points[(i+1)%points.length],'fine',.004);
  }

  // ---------------------------------------------------------------------------
  // Lush plant language: articulated leaves, palms, shrubs and hanging vines
  // ---------------------------------------------------------------------------
  function leaf(start, tip, width, pal = 'leaf1') {
    const a = new THREE.Vector3(...start), b = new THREE.Vector3(...tip);
    const dir = b.clone().sub(a).normalize();
    let side = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,0,1));
    if (side.length() < .08) side = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(1,0,0));
    side.normalize().multiplyScalar(width);
    const mid = a.clone().lerp(b,.48).add(new THREE.Vector3(0,.08,0));
    const l = mid.clone().add(side), r = mid.clone().sub(side);
    const A = a.toArray(), B = b.toArray(), L = l.toArray(), R = r.toArray();
    const p = PALETTE[pal];
    pushTri(A,L,B,p.lit); pushTri(A,B,R,p.mid);
    line(A,B,'foliage',.004);
  }

  function shrub(x, y, z, scale=1, variety=0) {
    const count = 11;
    for (let i=0;i<count;i++) {
      const a = i*Math.PI*2/count + rng()*.2;
      const rise = .48 + rng()*.55;
      const reach = (.42 + rng()*.42)*scale;
      const start = [x+(rng()-.5)*.22*scale, y+.12*scale, z+(rng()-.5)*.22*scale];
      const tip = [x+Math.cos(a)*reach, y+rise*scale, z+Math.sin(a)*reach];
      leaf(start,tip,(.12+rng()*.055)*scale,['leaf1','leaf2','leaf3'][((i+variety)%3)]);
    }
    for (let k=0;k<3;k++) {
      const a = k*2.094+variety;
      const c = [x+Math.cos(a)*.16*scale,y+.32*scale,z+Math.sin(a)*.16*scale];
      line([x,y,z],c,'fine',0);
    }
  }

  function palm(x, y, z, height=5, scale=1) {
    const h = height*scale;
    cylinder(x,y,z,.22*scale,h,'brick',8,'medium');
    // Narrow horizontal scars on the date-palm trunk.
    for(let i=1;i<7;i++) {
      const yy=y+h*i/7;
      line([x-.15*scale,yy,z-.15*scale],[x+.15*scale,yy,z+.15*scale],'rust',0);
    }
    const crown=[x,y+h,z];
    for(let f=0;f<9;f++) {
      const a=f*Math.PI*2/9+.2;
      const reach=(1.35+rng()*.5)*scale;
      const rise=(.55+rng()*.55)*scale;
      const end=[x+Math.cos(a)*reach,y+h+rise,z+Math.sin(a)*reach];
      line(crown,end,'foliage',.008);
      for(let j=1;j<=6;j++) {
        const t=j/7;
        const cx=x+Math.cos(a)*reach*t;
        const cy=y+h+rise*t + Math.sin(t*Math.PI)*.16*scale;
        const cz=z+Math.sin(a)*reach*t;
        const spread=(.25+.17*Math.sin(t*Math.PI))*scale;
        leaf([cx,cy,cz],[cx+Math.cos(a+Math.PI/2)*spread,cy-.16*scale,cz+Math.sin(a+Math.PI/2)*spread],.105*scale,'leaf2');
        leaf([cx,cy,cz],[cx+Math.cos(a-Math.PI/2)*spread,cy-.16*scale,cz+Math.sin(a-Math.PI/2)*spread],.105*scale,'leaf1');
      }
    }
    shrub(x,y+h-.18*scale,z,.42*scale,1);
  }

  function broadTree(x,y,z,height=4.2,scale=1) {
    cylinder(x,y,z,.17*scale,height*scale*.62,'brick',7,'medium');
    const crownY=y+height*scale*.62;
    for(let i=0;i<7;i++) {
      const a=i*Math.PI*2/7;
      const bx=x+Math.cos(a)*.45*scale, bz=z+Math.sin(a)*.45*scale;
      line([x,y+height*.34*scale,z],[bx,crownY+.42*scale,bz],'rust',.004);
      shrub(bx,crownY-.1*scale,bz,.68*scale,i);
    }
    shrub(x,crownY,z,.82*scale,2);
  }

  function hangingVine(x, z, yTop, length, phase=0) {
    const pts=[];
    for(let i=0;i<=12;i++) {
      const t=i/12;
      pts.push([x+Math.sin(t*5+phase)*.23,yTop-t*length,z+Math.cos(t*4+phase)*.08]);
    }
    for(let i=0;i<pts.length-1;i++) line(pts[i],pts[i+1],'foliage',.008);
    for(let i=1;i<12;i+=2) {
      const p=pts[i];
      leaf(p,[p[0]-.28,p[1]+.09,p[2]+.05],.105,'leaf1');
      leaf(p,[p[0]+.25,p[1]-.02,p[2]-.04],.10,'leaf2');
    }
  }

  // ---------------------------------------------------------------------------
  // Water: raised channels, reflective pools and several falling ribbons
  // ---------------------------------------------------------------------------
  function waterSurface(x,z,w,d,y) {
    const p0=[x-w/2,y,z-d/2], p1=[x+w/2,y,z-d/2], p2=[x+w/2,y,z+d/2], p3=[x-w/2,y,z+d/2];
    quad(p0,p1,p2,p3,PALETTE.water.top,'teal');
    for(let i=0;i<5;i++) {
      const xx=x-w*.38+i*w*.19;
      line([xx,y+.015,z-d*.28],[xx+.42,y+.015,z+d*.22],'teal',0);
    }
  }

  function waterfall(x, zTop, zBottom, yTop, yBottom, width, phase=0) {
    const steps=18, left=[], right=[];
    for(let i=0;i<=steps;i++) {
      const t=i/steps;
      const yy=yTop+(yBottom-yTop)*t;
      const zz=zTop+(zBottom-zTop)*t;
      const wobble=Math.sin(t*13+phase)*.14 + Math.sin(t*27+phase*.7)*.055;
      const ww=width*(.88+.12*Math.sin(t*9+phase));
      const cx=x+wobble;
      left.push([cx-ww/2,yy,zz]); right.push([cx+ww/2,yy,zz]);
    }
    for(let i=0;i<steps;i++) {
      const col=i%4===0?PALETTE.water.lit:PALETTE.water.mid;
      pushQuad(left[i],right[i],right[i+1],left[i+1],col,(rng()-.5)*.01);
    }
    for(let i=0;i<steps;i+=2) {
      line(left[i],left[i+1],'teal',.003);
      line(right[i],right[i+1],'teal',.003);
    }
    for(let r=0;r<5;r++) {
      const t=.2+r*.14;
      const idx=Math.min(steps-1,Math.floor(t*steps));
      const yy=yTop+(yBottom-yTop)*t;
      const zz=zTop+(zBottom-zTop)*t;
      const cx=x+Math.sin(t*13+phase)*.14;
      line([cx-width*.25,yy,zz+.03],[cx+width*.22,yy-.07,zz+.03],'teal',0);
    }
  }

  // ---------------------------------------------------------------------------
  // Site plinth and broad ceremonial forecourt
  // ---------------------------------------------------------------------------
  box(-22,-.65,-18,44,.65,36,'plaza','bold');
  box(-22.45,-.72,-18.45,44.9,.09,36.9,'marble','bold');
  for(let x=-20;x<=20;x+=2.5) line([x,.015,-17.5],[x,.015,17.5],'faint',0);
  for(let z=-16;z<=16;z+=2.5) line([-21.5,.015,z],[21.5,.015,z],'faint',0);

  // Stepped paving bands leading to the garden's central ceremonial stair.
  for(let i=0;i<7;i++) {
    const yy=.04+i*.14;
    box(-5.7+i*.12,yy,10.6-i*.72,11.4-i*.24,.14,.82,'limestone','fine');
  }
  // Front reflecting basin and its stone coping.
  box(-5.2,.02,13.4,10.4,.38,2.5,'limestone','bold');
  box(-4.85,.30,13.72,9.7,.12,1.9,'marble','medium');
  waterSurface(0,14.65,9.0,1.55,.43);

  // ---------------------------------------------------------------------------
  // Four great stepped retaining terraces. The upper levels recede like a
  // monumental green ziggurat, leaving broad planted balconies between walls.
  // ---------------------------------------------------------------------------
  const tiers = [
    { base:.0,  top:4.15,  w:28.5, d:20.0, bays:7, name:'Lower Terrace' },
    { base:4.15,top:7.65,  w:23.4, d:16.4, bays:6, name:'Middle Terrace' },
    { base:7.65,top:10.75, w:18.4, d:12.8, bays:5, name:'Upper Terrace' },
    { base:10.75,top:13.55,w:13.4, d:9.2,  bays:4, name:'Crown Terrace' }
  ];

  tiers.forEach((t,idx)=>{
    const front=t.d/2;
    // Main front retaining wall, with cut-in shadow bays and polychrome bands.
    box(-t.w/2,t.base,front-.82,t.w,t.top-t.base,1.42,idx%2?'limestone':'plaster','bold');
    // Deep lower plinth and upper terracotta stringcourse.
    box(-t.w/2-.25,t.base,t.front||front+.45,t.w+.5,.36,.42,'brickDark','bold');
    box(-t.w/2-.22,t.top-.34,front-.96,t.w+.44,.28,.28,'brick','medium');
    // Fine courses and alternating masonry joints on the exposed façade.
    for(let c=1;c<5;c++) {
      const yy=t.base+(t.top-t.base)*c/5;
      line([-t.w/2+.1,yy,front+.61],[t.w/2-.1,yy,front+.61],'fine',0);
    }
    for(let j=1;j<18;j++) {
      const xx=-t.w/2+t.w*j/18;
      line([xx,t.base+.45,front+.61],[xx,t.top-.5,front+.61],'fine',0);
    }
    const bayW=t.w/t.bays;
    const radius=Math.min(1.22,bayW*.37,(t.top-t.base)*.36);
    const spring=t.top-radius-.27;
    for(let b=0;b<t.bays;b++) {
      const cx=-t.w/2+bayW*(b+.5);
      const z=front+.64;
      archBay(cx,z,t.base+.28,spring,radius,.31);
      prismColumn(cx-bayW*.5+ .13,z+.02,t.base+.06,spring+.14,.17, 'marble');
      prismColumn(cx+bayW*.5- .13,z+.02,t.base+.06,spring+.14,.17, 'marble');
      // Small enamel lozenge in the spandrel above each bay.
      const yy=spring+radius+.36;
      const diamond=[[cx,yy+.24,z+.66],[cx+.24,yy,z+.66],[cx,yy-.24,z+.66],[cx-.24,yy,z+.66]];
      polygonFan(diamond,idx%2?PALETTE.turquoise.mid:PALETTE.blue.mid);
    }
    // Side retaining wall and buttresses on the right flank.
    box(t.w/2-.82,t.base,-t.d/2+.2,1.42,t.top-t.base,t.d-.2,idx%2?'plaster':'limestone','bold');
    for(let b=0;b<Math.max(3,t.bays-1);b++) {
      const zz=-t.d/2+.7+(t.d-1.4)*b/(Math.max(3,t.bays-1)-1);
      box(t.w/2+.46,t.base+.22,zz-.20,.38,t.top-t.base-.42,.4,'marble','medium');
    }
    // The terrace deck and inner planting soil, exposed above each retaining wall.
    box(-t.w/2-.24,t.top-.12,-t.d/2-.22,t.w+.48,.28,t.d+.48,'marble','bold');
    box(-t.w/2+1.05,t.top+.035,-t.d/2+1.0,t.w-2.1,.14,t.d-2.0,'soil','fine');
    // Parapet coping on the two visible garden edges.
    box(-t.w/2-.18,t.top+.05,front-.78,t.w+.36,.32,.56,'limestone','medium');
    box(t.w/2-.78,t.top+.05,-t.d/2+.1,.56,.32,t.d-.1,'limestone','medium');
    // Planter boxes along the far and side edges.
    const planterY=t.top+.18;
    box(-t.w/2+1.0,planterY,-t.d/2+.95,t.w-2.0,.45,.72,'brick','medium');
    box(t.w/2-1.05,planterY,-t.d/2+1.0,.72,.45,t.d-2.0,'brick','medium');
    // Broad masses of clipped shrubs at regular intervals.
    for(let p=0;p<Math.floor(t.w/2.7);p++) {
      const px=-t.w/2+1.75+p*2.65;
      shrub(px,t.top+.38,-t.d/2+1.34,.73,(p+idx)%3);
    }
    for(let p=0;p<Math.floor(t.d/2.8);p++) {
      const pz=-t.d/2+1.8+p*2.55;
      shrub(t.w/2-1.35,t.top+.38,pz,.69,(p+idx+1)%3);
    }
    // Palms and spreading trees give each terrace a distinct canopy silhouette.
    if(idx===0) {
      palm(-10.2,t.top+.28,-4.5,4.8,.85);
      palm(9.7,t.top+.28,-5.0,5.3,.9);
      broadTree(-4.0,t.top+.25,-6.4,4.0,.85);
      broadTree(4.0,t.top+.25,-6.4,4.0,.86);
    } else if(idx===1) {
      palm(-7.8,t.top+.25,-3.5,4.5,.8);
      palm(7.2,t.top+.25,-3.2,4.8,.82);
      broadTree(0,t.top+.22,-4.6,4.1,.9);
    } else if(idx===2) {
      palm(-5.3,t.top+.22,-2.6,4.2,.72);
      palm(5.0,t.top+.22,-2.8,4.4,.75);
      broadTree(0,t.top+.2,-3.5,3.7,.78);
    } else {
      palm(-3.6,t.top+.2,-1.4,3.7,.65);
      palm(3.5,t.top+.2,-1.5,3.8,.68);
    }
  });

  // ---------------------------------------------------------------------------
  // Cascading watercourses: upper channels feed broad falls down the terraces.
  // Each level spills toward the viewer into a catchment pool on the next ledge.
  // ---------------------------------------------------------------------------
  for(let i=1;i<tiers.length;i++) {
    const upper=tiers[i], lower=tiers[i-1];
    const z0=upper.d/2+.48, z1=lower.d/2+.56;
    const dropTop=upper.top-.05, dropBottom=lower.top+.42;
    const count=i===1?4:(i===2?3:2);
    for(let k=0;k<count;k++) {
      const x=-upper.w*.34+(upper.w*.68)*(k/(count-1));
      // Stone spout lip and turquoise channel at the top of each fall.
      box(x-.56,upper.top-.04,z0-.16,1.12,.22,.68,'turquoise','medium');
      waterSurface(x,z0+.18,.82,.52,upper.top+.075);
      waterfall(x,z0+.28,z1,dropTop,dropBottom,.72+(k%2)*.2,i*1.7+k);
      // Catchment trough on the balcony below; etched ripples mark the landing.
      box(x-.9,lower.top+.08,z1-.85,1.8,.3,1.45,'limestone','medium');
      waterSurface(x,z1-.12,1.48,1.03,lower.top+.405);
    }
  }
  // Two long rills carry water across the highest planted terrace.
  box(-4.8,13.72,-2.15,9.6,.22,.72,'turquoise','medium');
  waterSurface(0,-1.78,8.9,.46,13.96);
  box(-.7,13.82,-3.35,1.4,.44,1.55,'limestone','bold');
  waterSurface(0,-3.2,1.05,1.1,14.28);

  // Vines trail from the outer lips of every balcony, interleaved with the falls.
  tiers.forEach((t,idx)=>{
    const n=idx===0?9:idx===1?7:idx===2?5:3;
    for(let i=0;i<n;i++) {
      const x=-t.w*.43+(t.w*.86)*(i/(n-1));
      if(i%2===0) hangingVine(x,t.d/2+.88,t.top+.08,.95+idx*.22,i*.7+idx);
    }
  });

  // ---------------------------------------------------------------------------
  // Crown palace: glazed-blue ceremonial pavilion, columns and crenellated roof
  // ---------------------------------------------------------------------------
  const crownY=tiers[3].top+.34;
  box(-5.1,crownY,-3.45,10.2,.42,6.9,'brickDark','bold');
  box(-4.75,crownY+.42,-3.15,9.5,2.55,2.95,'plaster','bold');
  // Deep blue glazed wall panels and gold-toned pilaster strips.
  for(let i=0;i<5;i++) {
    const x=-3.85+i*1.92;
    box(x-.46,crownY+.86,-.27,.92,1.55,.12,'blue','medium');
    box(x-.52,crownY+.78,-.34,.12,1.72,.18,'brick','fine');
    box(x+.4,crownY+.78,-.34,.12,1.72,.18,'brick','fine');
  }
  // Pavilion's open front portico.
  for(let i=0;i<6;i++) {
    const x=-4.25+i*1.7;
    prismColumn(x,.88,crownY+.44,crownY+2.75,.20,'marble');
  }
  for(let i=0;i<5;i++) {
    const cx=-3.4+i*1.7;
    archBay(cx,1.18,crownY+.48,crownY+1.95,.72,.25);
  }
  box(-5.25,crownY+2.92,-3.62,10.5,.42,7.25,'blue','bold');
  box(-5.48,crownY+3.34,-3.82,10.96,.28,7.65,'brick','bold');
  // Crown crenellations, alternating glazed blue and warm sandstone.
  for(let i=0;i<13;i++) {
    const x=-5.1+i*.85;
    box(x,crownY+3.62,-3.78,.42,.72,.48,i%2?'blue':'limestone','medium');
    box(x,crownY+3.62,3.48,.42,.72,.48,i%2?'blue':'limestone','medium');
  }
  for(let i=0;i<8;i++) {
    const z=-3.35+i*.94;
    box(5.0,crownY+3.62,z,.48,.72,.42,i%2?'blue':'limestone','medium');
    box(-5.48,crownY+3.62,z,.48,.72,.42,i%2?'blue':'limestone','medium');
  }
  // A monumental stepped roof mass and finial behind the portico.
  box(-3.0,crownY+3.35,-2.55,6.0,.62,4.8,'blue','bold');
  box(-2.35,crownY+3.97,-2.05,4.7,.58,3.8,'brick','medium');
  box(-1.7,crownY+4.55,-1.5,3.4,.54,2.7,'limestone','medium');
  cylinder(0,crownY+5.08,0,.32,1.35,'brick',8,'bold');
  // Small corner towers establish a monumental skyline.
  [[-5.8,-3.9],[5.8,-3.9],[-5.8,3.95],[5.8,3.95]].forEach((p,i)=>{
    const [x,z]=p;
    box(x-.68,crownY+2.8,z-.68,1.36,1.05,1.36,'brickDark','bold');
    box(x-.54,crownY+3.85,z-.54,1.08,.32,1.08,'blue','medium');
    box(x-.42,crownY+4.17,z-.42,.84,.72,.84,'limestone','bold');
    box(x-.56,crownY+4.89,z-.56,1.12,.22,1.12,'brick','medium');
    cylinder(x,crownY+5.11,z,.16,.7,'blue',8,'bold');
  });

  // ---------------------------------------------------------------------------
  // Monumental stair on the left flank, with landings between terraces
  // ---------------------------------------------------------------------------
  const stairStart=[-16.2,.15,8.7], stairEnd=[-7.5,13.7,-3.1];
  const stairN=28;
  for(let i=0;i<stairN;i++) {
    const t=i/(stairN-1);
    const x=stairStart[0]+(stairEnd[0]-stairStart[0])*t;
    const z=stairStart[2]+(stairEnd[2]-stairStart[2])*t;
    const y=.22+(stairEnd[1]-.22)*t;
    box(x-.82,y-.14,z-.38,1.64,.28,.78,'limestone','medium');
    line([x-.82,y+.015,z+.02],[x+.82,y+.015,z+.02],'bold',0);
  }
  // Low cheek walls track the ceremonial stair.
  for(let side of [-1,1]) {
    for(let i=0;i<14;i++) {
      const t=i/13;
      const x=stairStart[0]+(stairEnd[0]-stairStart[0])*t;
      const z=stairStart[2]+(stairEnd[2]-stairStart[2])*t+side*.62;
      const y=.35+(stairEnd[1]-.35)*t;
      box(x-.11,y,z-.18,.22,.5,.36,'brick','fine');
    }
  }

  // ---------------------------------------------------------------------------
  // Babylonian garden precinct: palms, low walls, canals and distant city masses
  // ---------------------------------------------------------------------------
  // Forecourt water rills and small ornamental pools.
  box(-17,.02,-1.0,2.5,.2,11.5,'limestone','medium');
  waterSurface(-15.75,.0,1.9,10.8,.25);
  box(14.4,.02,-4.4,2.2,.2,8.8,'limestone','medium');
  waterSurface(15.5,-4.0,1.65,8.1,.25);
  // Date palms frame the composition without obscuring the terraces.
  palm(-18,.08,-9.4,6.8,1.05);
  palm(18,.08,-10.2,7.1,1.02);
  palm(-19,.08,7.0,5.9,.86);
  palm(19,.08,7.7,6.1,.9);
  broadTree(-16,.06,1.0,3.0,.62);
  broadTree(16,.06,2.1,3.2,.62);

  // Faint city enclosure and distant gate-like masses at the diagram edge.
  box(-25,-.5,-15,3.0,6.2,10.0,'ghost','faint');
  box(22,-.5,-15,3.0,8.2,10.0,'ghost','faint');
  box(-22,-.5,-20,44,3.2,1.5,'ghost','faint');
  box(-2.6,-.45,-22.5,5.2,7.0,1.2,'ghost','faint');
  box(-1.9,6.55,-22.58,3.8,1.1,1.35,'ghost','faint');
  // Light construction axes and site boundaries.
  for(let s=-24;s<=24;s+=4) {
    line([s,-.47,-24],[s,-.47,-20],'faint',0);
    line([-24,-.47,s],[-20,-.47,s],'faint',0);
  }
  line([-25,-.47,-19],[-25,-.47,19],'faint',0);
  line([25,-.47,-19],[25,-.47,19],'faint',0);

  // ---------------------------------------------------------------------------
  // Assemble single wash mesh + independent weighted ink passes
  // ---------------------------------------------------------------------------
  const washGeo = new THREE.BufferGeometry();
  washGeo.setAttribute('position',new THREE.Float32BufferAttribute(washPositions,3));
  washGeo.setAttribute('color',new THREE.Float32BufferAttribute(washColors,3));
  washGeo.computeVertexNormals();
  const washMat = new THREE.MeshBasicMaterial({
    vertexColors:true, side:THREE.DoubleSide,
    polygonOffset:true, polygonOffsetFactor:1.3, polygonOffsetUnits:1.3
  });
  scene.add(new THREE.Mesh(washGeo,washMat));

  function lineMesh(vertices,hex,opacity) {
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
    return new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:hex,transparent:true,opacity}));
  }
  scene.add(lineMesh(ink.bold,0x241c17,.91));
  scene.add(lineMesh(ink.medium,0x382c23,.79));
  scene.add(lineMesh(ink.fine,0x4a4035,.45));
  scene.add(lineMesh(ink.rust,0x8f4d37,.65));
  scene.add(lineMesh(ink.teal,0x4d8583,.66));
  scene.add(lineMesh(ink.foliage,0x526846,.62));
  scene.add(lineMesh(ink.faint,0x756b60,.30));

  window.addEventListener('resize',()=>{
    const a=window.innerWidth/window.innerHeight;
    camera.left=-frustumSize*a/2; camera.right=frustumSize*a/2;
    camera.top=frustumSize/2; camera.bottom=-frustumSize/2;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
    generatePaperOverlay();
  });
  function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
  animate();
})();
</script>
</body>
</html>
