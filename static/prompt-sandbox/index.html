<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Prompt Templating Sandbox</title>
    <style>
        
        
        * { box-sizing: border-box; }
        body { font-family: "Outfit", system-ui, sans-serif; font-size: 15px; line-height: 1.45; background: var(--bg); color: var(--ink); max-width: 800px; margin: 0 auto; padding: 2rem; }
        h1 { font-size: 1.55rem; line-height: 1.2; margin: 0 0 0.5rem; }
        :focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
        p { color: var(--mut); }
        code { font-family: "JetBrains Mono", monospace; font-size: 0.9em; background: var(--chip); padding: 0.1em 0.35em; border-radius: 6px; color: var(--ink); }
        label { font-weight: 600; }
        textarea { width: 100%; height: 150px; margin-bottom: 1rem; font-family: "JetBrains Mono", monospace; font-size: 0.9rem; padding: 0.6rem; background: var(--panel2); color: var(--ink); border: 1px solid var(--line2); border-radius: 9px; }
        textarea:focus, input:focus { border-color: var(--acc); outline: none; }
        .variables { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .var-group { display: flex; flex-direction: column; }
        .var-group label { font-family: "JetBrains Mono", monospace; font-size: 0.85rem; color: var(--mut); }
        input { padding: 0.5rem 0.6rem; margin-top: 0.25rem; background: var(--panel2); color: var(--ink); border: 1px solid var(--line2); border-radius: 9px; font: inherit; }
        .output-box { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 1rem; border-radius: 14px; white-space: pre-wrap; font-family: "JetBrains Mono", monospace; font-size: 0.9rem; margin-top: 1rem; }
        button { font: inherit; font-weight: 600; padding: 0.5rem 1rem; cursor: pointer; background: var(--acc); color: var(--acc-ink); border: none; border-radius: 9px; }
        button:hover { background: var(--acc-strong); }
    </style>

<meta name="description" content="A testing ground to run and validate agent system prompts against different variable inputs.">

<body>
<a class="back tk-fallback" href="../tools/">&larr; All tools</a>
    <h1>Prompt Templating Sandbox</h1>
    <p>Test prompt templates with variables. Use <code>{{variable_name}}</code> syntax.</p>

    <label for="template">Template:</label>
    <textarea id="template">You are a helpful assistant. Please summarize the following text for a {{audience}} audience:

{{input_text}}</textarea>

    <div id="variables-container" class="variables">
        <!-- Variables will be auto-generated here -->
    </div>

    <button onclick="renderTemplate()">Render Prompt</button>

    <h3>Output:</h3>
    <div id="output" class="output-box"></div>

    <script>
        const templateEl = document.getElementById('template');
        const varsContainer = document.getElementById('variables-container');
        const outputEl = document.getElementById('output');

        let currentVars = new Set();

        function extractVariables(text) {
            const regex = /{{([\w_]+)}}/g;
            const vars = new Set();
            let match;
            while ((match = regex.exec(text)) !== null) {
                vars.add(match[1]);
            }
            return vars;
        }

        function updateInputs() {
            const text = templateEl.value;
            const newVars = extractVariables(text);

            // Remove old variables
            for (const v of currentVars) {
                if (!newVars.has(v)) {
                    const el = document.getElementById(`var-group-${v}`);
                    if (el) el.remove();
                }
            }

            // Add new variables
            for (const v of newVars) {
                if (!currentVars.has(v)) {
                    const div = document.createElement('div');
                    div.className = 'var-group';
                    div.id = `var-group-${v}`;

                    const label = document.createElement('label');
                    label.textContent = v;
                    label.htmlFor = `input-${v}`;

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = `input-${v}`;
                    input.placeholder = `Value for ${v}`;

                    div.appendChild(label);
                    div.appendChild(input);
                    varsContainer.appendChild(div);
                }
            }

            currentVars = newVars;
            renderTemplate();
        }

        function renderTemplate() {
            let text = templateEl.value;
            for (const v of currentVars) {
                const val = document.getElementById(`input-${v}`).value;
                text = text.replaceAll(`{{${v}}}`, val || `{{${v}}}`);
            }
            outputEl.textContent = text;
        }

        templateEl.addEventListener('input', updateInputs);
        updateInputs();
    </script>
</body>
</html>
