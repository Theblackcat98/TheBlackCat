<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Text Diff Viewer: compare two texts line by line with word-level highlighting, side-by-side or unified, entirely in the browser." />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Text Diff Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #edf1f5;
      --paper-2: #ffffff;
      --paper-3: #e2e9ef;
      --surface-2: #f3f6f9;
      --ink: #182430;
      --ink-2: #45586a;
      --ink-3: #71808f;
      --rule: #d3dce3;
      --accent: #2f6bd8;
      --accent-ink: #2056b8;
      --accent-wash: #dde8fa;
      --focus: #2f6bd8;
      --add-bg: #e2f3e4;
      --add-wash: #bfe6c6;
      --add-ink: #177245;
      --del-bg: #fbe9e7;
      --del-wash: #f5c6c0;
      --del-ink: #b3261e;
      --empty-bg: #e8edf1;
      --ui-font: "Outfit", sans-serif;
      --mono-font: "JetBrains Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0f151b;
        --paper-2: #161e27;
        --paper-3: #232f3d;
        --surface-2: #1b2530;
        --ink: #e6edf3;
        --ink-2: #a9b8c4;
        --ink-3: #7d8fa0;
        --rule: #2a3644;
        --accent: #6ea8fe;
        --accent-ink: #9cc2ff;
        --accent-wash: #1d2c47;
        --focus: #6ea8fe;
        --add-bg: #17301f;
        --add-wash: #1f4d2e;
        --add-ink: #4cc38a;
        --del-bg: #331d1b;
        --del-wash: #5c2b26;
        --del-ink: #f28b82;
        --empty-bg: #131a21;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--ui-font);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    .header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header h1 { margin: 0; font-size: 24px; font-weight: 600; }
    .header p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }

    .container { max-width: 1240px; margin: 0 auto; padding: 24px 24px 64px; }

    .card {
      background: var(--paper-2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(24, 36, 48, .05), 0 8px 28px rgba(24, 36, 48, .06);
      padding: 18px;
      margin-bottom: 18px;
    }

    .label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 8px;
    }

    .panes { display: grid; grid-template-columns: 1fr; gap: 18px; }
    @media (min-width: 820px) { .panes { grid-template-columns: 1fr 1fr; } }

    textarea.text-input {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--ink);
      font-family: var(--mono-font);
      font-size: 13px;
      line-height: 1.55;
      padding: 12px 14px;
    }

    .toolbar { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; justify-content: space-between; }
    fieldset.options { border: 0; margin: 0; padding: 0; }
    fieldset.options legend { padding: 0; }
    .option-row { display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .option { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
    .option input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

    .segmented {
      display: inline-flex;
      background: var(--paper-3);
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }
    .segmented button {
      border: 0;
      background: transparent;
      color: var(--ink-2);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .segmented button[aria-pressed="true"] { background: var(--paper-2); color: var(--ink); box-shadow: 0 1px 2px rgba(24, 36, 48, .18); }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      border: 1px solid var(--rule);
      background: var(--paper-2);
      color: var(--ink);
      border-radius: 9px;
      padding: 8px 14px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--ink-3); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    .btn.primary:hover { background: var(--accent-ink); }
    @media (prefers-color-scheme: dark) { .btn.primary { color: #0d1524; } }

    .stats { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid var(--rule); border-radius: 999px;
      padding: 5px 12px; font-size: 13px; color: var(--ink-2);
      background: var(--surface-2);
    }
    .chip b { font-family: var(--mono-font); font-weight: 600; color: var(--ink); }
    .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.add { background: var(--add-ink); }
    .dot.del { background: var(--del-ink); }
    .dot.chg { background: var(--accent); }
    .status { font-size: 13px; color: var(--ink-3); margin-left: auto; }

    .result-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
    .diff { font-family: var(--mono-font); font-size: 12.5px; line-height: 1.55; min-width: 560px; }
    .diff-row { display: grid; border-bottom: 1px solid var(--rule); }
    .diff-row:last-child { border-bottom: 0; }
    .split-row { grid-template-columns: 3.4em 1fr 3.4em 1fr; }
    .unified-row { grid-template-columns: 3.4em 3.4em 1.6em 1fr; }
    .cell { padding: 2px 10px; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
    .cell.num {
      text-align: right; color: var(--ink-3); user-select: none;
      background: var(--surface-2); border-right: 1px solid var(--rule);
      font-size: 11.5px; padding-top: 3px;
    }
    .cell.sign { text-align: center; user-select: none; font-weight: 600; padding-left: 2px; padding-right: 2px; }
    .cell.empty { background: var(--empty-bg); }
    .row-add .cell.line { background: var(--add-bg); }
    .row-add .cell.sign { color: var(--add-ink); }
    .row-del .cell.line { background: var(--del-bg); }
    .row-del .cell.sign { color: var(--del-ink); }
    .row-changed .cell.line.del-line { background: var(--del-bg); }
    .row-changed .cell.line.add-line { background: var(--add-bg); }
    .w-add { background: var(--add-wash); border-radius: 3px; padding: 0 1px; }
    .w-del { background: var(--del-wash); border-radius: 3px; padding: 0 1px; }
    .empty-state { padding: 28px 18px; text-align: center; color: var(--ink-3); font-family: var(--ui-font); font-size: 14px; }
  </style>
</head>
<body>
  <header class="header">
    <div>
      <h1>Text Diff Viewer</h1>
      <p>Compare two texts line by line, with word-level highlighting inside changed lines. Everything runs locally in your browser.</p>
    </div>
  </header>

  <main class="container">
    <section class="card" aria-label="Texts to compare">
      <div class="panes">
        <div>
          <label class="label" for="original-input">Original</label>
          <textarea class="text-input" id="original-input" aria-label="Original text" spellcheck="false" placeholder="Paste the original text here…"></textarea>
        </div>
        <div>
          <label class="label" for="revised-input">Revised</label>
          <textarea class="text-input" id="revised-input" aria-label="Revised text" spellcheck="false" placeholder="Paste the revised text here…"></textarea>
        </div>
      </div>
    </section>

    <section class="card" aria-label="Diff options and actions">
      <div class="toolbar">
        <fieldset class="options">
          <legend class="label">Compare options</legend>
          <div class="option-row">
            <label class="option"><input type="checkbox" id="opt-whitespace" /> Ignore leading/trailing whitespace</label>
            <label class="option"><input type="checkbox" id="opt-case" /> Ignore case</label>
            <label class="option"><input type="checkbox" id="opt-blank" /> Ignore blank lines</label>
          </div>
        </fieldset>
        <div>
          <span class="label" id="view-label">Result view</span>
          <div class="segmented" role="group" aria-labelledby="view-label">
            <button type="button" id="view-split" data-view="split" aria-pressed="true">Side by side</button>
            <button type="button" id="view-unified" data-view="unified" aria-pressed="false">Unified</button>
          </div>
        </div>
        <div>
          <span class="label">Actions</span>
          <div class="actions">
            <button type="button" class="btn" id="swap-btn">Swap panes</button>
            <button type="button" class="btn" id="sample-btn">Load sample</button>
            <button type="button" class="btn" id="copy-btn">Copy unified diff</button>
            <button type="button" class="btn" id="clear-btn">Clear</button>
          </div>
        </div>
      </div>
    </section>

    <section class="card" aria-label="Diff result">
      <div class="stats" aria-live="polite">
        <span class="chip"><span class="dot add" aria-hidden="true"></span>Added <b id="stat-added">0</b></span>
        <span class="chip"><span class="dot del" aria-hidden="true"></span>Removed <b id="stat-removed">0</b></span>
        <span class="chip"><span class="dot chg" aria-hidden="true"></span>Changed <b id="stat-changed">0</b></span>
        <span class="status" id="copy-status" role="status"></span>
      </div>
      <div class="result-wrap" style="margin-top:14px;">
        <div class="diff" id="diff-result" aria-label="Diff result"></div>
      </div>
    </section>
  </main>

  <script>
    "use strict";
    var STORAGE_KEY = "text-diff-viewer:v1";

    var originalInput = document.getElementById("original-input");
    var revisedInput = document.getElementById("revised-input");
    var optWhitespace = document.getElementById("opt-whitespace");
    var optCase = document.getElementById("opt-case");
    var optBlank = document.getElementById("opt-blank");
    var resultEl = document.getElementById("diff-result");
    var statAdded = document.getElementById("stat-added");
    var statRemoved = document.getElementById("stat-removed");
    var statChanged = document.getElementById("stat-changed");
    var copyStatus = document.getElementById("copy-status");
    var viewButtons = [document.getElementById("view-split"), document.getElementById("view-unified")];
    var viewMode = "split";
    var lastUnifiedText = "";

    var SAMPLE_ORIGINAL = [
      "function greet(name) {",
      "  const message = 'Hello, ' + name;",
      "  console.log(message);",
      "  return message;",
      "}",
      "",
      "greet('world');",
      "greet('reader');"
    ].join("\n");
    var SAMPLE_REVISED = [
      "function greet(name, punct) {",
      "  const message = 'Hello, ' + name + punct;",
      "  console.log(message);",
      "  return message;",
      "}",
      "",
      "greet('world', '!');",
      "greet('diff viewer', '!');",
      "// done"
    ].join("\n");

    function splitLines(text) {
      if (text === "") return [];
      return text.replace(/\r\n?/g, "\n").split("\n");
    }

    function normalize(line) {
      var s = line;
      if (optWhitespace.checked) s = s.trim();
      if (optCase.checked) s = s.toLowerCase();
      return s;
    }

    // Build the comparable line list for one side: applies the blank-line
    // option and keeps a pointer back to the original 1-based line number.
    function prepare(text) {
      var raw = splitLines(text);
      var out = [];
      for (var i = 0; i < raw.length; i++) {
        if (optBlank.checked && raw[i].trim() === "") continue;
        out.push({ text: raw[i], num: i + 1, key: normalize(raw[i]) });
      }
      return out;
    }

    // Longest-common-subsequence over two key arrays. Returns the classic
    // edit script as ops: {type: 'same'|'del'|'add', aIndex, bIndex}.
    // Common prefixes/suffixes are trimmed first so the DP table only
    // covers the changed middle; an oversized middle falls back to
    // delete-all + insert-all rather than allocating a huge table.
    function diffKeys(aKeys, bKeys) {
      var start = 0;
      var aEnd = aKeys.length, bEnd = bKeys.length;
      while (start < aEnd && start < bEnd && aKeys[start] === bKeys[start]) start++;
      while (aEnd > start && bEnd > start && aKeys[aEnd - 1] === bKeys[bEnd - 1]) { aEnd--; bEnd--; }

      var ops = [];
      var i, j;
      for (i = 0; i < start; i++) ops.push({ type: "same", a: i, b: i });

      var aMid = aKeys.slice(start, aEnd), bMid = bKeys.slice(start, bEnd);
      var n = aMid.length, m = bMid.length;
      if (n === 0) {
        for (j = 0; j < m; j++) ops.push({ type: "add", b: start + j });
      } else if (m === 0) {
        for (i = 0; i < n; i++) ops.push({ type: "del", a: start + i });
      } else if (n * m > 16000000) {
        for (i = 0; i < n; i++) ops.push({ type: "del", a: start + i });
        for (j = 0; j < m; j++) ops.push({ type: "add", b: start + j });
      } else {
        var width = m + 1;
        var table = new Int32Array((n + 1) * width);
        for (i = n - 1; i >= 0; i--) {
          for (j = m - 1; j >= 0; j--) {
            table[i * width + j] = aMid[i] === bMid[j]
              ? table[(i + 1) * width + j + 1] + 1
              : Math.max(table[(i + 1) * width + j], table[i * width + j + 1]);
          }
        }
        i = 0; j = 0;
        while (i < n && j < m) {
          if (aMid[i] === bMid[j]) { ops.push({ type: "same", a: start + i, b: start + j }); i++; j++; }
          else if (table[(i + 1) * width + j] >= table[i * width + j + 1]) { ops.push({ type: "del", a: start + i }); i++; }
          else { ops.push({ type: "add", b: start + j }); j++; }
        }
        while (i < n) { ops.push({ type: "del", a: start + i }); i++; }
        while (j < m) { ops.push({ type: "add", b: start + j }); j++; }
      }

      for (i = aEnd, j = bEnd; i < aKeys.length; i++, j++) ops.push({ type: "same", a: i, b: j });
      return ops;
    }

    // Word-level LCS for one changed line pair. Tokens keep their
    // whitespace so the segments rebuild the exact original strings.
    function wordDiff(oldText, newText) {
      var a = oldText.split(/(\s+)/), b = newText.split(/(\s+)/);
      var n = a.length, m = b.length;
      var width = m + 1;
      var table = new Int32Array((n + 1) * width);
      for (var i = n - 1; i >= 0; i--) {
        for (var j = m - 1; j >= 0; j--) {
          table[i * width + j] = a[i] === b[j]
            ? table[(i + 1) * width + j + 1] + 1
            : Math.max(table[(i + 1) * width + j], table[i * width + j + 1]);
        }
      }
      var oldSegs = [], newSegs = [];
      var x = 0, y = 0;
      function push(segs, text, changed) {
        if (text === "") return;
        var last = segs[segs.length - 1];
        if (last && last.changed === changed) last.text += text;
        else segs.push({ text: text, changed: changed });
      }
      while (x < n && y < m) {
        if (a[x] === b[y]) { push(oldSegs, a[x], false); push(newSegs, b[y], false); x++; y++; }
        else if (table[(x + 1) * width + y] >= table[x * width + y + 1]) { push(oldSegs, a[x], true); x++; }
        else { push(newSegs, b[y], true); y++; }
      }
      while (x < n) { push(oldSegs, a[x], true); x++; }
      while (y < m) { push(newSegs, b[y], true); y++; }
      return { oldSegs: oldSegs, newSegs: newSegs };
    }

    // Group the raw line ops into display rows. A deletion block followed
    // by an addition block is paired up line-by-line as "changed" rows so
    // word highlighting has something to attach to; unpaired lines stay
    // pure removals/additions.
    function buildRows(ops, aLines, bLines) {
      var rows = [];
      var stats = { added: 0, removed: 0, changed: 0 };
      var k = 0;
      while (k < ops.length) {
        if (ops[k].type === "same") {
          rows.push({ kind: "same", a: aLines[ops[k].a], b: bLines[ops[k].b] });
          k++;
          continue;
        }
        var dels = [], adds = [];
        while (k < ops.length && ops[k].type === "del") { dels.push(aLines[ops[k].a]); k++; }
        while (k < ops.length && ops[k].type === "add") { adds.push(bLines[ops[k].b]); k++; }
        var pairs = Math.min(dels.length, adds.length);
        for (var p = 0; p < pairs; p++) {
          rows.push({ kind: "changed", a: dels[p], b: adds[p], words: wordDiff(dels[p].text, adds[p].text) });
          stats.changed++; stats.removed++; stats.added++;
        }
        for (var d = pairs; d < dels.length; d++) { rows.push({ kind: "del", a: dels[d] }); stats.removed++; }
        for (var q = pairs; q < adds.length; q++) { rows.push({ kind: "add", b: adds[q] }); stats.added++; }
      }
      return { rows: rows, stats: stats };
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function segsHtml(segs, cls) {
      var html = "";
      for (var i = 0; i < segs.length; i++) {
        html += segs[i].changed
          ? '<span class="' + cls + '">' + escapeHtml(segs[i].text) + "</span>"
          : escapeHtml(segs[i].text);
      }
      return html || "&nbsp;";
    }

    function plainCell(line) { return escapeHtml(line.text) || "&nbsp;"; }

    function renderSplit(rows) {
      var html = "";
      rows.forEach(function (r) {
        if (r.kind === "same") {
          html += '<div class="diff-row split-row row-same">'
            + '<div class="cell num">' + r.a.num + '</div><div class="cell line">' + plainCell(r.a) + '</div>'
            + '<div class="cell num">' + r.b.num + '</div><div class="cell line">' + plainCell(r.b) + '</div></div>';
        } else if (r.kind === "changed") {
          html += '<div class="diff-row split-row row-changed">'
            + '<div class="cell num">' + r.a.num + '</div><div class="cell line del-line">' + segsHtml(r.words.oldSegs, "w-del") + '</div>'
            + '<div class="cell num">' + r.b.num + '</div><div class="cell line add-line">' + segsHtml(r.words.newSegs, "w-add") + '</div></div>';
        } else if (r.kind === "del") {
          html += '<div class="diff-row split-row row-del">'
            + '<div class="cell num">' + r.a.num + '</div><div class="cell line">' + plainCell(r.a) + '</div>'
            + '<div class="cell num"></div><div class="cell empty"></div></div>';
        } else {
          html += '<div class="diff-row split-row row-add">'
            + '<div class="cell num"></div><div class="cell empty"></div>'
            + '<div class="cell num">' + r.b.num + '</div><div class="cell line">' + plainCell(r.b) + '</div></div>';
        }
      });
      return html;
    }

    function renderUnified(rows) {
      var html = "";
      function row(cls, aNum, bNum, sign, content) {
        return '<div class="diff-row unified-row ' + cls + '">'
          + '<div class="cell num">' + (aNum || "") + '</div>'
          + '<div class="cell num">' + (bNum || "") + '</div>'
          + '<div class="cell sign">' + sign + '</div>'
          + '<div class="cell line">' + content + '</div></div>';
      }
      rows.forEach(function (r) {
        if (r.kind === "same") html += row("row-same", r.a.num, r.b.num, " ", plainCell(r.a));
        else if (r.kind === "changed") {
          html += row("row-del", r.a.num, "", "−", segsHtml(r.words.oldSegs, "w-del"));
          html += row("row-add", "", r.b.num, "+", segsHtml(r.words.newSegs, "w-add"));
        }
        else if (r.kind === "del") html += row("row-del", r.a.num, "", "−", plainCell(r.a));
        else html += row("row-add", "", r.b.num, "+", plainCell(r.b));
      });
      return html;
    }

    function buildUnifiedText(rows, aCount, bCount) {
      var lines = ["--- Original", "+++ Revised", "@@ -1," + aCount + " +1," + bCount + " @@"];
      rows.forEach(function (r) {
        if (r.kind === "same") lines.push(" " + r.a.text);
        else if (r.kind === "changed") { lines.push("-" + r.a.text); lines.push("+" + r.b.text); }
        else if (r.kind === "del") lines.push("-" + r.a.text);
        else lines.push("+" + r.b.text);
      });
      return lines.join("\n");
    }

    function update() {
      var aLines = prepare(originalInput.value);
      var bLines = prepare(revisedInput.value);
      var ops = diffKeys(aLines.map(function (l) { return l.key; }), bLines.map(function (l) { return l.key; }));
      var built = buildRows(ops, aLines, bLines);
      statAdded.textContent = built.stats.added;
      statRemoved.textContent = built.stats.removed;
      statChanged.textContent = built.stats.changed;
      lastUnifiedText = buildUnifiedText(built.rows, aLines.length, bLines.length);
      if (originalInput.value === "" && revisedInput.value === "") {
        resultEl.innerHTML = '<div class="empty-state">Paste text into both panes — the diff updates as you type.</div>';
      } else if (built.stats.added === 0 && built.stats.removed === 0) {
        resultEl.innerHTML = '<div class="empty-state">No differences under the current options.</div>';
      } else {
        resultEl.innerHTML = viewMode === "split" ? renderSplit(built.rows) : renderUnified(built.rows);
      }
      saveState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          original: originalInput.value,
          revised: revisedInput.value,
          whitespace: optWhitespace.checked,
          ignoreCase: optCase.checked,
          blank: optBlank.checked,
          view: viewMode
        }));
      } catch (e) { /* private mode etc. — persistence is best-effort */ }
    }

    function loadState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        var s = JSON.parse(raw);
        if (typeof s.original === "string") originalInput.value = s.original;
        if (typeof s.revised === "string") revisedInput.value = s.revised;
        optWhitespace.checked = !!s.whitespace;
        optCase.checked = !!s.ignoreCase;
        optBlank.checked = !!s.blank;
        if (s.view === "unified" || s.view === "split") setView(s.view);
      } catch (e) { /* corrupted state — start fresh */ }
    }

    function setView(mode) {
      viewMode = mode;
      viewButtons.forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.view === mode ? "true" : "false"); });
    }

    originalInput.addEventListener("input", update);
    revisedInput.addEventListener("input", update);
    [optWhitespace, optCase, optBlank].forEach(function (el) { el.addEventListener("change", update); });
    viewButtons.forEach(function (b) {
      b.addEventListener("click", function () { setView(b.dataset.view); update(); });
    });

    document.getElementById("swap-btn").addEventListener("click", function () {
      var t = originalInput.value;
      originalInput.value = revisedInput.value;
      revisedInput.value = t;
      update();
    });

    document.getElementById("clear-btn").addEventListener("click", function () {
      originalInput.value = "";
      revisedInput.value = "";
      update();
      originalInput.focus();
    });

    document.getElementById("sample-btn").addEventListener("click", function () {
      originalInput.value = SAMPLE_ORIGINAL;
      revisedInput.value = SAMPLE_REVISED;
      update();
    });

    document.getElementById("copy-btn").addEventListener("click", function () {
      function done() {
        copyStatus.textContent = "Unified diff copied.";
        setTimeout(function () { copyStatus.textContent = ""; }, 2500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastUnifiedText).then(done, function () { copyStatus.textContent = "Copy failed — clipboard unavailable."; });
      } else {
        var ta = document.createElement("textarea");
        ta.value = lastUnifiedText;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); done(); }
        catch (e) { copyStatus.textContent = "Copy failed — clipboard unavailable."; }
        document.body.removeChild(ta);
      }
    });

    loadState();
    update();
  </script>
</body>
</html>
