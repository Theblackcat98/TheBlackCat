  <script>
    function mulberry32(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rng = mulberry32(80); // 80 AD dedication year

    function generatePaperOverlay() {
      const canvas = document.getElementById('paper-overlay');
      const w = (canvas.width = window.innerWidth);
      const h = (canvas.height = window.innerHeight);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ede9e0';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(130, 120, 108, 0.09)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x < w; x += 28) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
      for (let y = 0; y < h; y += 28) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
      ctx.stroke();
      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;
      const lr = mulberry32(4108);
      for (let i = 0; i < d.length; i += 4) {
        const g = (lr() - 0.5) * 18;
        d[i] = Math.max(0, Math.min(255, d[i] + g));
        d[i+1] = Math.max(0, Math.min(255, d[i+1] + g));
        d[i+2] = Math.max(0, Math.min(255, d[i+2] + g));
      }
      ctx.putImageData(img, 0, 0);
    }
    generatePaperOverlay();

    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0xe5e0d6, 1);
    container.insertBefore(renderer.domElement, document.getElementById('paper-overlay'));

    const scene = new THREE.Scene();
    const frustumSize = 72;
    const aspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.OrthographicCamera(
      (-frustumSize * aspect) / 2, (frustumSize * aspect) / 2,
      frustumSize / 2, -frustumSize / 2, -250, 400
    );
    const targetPt = new THREE.Vector3(0, 5.5, 0);
    const camDist = 92;
    const defaultCamPos = new THREE.Vector3(camDist, targetPt.y + camDist * 0.78, camDist);
    camera.position.copy(defaultCamPos);
    camera.lookAt(targetPt);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(targetPt);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minZoom = 0.55;
    controls.maxZoom = 3.0;
    controls.update();

    window.addEventListener('dblclick', () => {
      camera.position.copy(defaultCamPos);
      controls.target.copy(targetPt);
      camera.zoom = 1;
      camera.updateProjectionMatrix();
      controls.update();
    });

    // =========================================================================
    // PALETTE & INK ENGINE
    // =========================================================================
    const PALETTE = {
      trav:   { lit: 0xefe7d6, mid: 0xdfd4be, shade: 0xc5b89e, top: 0xf4eee0, bot: 0x8e806b },
      tufa:   { lit: 0xd9cbb4, mid: 0xc5b59b, shade: 0xa8977d, top: 0xe3d7c3, bot: 0x766855 },
      brick:  { lit: 0xc2775b, mid: 0xaa6248, shade: 0x8a4b35, top: 0xd18a6d, bot: 0x5c3021 },
      marble: { lit: 0xf4efe5, mid: 0xe7dfd1, shade: 0xd2c8b8, top: 0xf8f5ee, bot: 0x998e7e },
      sand:   { lit: 0xe8d9ba, mid: 0xdcc9a5, shade: 0xc5b18c, top: 0xefe3c8, bot: 0x968567 },
      dark:   { lit: 0x62564c, mid: 0x4e443b, shade: 0x383029, top: 0x73665b, bot: 0x26201b },
      pine:   { lit: 0x789461, mid: 0x647f50, shade: 0x4f663e, top: 0x89a471, bot: 0x394b2d },
      plaza:  { lit: 0xe6dfd1, mid: 0xd9d0c0, shade: 0xc6bcab, top: 0xede7da, bot: 0x9c9180 },
      ghost:  { lit: 0xe6e0d4, mid: 0xdcd5c8, shade: 0xd0c8ba, top: 0xebe5da, bot: 0xb8b0a2 }
    };

    const washPositions = [], washColors = [];
    const inkLayers = { bold: [], medium: [], fine: [], rust: [], teal: [], faint: [] };
    const tc = new THREE.Color();
    const lightDir = new THREE.Vector3(-0.44, 0.65, 0.62).normalize();

    function shadeHex(palName, nx, ny, nz) {
      const p = PALETTE[palName] || PALETTE.trav;
      if (ny > 0.68) return p.top;
      if (ny < -0.60) return p.bot;
      const d = nx * lightDir.x + ny * lightDir.y + nz * lightDir.z;
      return d > 0.28 ? p.lit : d > -0.18 ? p.mid : p.shade;
    }
    function pushTriWorld(a, b, c, hex, sh = 0) {
      tc.setHex(hex);
      if (sh) tc.offsetHSL(0, 0, sh);
      washPositions.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
      for (let i = 0; i < 3; i++) washColors.push(tc.r, tc.g, tc.b);
    }
    function pushQuadWorld(p0, p1, p2, p3, hex, sh = 0) {
      pushTriWorld(p0, p1, p2, hex, sh);
      pushTriWorld(p0, p2, p3, hex, sh);
    }
    function quadN(pts, pal, n, sh = 0) {
      pushQuadWorld(pts[0], pts[1], pts[2], pts[3], shadeHex(pal, n[0], n[1], n[2]), sh);
    }
    function addLineWorld(a, b, layer = 'medium', ov = 0.015) {
      const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
      const L = Math.hypot(dx, dy, dz);
      if (L < 1e-5) return;
      const u = ov ? [dx / L * ov, dy / L * ov, dz / L * ov] : [0, 0, 0];
      const j = layer === 'faint' || !ov ? 0 : 0.004;
      const r = () => (rng() - 0.5) * j;
      const ax = a[0] - u[0] + r(), ay = a[1] - u[1] + r(), az = a[2] - u[2] + r();
      const bx = b[0] + u[0] + r(), by = b[1] + u[1] + r(), bz = b[2] + u[2] + r();
      (inkLayers[layer] || inkLayers.medium).push(ax, ay, az, bx, by, bz);
      if (layer === 'bold') {
        inkLayers.bold.push(ax + 0.014, ay, az - 0.014, bx + 0.014, by, bz - 0.014);
      }
    }
    function addWorldBox(x, y, z, w, h, d, pal = 'trav', lyr = 'medium') {
      const x0 = x, x1 = x + w, y0 = y, y1 = y + h, z0 = z, z1 = z + d;
      const c = [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
      quadN([c[4],c[5],c[6],c[7]], pal, [0,0,1]);
      quadN([c[1],c[5],c[6],c[2]], pal, [1,0,0]);
      quadN([c[0],c[3],c[2],c[1]], pal, [0,0,-1]);
      quadN([c[0],c[4],c[7],c[3]], pal, [-1,0,0]);
      quadN([c[3],c[2],c[6],c[7]], pal, [0,1,0]);
      quadN([c[0],c[1],c[5],c[4]], pal, [0,-1,0]);
      [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([a, b]) => addLineWorld(c[a], c[b], lyr, 0.01));
    }

    // =========================================================================
    // 1. COLOSSEUM VALLEY TERRAIN BLOCK (B = 40, Y_BOT = -8.5)
    // =========================================================================
    const thash = (i, j) => {
      let h = Math.imul(i, 374761393) + Math.imul(j, 668265263);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    };
    const tsmooth = t => t * t * (3 - 2 * t);
    const tss = (a, b, x) => {
      const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    };
    function tval(x, z) {
      const i = Math.floor(x), j = Math.floor(z), u = tsmooth(x - i), v = tsmooth(z - j);
      return (thash(i, j) * (1 - u) + thash(i + 1, j) * u) * (1 - v) +
             (thash(i, j + 1) * (1 - u) + thash(i + 1, j + 1) * u) * v;
    }
    const tfbm = (x, z) => tval(x, z) * 0.54 + tval(x * 2.1, z * 2.1) * 0.28 + tval(x * 4.3, z * 4.3) * 0.18;

    const B_TER = 40, N_TER = 96, Y_BOT = -8.5;
    function H_rome(x, z) {
      // Flavian travertine piazza basin: depressed inside the ellipse for hypogeum cutaway (-2.4)
      const eArena = Math.hypot(x / 10.6, z / 6.7);
      const eOuter = Math.hypot(x / 23.0, z / 19.0);
      if (eArena < 0.96) return -2.2;
      if (eOuter < 1.05) return 0.0;
      // Velian Ridge & Temple of Venus & Roma rise on -X / -Z corner
      const velian = 4.6 * tss(-14, -30, x) * tss(-8, -28, z);
      // Oppian Hill terraced slope behind (+X, -Z) and Palatine spur (-X, +Z)
      const oppian = 5.4 * tss(8, 32, x) * tss(-10, -34, z);
      const palatine = 4.2 * tss(-15, -35, x) * tss(10, 32, z);
      const basinMask = 1 - tss(1.05, 1.38, eOuter);
      let h = (velian + oppian + palatine + (tfbm(x * 0.11, z * 0.11) - 0.45) * 1.4) * (1 - basinMask);
      return Math.max(-0.15, h);
    }

    const st = (2 * B_TER) / N_TER;
    const hGrid = [];
    for (let j = 0; j <= N_TER; j++) {
      for (let i = 0; i <= N_TER; i++) hGrid.push(H_rome(-B_TER + i * st, -B_TER + j * st));
    }
    const gPt = (i, j) => [-B_TER + i * st, hGrid[j * (N_TER + 1) + i], -B_TER + j * st];

    for (let j = 0; j < N_TER; j++) {
      for (let i = 0; i < N_TER; i++) {
        const a = gPt(i, j), b = gPt(i + 1, j), c = gPt(i + 1, j + 1), d = gPt(i, j + 1);
        [[a, b, c], [a, c, d]].forEach(tri => {
          const p0 = tri[0], p1 = tri[1], p2 = tri[2];
          const ux = p1[0] - p0[0], uy = p1[1] - p0[1], uz = p1[2] - p0[2];
          const vx = p2[0] - p0[0], vy = p2[1] - p0[1], vz = p2[2] - p0[2];
          let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
          const l = Math.hypot(nx, ny, nz) || 1;
          nx /= l; ny /= l; nz /= l;
          if (ny < 0) { nx = -nx; ny = -ny; nz = -nz; }
          const cx = (p0[0] + p1[0] + p2[0]) / 3;
          const cy = (p0[1] + p1[1] + p2[1]) / 3;
          const cz = (p0[2] + p1[2] + p2[2]) / 3;
          const dot = nx * lightDir.x + ny * lightDir.y + nz * lightDir.z;
          const sh = dot * 0.04;
          const eOut = Math.hypot(cx / 25.0, cz / 21.0);
          let colHex = 0xe7dfd0;
          if (cy < -1.0) colHex = 0xa89b86; // Subterranean tufa bed below hypogeum
          else if (eOut < 1.12 || Math.abs(cx - 2) < 4.5 && cz > 16) colHex = PALETTE.plaza.top; // Piazza del Colosseo & Via Triumphalis
          else if (ny < 0.80) colHex = PALETTE.tufa.mid;
          else {
            const gq = tfbm(cx * 0.25 + 3, cz * 0.25);
            colHex = gq > 0.52 ? 0xc0cd97 : 0xb1c186;
          }
          pushTriWorld(p0, p1, p2, colHex, sh);
        });
      }
    }

    // Roman Volcanic Anio Tufa, Pozzolana Ash & Clay Cutaway Skirts
    const ysRome = [Y_BOT, -5.8, -3.4, -1.2, 6.5];
    const romeHexes = [0x9e8b75, 0xb89678, 0xc9b496, 0xd8cdb8];
    function addRomeSkirt(isX, fixedVal, nSign) {
      const fDot = isX ? nSign * lightDir.x : nSign * lightDir.z;
      for (let i = 0; i < N_TER; i++) {
        const u0 = -B_TER + i * st, u1 = u0 + st;
        const x0 = isX ? fixedVal : u0, z0 = isX ? u0 : fixedVal;
        const x1 = isX ? fixedVal : u1, z1 = isX ? u1 : fixedVal;
        const h0 = H_rome(x0, z0), h1 = H_rome(x1, z1);
        for (let s = 0; s < ysRome.length - 1; s++) {
          const yA = ysRome[s], yB = ysRome[s + 1];
          const top0 = Math.min(h0, yB), top1 = Math.min(h1, yB);
          const bot0 = Math.min(h0, yA), bot1 = Math.min(h1, yA);
          if (top0 - bot0 < 0.02 && top1 - bot1 < 0.02) continue;
          pushQuadWorld([x0, bot0, z0], [x1, bot1, z1], [x1, top1, z1], [x0, top0, z0], romeHexes[s], fDot * 0.04);
          if (s > 0 && h0 > yA && h1 > yA) addLineWorld([x0, yA, z0], [x1, yA, z1], s === 2 ? 'rust' : 'fine', 0);
        }
        addLineWorld([x0, h0, z0], [x1, h1, z1], 'bold', 0);
        addLineWorld([x0, Y_BOT, z0], [x1, Y_BOT, z1], 'bold', 0);
        if (i === 0) addLineWorld([x0, Y_BOT, z0], [x0, h0, z0], 'bold', 0);
        if (i === N_TER - 1) addLineWorld([x1, Y_BOT, z1], [x1, h1, z1], 'bold', 0);
      }
    }
    addRomeSkirt(false,  B_TER,  1);
    addRomeSkirt(false, -B_TER, -1);
    addRomeSkirt(true,   B_TER,  1);
    addRomeSkirt(true,  -B_TER, -1);

    // Topographic contours along Velian, Oppian, and Palatine slopes
    for (let lv = 0.8; lv <= 5.6; lv += 1.2) {
      for (let j = 0; j < N_TER; j++) {
        for (let i = 0; i < N_TER; i++) {
          const a = gPt(i, j), b = gPt(i + 1, j), c = gPt(i + 1, j + 1), d = gPt(i, j + 1);
          [[a, b, c], [a, c, d]].forEach(T => {
            const cr = [];
            [[T[0], T[1]], [T[1], T[2]], [T[2], T[0]]].forEach(([u, v]) => {
              if ((u[1] < lv) !== (v[1] < lv)) {
                const t = (lv - u[1]) / (v[1] - u[1]);
                cr.push([u[0] + (v[0] - u[0]) * t, lv + 0.04, u[2] + (v[2] - u[2]) * t]);
              }
            });
            if (cr.length === 2) addLineWorld(cr[0], cr[1], 'fine', 0);
          });
        }
      }
    }

    // =========================================================================
    // 2. WATERTIGHT ELLIPTICAL COLOSSEUM CUTAWAY BUILDER (NO OVERLAPPING PLANES)
    // =========================================================================
    const N_BAYS = 64; // Crisp clean architectural bays around circumference
    const CUT_START = 3;  // Open front-right SE quadrant [bay 3 .. 16] cleanly cut on bay planes!
    const CUT_END = 16;
    const isVisibleBay = i => (i < CUT_START || i >= CUT_END);

    // Concentric elliptical ring scale factors (outer a=20.6, b=16.6; arena a=9.6, b=6.2)
    const A_OUT = 20.6, B_OUT = 16.6;
    const EP = (rScale, y, theta) => [
      Math.cos(theta) * A_OUT * rScale,
      y,
      Math.sin(theta) * B_OUT * rScale
    ];
    const EN = theta => {
      const nx = Math.cos(theta) / A_OUT, nz = Math.sin(theta) / B_OUT;
      const l = Math.hypot(nx, nz) || 1;
      return [nx / l, 0, nz / l];
    };

    // Travertine stylobate two-step base around the whole ellipse
    for (let i = 0; i < N_BAYS; i++) {
      const t0 = (i / N_BAYS) * Math.PI * 2;
      const t1 = ((i + 1) / N_BAYS) * Math.PI * 2;
      const n = EN((t0 + t1) / 2);
      [[1.04, 1.07, 0.0, 0.28], [1.01, 1.045, 0.28, 0.56]].forEach(([ri, ro, y0, y1]) => {
        quadN([EP(ro, y0, t0), EP(ro, y0, t1), EP(ro, y1, t1), EP(ro, y1, t0)], 'trav', n);
        quadN([EP(ri, y1, t0), EP(ro, y1, t0), EP(ro, y1, t1), EP(ri, y1, t1)], 'trav', [0, 1, 0]);
        addLineWorld(EP(ro, y1, t0), EP(ro, y1, t1), 'medium', 0);
      });
    }

    // Helper: thick annular sector block (between bay angles t0..t1 and radial scales rIn..rOut)
    function annularSector(rIn, rOut, y0, y1, t0, t1, pal, opts = {}) {
      const nOut = EN((t0 + t1) / 2);
      const nIn = [-nOut[0], 0, -nOut[2]];
      quadN([EP(rOut, y0, t0), EP(rOut, y0, t1), EP(rOut, y1, t1), EP(rOut, y1, t0)], pal, nOut);
      quadN([EP(rIn, y0, t1), EP(rIn, y0, t0), EP(rIn, y1, t0), EP(rIn, y1, t1)], pal, nIn);
      quadN([EP(rIn, y1, t0), EP(rOut, y1, t0), EP(rOut, y1, t1), EP(rIn, y1, t1)], pal, [0, 1, 0]);
      if (opts.cap0) {
        const cN = [Math.sin(t0), 0, -Math.cos(t0)];
        quadN([EP(rIn, y0, t0), EP(rOut, y0, t0), EP(rOut, y1, t0), EP(rIn, y1, t0)], opts.cutPal || 'brick', cN);
        addLineWorld(EP(rIn, y0, t0), EP(rIn, y1, t0), 'bold', 0);
        addLineWorld(EP(rOut, y0, t0), EP(rOut, y1, t0), 'bold', 0);
        addLineWorld(EP(rIn, y1, t0), EP(rOut, y1, t0), 'bold', 0);
      }
      if (opts.cap1) {
        const cN = [-Math.sin(t1), 0, Math.cos(t1)];
        quadN([EP(rOut, y0, t1), EP(rIn, y0, t1), EP(rIn, y1, t1), EP(rOut, y1, t1)], opts.cutPal || 'brick', cN);
        addLineWorld(EP(rIn, y0, t1), EP(rIn, y1, t1), 'bold', 0);
        addLineWorld(EP(rOut, y0, t1), EP(rOut, y1, t1), 'bold', 0);
        addLineWorld(EP(rIn, y1, t1), EP(rOut, y1, t1), 'bold', 0);
      }
      const lyr = opts.edge || 'medium';
      addLineWorld(EP(rOut, y1, t0), EP(rOut, y1, t1), lyr, 0);
      addLineWorld(EP(rOut, y0, t0), EP(rOut, y0, t1), 'fine', 0);
      addLineWorld(EP(rIn, y1, t0), EP(rIn, y1, t1), 'fine', 0);
    }

    // Arcaded Outer Facade Bay (3 classical orders + Attic 4th storey)
    const TIERS = [
      { y0: 0.56, y1: 4.15, spring: 2.35, archTop: 3.55 },
      { y0: 4.45, y1: 8.15, spring: 6.35, archTop: 7.55 },
      { y0: 8.45, y1: 12.10, spring: 10.30, archTop: 11.45 }
    ];
    for (let i = 0; i < N_BAYS; i++) {
      if (!isVisibleBay(i)) continue;
      const t0 = (i / N_BAYS) * Math.PI * 2;
      const t1 = ((i + 1) / N_BAYS) * Math.PI * 2;
      const prevVis = isVisibleBay((i - 1 + N_BAYS) % N_BAYS);
      const nextVis = isVisibleBay((i + 1) % N_BAYS);
      const pierFrac = 0.22;
      const tp0 = t0 + (t1 - t0) * pierFrac;
      const tp1 = t1 - (t1 - t0) * pierFrac;
      const nm = EN((t0 + t1) / 2);

      // Build 3 arcaded tiers cleanly
      TIERS.forEach((tr, ti) => {
        // Left & right travertine piers
        annularSector(0.92, 1.0, tr.y0, tr.y1, t0, tp0, 'trav', { cap0: !prevVis, cutPal: 'brick', edge: 'medium' });
        annularSector(0.92, 1.0, tr.y0, tr.y1, tp1, t1, 'trav', { cap1: !nextVis, cutPal: 'brick', edge: 'medium' });
        // Deep recessed shadow backing inside arch opening
        quadN([EP(0.925, tr.y0, tp0), EP(0.925, tr.y0, tp1), EP(0.925, tr.archTop, tp1), EP(0.925, tr.archTop, tp0)], 'dark', nm);
        // Arch spandrel segments over semicircular extrados
        const archSteps = 6;
        for (let a = 0; a < archSteps; a++) {
          const a0 = (a / archSteps) * Math.PI, a1 = ((a + 1) / archSteps) * Math.PI;
          const u0 = 0.5 - 0.5 * Math.cos(a0), u1 = 0.5 - 0.5 * Math.cos(a1);
          const ay0 = tr.spring + Math.sin(a0) * (tr.archTop - tr.spring);
          const ay1 = tr.spring + Math.sin(a1) * (tr.archTop - tr.spring);
          const ta = tp0 + (tp1 - tp0) * u0, tb = tp0 + (tp1 - tp0) * u1;
          quadN([EP(1.0, ay0, ta), EP(1.0, ay1, tb), EP(1.0, tr.y1, tb), EP(1.0, tr.y1, ta)], 'trav', nm);
          quadN([EP(0.92, ay0, ta), EP(0.92, ay1, tb), EP(1.0, ay1, tb), EP(1.0, ay0, ta)], 'trav', [0, -1, 0]);
          addLineWorld(EP(1.0, ay0, ta), EP(1.0, ay1, tb), 'bold', 0);
        }
        // Projecting classical cornice belt above each order
        annularSector(0.915, 1.018, tr.y1, tr.y1 + 0.30, t0, t1, 'trav', { cap0: !prevVis, cap1: !nextVis, cutPal: 'trav', edge: 'bold' });
        // Engaged half-column rib along bay boundary
        addLineWorld(EP(1.012, tr.y0, t0), EP(1.012, tr.y1, t0), 'bold', 0);
      });

      // 4th Storey Solid Attic Wall (y = 12.40 .. 16.50) with windows, shields & velarium corbels
      annularSector(0.92, 0.995, 12.40, 16.30, t0, t1, 'trav', { cap0: !prevVis, cap1: !nextVis, cutPal: 'trav', edge: 'medium' });
      annularSector(0.915, 1.022, 16.30, 16.72, t0, t1, 'trav', { cap0: !prevVis, cap1: !nextVis, cutPal: 'trav', edge: 'bold' });
      const tm0 = t0 + (t1 - t0) * 0.35, tm1 = t0 + (t1 - t0) * 0.65;
      if (i % 2 === 0) {
        quadN([EP(1.0, 13.35, tm0), EP(1.0, 13.35, tm1), EP(1.0, 14.85, tm1), EP(1.0, 14.85, tm0)], 'dark', nm);
        addLineWorld(EP(1.005, 13.35, tm0), EP(1.005, 14.85, tm0), 'medium', 0);
        addLineWorld(EP(1.005, 14.85, tm0), EP(1.005, 14.85, tm1), 'medium', 0);
        addLineWorld(EP(1.005, 14.85, tm1), EP(1.005, 13.35, tm1), 'medium', 0);
      } else {
        quadN([EP(1.0, 13.7, tm0), EP(1.0, 13.7, tm1), EP(1.0, 14.4, tm1), EP(1.0, 14.4, tm0)], 'tufa', nm);
      }
      // Velarium wooden mast corbel & mast socket at top attic cornice
      const tMast = (t0 + t1) / 2;
      addLineWorld(EP(1.015, 15.65, tMast), EP(1.015, 16.30, tMast), 'bold', 0);
      addLineWorld(EP(0.985, 16.72, tMast), EP(0.985, 17.55, tMast), 'rust', 0);
    }

    // Concentric Interior Brick Ambulatories (kept strictly below the marble cavea slope so they expose ONLY on the cut cross-sections!)
    const RINGS = [
      { r0: 0.78, r1: 0.89, yTop: 8.6, pal: 'brick' },
      { r0: 0.67, r1: 0.77, yTop: 6.2, pal: 'brick' },
      { r0: 0.56, r1: 0.66, yTop: 3.8, pal: 'tufa' },
      { r0: 0.49, r1: 0.55, yTop: 2.05, pal: 'tufa' }
    ];
    for (let i = 0; i < N_BAYS; i++) {
      if (!isVisibleBay(i)) continue;
      const t0 = (i / N_BAYS) * Math.PI * 2;
      const t1 = ((i + 1) / N_BAYS) * Math.PI * 2;
      const prevVis = isVisibleBay((i - 1 + N_BAYS) % N_BAYS);
      const nextVis = isVisibleBay((i + 1) % N_BAYS);
      RINGS.forEach(rg => {
        annularSector(rg.r0, rg.r1, 0.0, rg.yTop, t0, t1, rg.pal, {
          cap0: !prevVis, cap1: !nextVis, cutPal: 'brick', edge: 'fine'
        });
      });
      // Stepped marble Cavea seating wedge sweeping smoothly up from podium r=0.48 (y=2.0) to attic arcade r=0.915 (y=12.4)
      const tierCount = 14;
      for (let stp = 0; stp < tierCount; stp++) {
        const f0 = stp / tierCount, f1 = (stp + 1) / tierCount;
        const rA = 0.48 + f0 * 0.435;
        const rB = 0.48 + f1 * 0.435;
        const yS = 2.0 + f0 * 10.4;
        const yNext = 2.0 + f1 * 10.4;
        quadN([EP(rA, yS, t0), EP(rB, yS, t0), EP(rB, yS, t1), EP(rA, yS, t1)], 'marble', [0, 1, 0]);
        quadN([EP(rB, yS, t0), EP(rB, yS, t1), EP(rB, yNext, t1), EP(rB, yNext, t0)], 'marble', [-EN((t0+t1)/2)[0], 0, -EN((t0+t1)/2)[2]]);
        addLineWorld(EP(rB, yS, t0), EP(rB, yS, t1), (stp === 4 || stp === 9 || stp === 13) ? 'bold' : 'fine', 0);
      }
      // Clean sloping cross-section wall under the cavea on the two radial cutaway faces
      if (!prevVis) {
        const cN = [Math.sin(t0), 0, -Math.cos(t0)];
        quadN([EP(0.48, 0.0, t0), EP(0.915, 0.0, t0), EP(0.915, 12.4, t0), EP(0.48, 2.0, t0)], 'brick', cN);
        addLineWorld(EP(0.48, 2.0, t0), EP(0.915, 12.4, t0), 'bold', 0);
      }
      if (!nextVis) {
        const cN = [-Math.sin(t1), 0, Math.cos(t1)];
        quadN([EP(0.915, 0.0, t1), EP(0.48, 0.0, t1), EP(0.48, 2.0, t1), EP(0.915, 12.4, t1)], 'brick', cN);
        addLineWorld(EP(0.48, 2.0, t1), EP(0.915, 12.4, t1), 'bold', 0);
      }
      // Radial scalaria stair aisle rib every 4th bay
      if (i % 4 === 0) {
        addLineWorld(EP(0.48, 2.05, t0), EP(0.915, 12.42, t0), 'medium', 0);
      }
      // Podium wall circling the arena floor (y = 0 .. 2.0)
      annularSector(0.455, 0.485, 0.0, 2.05, t0, t1, 'marble', {
        cap0: !prevVis, cap1: !nextVis, cutPal: 'tufa', edge: 'bold'
      });
    }

    // Arena Floor Cutaway (Sand Deck on left/back half + Open Exposed 2-Level Hypogeum on right/front half!)
    for (let i = 0; i < N_BAYS; i++) {
      const t0 = (i / N_BAYS) * Math.PI * 2;
      const t1 = ((i + 1) / N_BAYS) * Math.PI * 2;
      // Cover the back/west half [N_BAYS*0.35 .. N_BAYS*0.92] with arena timber/sand deck at y = 0.0
      if (i >= Math.floor(N_BAYS * 0.34) && i < Math.floor(N_BAYS * 0.90)) {
        const pts = [[0, 0.0, 0], EP(0.455, 0.0, t0), EP(0.455, 0.0, t1)];
        pushTriWorld(pts[0], pts[1], pts[2], PALETTE.sand.top, 0);
        addLineWorld(pts[1], pts[2], 'medium', 0);
        addLineWorld([0, 0.01, 0], EP(0.455, 0.01, t0), 'fine', 0);
      }
    }
    // Detailed brick & tufa Hypogeum subterranean corridor walls inside the exposed open half (y = -2.2 .. -0.08)
    [-2.5, -0.9, 0.9, 2.5].forEach((hz, k) => {
      const maxX = Math.sqrt(Math.max(0.1, 1 - (hz / 5.9) ** 2)) * 9.0;
      const startX = -1.2;
      if (maxX > startX + 0.5) {
        addWorldBox(startX, -2.2, hz - 0.16, maxX - startX, 1.95, 0.32, k % 2 === 0 ? 'brick' : 'tufa', 'medium');
        // Vertical lift-cage pocket hatches
        for (let px = startX + 1.0; px < maxX - 0.8; px += 2.1) {
          addLineWorld([px, -2.2, hz + 0.18], [px, -0.25, hz + 0.18], 'fine', 0);
        }
      }
    });
    // Central axial hypogeum gallery wall
    addWorldBox(-1.4, -2.2, -0.45, 9.8, 1.95, 0.25, 'brick', 'bold');
    addWorldBox(-1.4, -2.2, 0.20, 9.8, 1.95, 0.25, 'brick', 'bold');

    // =========================================================================
    // 3. VALLEY LANDMARKS: ARCH OF CONSTANTINE & TEMPLE OF VENUS & ROMA GHOST
    // =========================================================================
    // Temple of Venus & Roma ghosted elevated colonnade on the Velian Ridge (-X, -Z)
    addWorldBox(-35, 3.8, -32, 13.5, 1.2, 10.5, 'ghost', 'faint');
    addWorldBox(-33.5, 5.0, -30.5, 10.5, 4.2, 7.5, 'ghost', 'faint');
    // Arch of Constantine triumphal silhouette on +Z Via Triumphalis
    addWorldBox(0.5, 0.0, 26.5, 4.4, 3.8, 1.4, 'ghost', 'medium');
    addWorldBox(1.8, 0.0, 26.5, 1.8, 2.4, 1.45, 'dark', 'fine');

    // Umbrella Stone Pines (Pinus pinea) & Roman Cypresses
    function addUmbrellaPine(px, pz, h = 4.8) {
      const py = H_rome(px, pz);
      addLineWorld([px, py, pz], [px, py + h * 0.72, pz], 'bold', 0);
      const cy = py + h * 0.72, top = py + h, r = 1.65;
      for (let k = 0; k < 6; k++) {
        const a0 = (k / 6) * Math.PI * 2, a1 = ((k + 1) / 6) * Math.PI * 2;
        const p0 = [px + Math.cos(a0) * r, cy, pz + Math.sin(a0) * r];
        const p1 = [px + Math.cos(a1) * r, cy, pz + Math.sin(a1) * r];
        pushTriWorld(p0, p1, [px, top, pz], k % 2 === 0 ? PALETTE.pine.lit : PALETTE.pine.mid, 0);
        addLineWorld(p0, p1, 'medium', 0);
        addLineWorld(p0, [px, top, pz], 'fine', 0);
      }
    }
    [[-30, 12], [-27, 24], [-18, 28], [26, -24], [32, -18], [30, 16], [-28, -14]].forEach(([px, pz], k) => {
      addUmbrellaPine(px, pz, 4.4 + (k % 3) * 0.7);
    });

    // =========================================================================
    // 4. ASSEMBLE WASH & INK LAYERS + RENDER LOOP
    // =========================================================================
    const washGeo = new THREE.BufferGeometry();
    washGeo.setAttribute('position', new THREE.Float32BufferAttribute(washPositions, 3));
    washGeo.setAttribute('color', new THREE.Float32BufferAttribute(washColors, 3));
    scene.add(new THREE.Mesh(washGeo, new THREE.MeshBasicMaterial({
      vertexColors: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1.4, polygonOffsetUnits: 1.4
    })));

    [['bold', 0x211b17, 0.92], ['medium', 0x332a24, 0.80], ['fine', 0x4a3f37, 0.44],
     ['rust', 0x8c4531, 0.64], ['teal', 0x527d80, 0.56], ['faint', 0x6b6157, 0.30]].forEach(([k, c, o]) => {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(inkLayers[k], 3));
      scene.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: o })));
    });

    window.addEventListener('resize', () => {
      const a = window.innerWidth / window.innerHeight;
      camera.left = (-frustumSize * a) / 2;
      camera.right = (frustumSize * a) / 2;
      camera.top = frustumSize / 2;
      camera.bottom = -frustumSize / 2;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      generatePaperOverlay();
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
