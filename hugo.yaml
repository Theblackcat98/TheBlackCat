languageCode: en-us
baseURL: "https://theblackcat98.github.io/TheBlackCat/"
title: "The BlackCat"
enableRobotsTXT: true
enableGitInfo: true

defaultContentLanguage: en

outputs:
  home: [HTML, RSS]
  page: [HTML]
  section: [HTML, RSS]

taxonomies:
  tag: tags
  topic: topics
  contenttype: contenttype

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  description: "Nick's personal library of bookmarks, research, notes, projects, and useful things."
  author: "Nick"

menu:
  main:
    - name: Library
      pageRef: /library
      weight: 10
    - name: Collections
      pageRef: /collections
      weight: 20
    - name: Projects
      pageRef: /projects
      weight: 30
    - name: Notes
      pageRef: /notes
      weight: 40
    - name: Blog
      pageRef: /blog
      weight: 45
    - name: GitHub
      url: "https://github.com/Theblackcat98/TheBlackCat"
      weight: 50

module:
  hugoVersion:
    extended: true
    min: "0.134.0"
