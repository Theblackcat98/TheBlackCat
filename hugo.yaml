languageCode: en-us
baseURL: "https://theblackcat98.github.io/TheBlackCat/"
title: "The BlackCat"
enableRobotsTXT: true
enableGitInfo: false   # dates come from front matter (created/updated), not from commits

defaultContentLanguage: en

# Dates: `created:` is the canonical "added" date and `updated:` the canonical
# "last touched" date (see docs/CONTENT_MODEL.md). Without this mapping Hugo
# only understands `date:`, so every bookmark/skill sorted as "undated".
frontmatter:
  date: [date, created, publishDate]
  lastmod: [lastmod, updated, date]

outputs:
  home: [HTML, RSS, JSON]   # JSON = /index.json, the client-side search index
  page: [HTML]
  section: [HTML, RSS]

taxonomies:
  tag: tags
  topic: topics
  contenttype: contenttype

# "Related" links at the bottom of a page (explicit `related:` still wins).
related:
  includeNewer: true
  threshold: 55
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: topics
      weight: 40
    - name: contenttype
      weight: 15

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
  highlight:
    noClasses: false      # token colours live in assets/css/40-code.css
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  description: "Nick's personal library of bookmarks, research, notes, projects, and useful things."
  author: "Nick"
  repo: "https://github.com/Theblackcat98/TheBlackCat"
  branch: main

  # Copy for the home page lives here, not in the template, so it can be
  # edited (by hand or by an agent) without touching layouts.
  hero:
    eyebrow: "A git-native personal library"
    title: "A quiet library of things worth keeping."
    lede: "Bookmarks, AI skills, research and projects. Markdown is the source of truth, git holds the history, and Hugo provides the reading room."
    about: "I'm Nick. I build tools for autonomous AI agents, terminal interfaces, automation pipelines and cognitive models."

  # One place that defines the content-type vocabulary. Templates read labels
  # and blurbs from here; AGENTS.md / CONTENT_MODEL.md describe the semantics.
  contenttypes:
    bookmark:
      label: Bookmark
      plural: Bookmarks
      blurb: "Saved external resources, with my notes on why they matter."
    skill:
      label: Skill
      plural: Skills
      blurb: "Reusable AI and agent skills, workflows and prompt systems."
    article:
      label: Article
      plural: Articles
      blurb: "Researched or authored prose that stands on its own."
    note:
      label: Note
      plural: Notes
      blurb: "Working knowledge, observations and hypotheses."
    reference:
      label: Reference
      plural: References
      blurb: "Durable lookup material: specs, manuals, cheat sheets."
    project:
      label: Project
      plural: Projects
      blurb: "Things I build, with their documentation and decisions."
    collection:
      label: Collection
      plural: Collections
      blurb: "Curated views across the library."

  # The live tools index (/tools/). Data, not template copy: the lists/tools
  # partial renders these as cards. `url` is either a site-relative path
  # (rendered with relURL) or an absolute https URL. `writeup` is the
  # site-relative path of the page that documents the tool.
  tools:
    - group: "Running on this site"
      items:
        - name: "QR Code Studio"
          kind: "App"
          desc: "Generate customizable QR codes (text, URL, Wi-Fi, vCard) and decode QR codes from images entirely in the browser."
          url: "qr-code-studio/"
          writeup: "library/tools/qr-code-studio/"
        - name: "Type Scale & Font Pairing Playground"
          kind: "App"
          desc: "A typography studio: pick a modular scale ratio and base size, see the full scale rendered live; choose from curated font pairings and export CSS custom properties."
          url: "type-scale/"
          writeup: "library/tools/type-scale/"
        - name: "CSP Builder"
          kind: "App"
          desc: "A directive-by-directive Content-Security-Policy builder with live safety warnings, common presets, and a parser mode to explain existing policies."
          url: "csp-builder/"
          writeup: "library/tools/csp-builder/"
        - name: "Aspect Ratio & Resize Calculator"
          kind: "App"
          desc: "Calculate aspect ratios, megapixels, and interactively crop and resize images directly in the browser without server processing."
          url: "aspect-ratio-calculator/"
          writeup: "library/tools/aspect-ratio-calculator/"
        - name: "AETHER atelier"
          kind: "Interactive exhibit"
          desc: "A mathematical and chromatic atelier: a cosine-palette synthesizer driving a Clifford strange-attractor visualizer, Albers simultaneous-contrast studies, and a codex on generative beauty."
          url: "aether-atelier/"
          writeup: "library/tools/aether-atelier/"
        - name: "TUI Design Study"
          kind: "Interactive exhibit"
          desc: "Ten rules of a convincing terminal interface: a survey of 857 starred repositories, a code-level critique of llama-deck's UI layer, and an ordered change plan."
          url: "tui-design-study/"
          writeup: "library/programming/tui-design-study/"
        - name: "Mermaid.js Gallery"
          kind: "Interactive exhibit"
          desc: "Every Mermaid diagram type on one page: twenty-three Mermaid v11 types, each with a working example and copyable source."
          url: "mermaid-gallery/"
          writeup: "library/tools/mermaid-gallery/"
        - name: "ANSI Palette Lab"
          kind: "Terminal color lab"
          desc: "An interactive xterm 256-color cube/grid, truecolor to 256-color RGB quantization visualization, and a terminal theme builder with Alacritty, Kitty and JSON export."
          url: "ansi-palette-lab/"
          writeup: "library/tools/ansi-palette-lab/"
        - name: "Text Studio"
          kind: "App"
          desc: "Text Studio: Readability metrics and Text Cleanup lab."
          url: "text-studio/"
          writeup: "library/tools/text-studio/"
        - name: "SVG Optimizer & Previewer"
          kind: "Utility"
          desc: "An in-browser SVG optimizer and previewer. Remove metadata, fix precision, minify IDs, and preview on multiple backgrounds."
          url: "svg-optimizer/"
          writeup: "library/tools/svg-optimizer/"
        - name: "Anatomy"
          kind: "Interactive exhibit"
          desc: "Five machines as interactive isometric figures: a quadcopter on a gimbal rig, a pair of monitor speakers, a limited-slip differential, a flame-licker engine and a quadruped robot — each with a dark and a light build."
          url: "anatomy/"
          writeup: "blog/anatomy-machines/"
        - name: "Time & ID Toolkit"
          kind: "App"
          desc: "Timestamp Toolkit for epoch/ISO conversions and relative math, paired with a UUID/ULID Studio for bulk generation and deep inspection of modern IDs."
          url: "time-id-toolkit/"
          writeup: "library/tools/time-id-toolkit/"
        - name: "Hugo Frontmatter Doctor"
          kind: "Utility"
          desc: "A tool to validate and auto-fix Hugo Markdown frontmatter against the specific lint rules used by The BlackCat."
          url: "frontmatter-doctor/"
          writeup: "library/tools/frontmatter-doctor/"
        - name: "Meta Tag & Web Manifest Generator"
          kind: "Utility"
          desc: "Client-side tool to generate HTML meta tags and Web Manifest JSON with live mock previews and as-you-type validation."
          url: "meta-generator/"
          writeup: "library/tools/meta-generator/"
    - group: "Running on Online Tools"
      items:
        - name: "Color Token Workshop"
          kind: "App"
          desc: "OKLCH palette builder with WCAG 2.1 and APCA contrast checks, auto-fix suggestions, light and dark palettes, and CSS/JSON export."
          url: "https://theblackcat98.github.io/Online-Tools/color-token-workshop.html"
          writeup: "projects/online-tools/"
        - name: "Mermaid Viewer"
          kind: "App"
          desc: "Paste Mermaid source and render it with pan and zoom; export the result as SVG or PNG."
          url: "https://theblackcat98.github.io/Online-Tools/mermaid-viewer.html"
          writeup: "projects/online-tools/"
        - name: "Hashes, encodings & converters"
          kind: "Utility collection"
          desc: "The Online Tools utility belt: MD, SHA, Keccak and RIPEMD hashes and file checksums, Base32/Base58/Base64, HTML and URL encoding, and image converters (ICO, SVG, STL)."
          url: "https://theblackcat98.github.io/Online-Tools/"
          writeup: "projects/online-tools/"
    - group: "Developer Tools"
      items:
        - name: "Prompt Templating Sandbox"
          kind: "Utility"
          desc: "A testing ground to run and validate agent system prompts against different variable inputs."
          url: "prompt-sandbox/"
          writeup: "library/tools/prompt-sandbox/"
        - name: "Markdown Table Generator/Formatter"
          kind: "Utility"
          desc: "A utility to generate, format, and align Markdown tables, including importing from CSV."
          url: "markdown-table-generator/"
          writeup: "library/tools/markdown-table-generator/"
        - name: "JSON-to-Hugo Frontmatter Converter"
          kind: "Utility"
          desc: "Quickly convert JSON configurations or API responses into valid Hugo YAML front matter."
          url: "json-to-hugo/"
          writeup: "library/tools/json-to-hugo/"
        - name: "Semantic Token Mapper"
          kind: "Utility"
          desc: "A utility for mapping and testing design system colors against WCAG contrast rules in bulk."
          url: "semantic-token-mapper/"
          writeup: "library/tools/semantic-token-mapper/"
        - name: "Regex Visualizer and Tester"
          kind: "Utility"
          desc: "A visual debugger and tester for regular expressions, explaining each part of the match."
          url: "regex-visualizer/"
          writeup: "library/tools/regex-visualizer/"
        - name: "JWT Decoder"
          kind: "Utility"
          desc: "A secure, client-side tool to decode and inspect JWT payloads without sending them to a server."
          url: "jwt-decoder/"
          writeup: "library/tools/jwt-decoder/"
        - name: "Cron Expression Tester"
          kind: "Utility"
          desc: "Translates cron scheduling expressions into human-readable times and shows upcoming run dates."
          url: "cron-tester/"
          writeup: "library/tools/cron-tester/"
        - name: "OpenGraph Social Card Previewer"
          kind: "Utility"
          desc: "Previews how a link will look when shared on various social platforms based on its meta tags."
          url: "og-previewer/"
          writeup: "library/tools/og-previewer/"
        - name: "Git Commit Message Formatter"
          kind: "Utility"
          desc: "Standardizes commit messages according to conventional commit guidelines."
          url: "commit-formatter/"
          writeup: "library/tools/commit-formatter/"
        - name: "CSS Layout Generator"
          kind: "Utility"
          desc: "A visual builder that outputs clean CSS Grid or Flexbox code for complex layouts."
          url: "css-layout-generator/"
          writeup: "library/tools/css-layout-generator/"

menu:
  main:
    - name: Library
      pageRef: /library
      weight: 10
    - name: Collections
      pageRef: /collections
      weight: 20
    - name: Projects
      pageRef: /projects
      weight: 30
    - name: Tools
      pageRef: /tools
      weight: 35
    - name: Notes
      pageRef: /notes
      weight: 40
    - name: Blog
      pageRef: /blog
      weight: 45
    - name: Docs
      pageRef: /docs
      weight: 48
