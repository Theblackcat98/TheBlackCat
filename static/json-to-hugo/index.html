<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>JSON-to-Hugo Frontmatter Converter</title>
    <style>
    :root {
      color-scheme: light dark;
      --bg: #e9eaed; --panel: #f7f7f9; --panel2: #ffffff;
      --ink: #1d2126; --mut: #5b6068; --faint: #62666e;
      --line: #d6d7dc; --line2: #bfc2ca; --chip: #ececf0;
      --acc: #2f6db3; --acc-strong: #26598f; --acc-ink: #ffffff;
      --ok: #2e7d4f; --err-bg: #fdeeee; --err-line: #efc2c2; --err-ink: #8f2d23;
      --shadow: 0 1px 2px rgba(24, 28, 38, .05), 0 10px 28px rgba(24, 28, 38, .07);
      --ui-font: "Outfit", sans-serif; --mono-font: "JetBrains Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121316; --panel: #1a1b1f; --panel2: #222329;
        --ink: #eceef2; --mut: #a2a6af; --faint: #9ba0aa;
        --line: #2d2f36; --line2: #3d404a; --chip: #26272e;
        --acc: #7db0e6; --acc-strong: #9cc3ee; --acc-ink: #0d1724;
        --ok: #6fce97; --err-bg: #3a2120; --err-line: #6e3a36; --err-ink: #f0a9a0;
        --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .35);
      }
    }
        * { box-sizing: border-box; }
        body { font-family: var(--ui-font); font-size: 15px; line-height: 1.45; max-width: 900px; margin: 0 auto; padding: 2rem; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
        h1 { font-size: 24px; font-weight: 600; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        textarea { width: 100%; height: 400px; font-family: var(--mono-font); font-size: 13.5px; padding: 0.75rem; box-sizing: border-box; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; }
        .col { display: flex; flex-direction: column; }
        label { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
        button { padding: 0.55rem 1.1rem; cursor: pointer; background: var(--acc); color: var(--acc-ink); border: 1px solid var(--acc); border-radius: 9px; margin-top: 1rem; align-self: flex-start; font: inherit; font-size: 13.5px; font-weight: 600; }
        button:hover { background: var(--acc-strong); border-color: var(--acc-strong); }
        .error { color: var(--err-ink); background: var(--err-bg); border: 1px solid var(--err-line); border-radius: 9px; padding: 0.4rem 0.6rem; margin-top: 0.5rem; font-weight: 600; }
        .error:empty { display: none; }
        :focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
    </style>
</head>
<body>
    <h1>JSON-to-Hugo Frontmatter Converter</h1>
    <p>Paste JSON below to convert it into Hugo-compatible YAML frontmatter.</p>

    <div class="grid">
        <div class="col">
            <label for="json-input"><strong>JSON Input:</strong></label>
            <textarea id="json-input" placeholder='{"title": "Example", "tags": ["a", "b"]}'></textarea>
            <div id="error-msg" class="error"></div>
        </div>
        <div class="col">
            <label for="yaml-output"><strong>YAML Frontmatter Output:</strong></label>
            <textarea id="yaml-output" readonly></textarea>
            <button onclick="copyOutput()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        const inputEl = document.getElementById('json-input');
        const outputEl = document.getElementById('yaml-output');
        const errorEl = document.getElementById('error-msg');

        // Simple YAML converter for basic JSON objects
        function toYAML(obj, indent = 0) {
            const spaces = ' '.repeat(indent);
            let yaml = '';

            for (const key in obj) {
                if (!Object.prototype.hasOwnProperty.call(obj, key)) continue;

                const val = obj[key];

                // Escape keys if needed (simple check)
                const safeKey = /^[a-zA-Z0-9_-]+$/.test(key) ? key : `"${key}"`;

                if (val === null) {
                    yaml += `${spaces}${safeKey}: null\n`;
                } else if (typeof val === 'boolean' || typeof val === 'number') {
                    yaml += `${spaces}${safeKey}: ${val}\n`;
                } else if (typeof val === 'string') {
                    // Quote string if it contains special chars or newlines
                    if (val.includes('\n') || val.includes(':') || val.includes('#') || val.startsWith('{') || val.startsWith('[')) {
                         yaml += `${spaces}${safeKey}: "${val.replace(/"/g, '\\"')}"\n`;
                    } else {
                         yaml += `${spaces}${safeKey}: ${val}\n`;
                    }
                } else if (Array.isArray(val)) {
                    if (val.length === 0) {
                        yaml += `${spaces}${safeKey}: []\n`;
                    } else {
                        yaml += `${spaces}${safeKey}:\n`;
                        for (const item of val) {
                            if (typeof item === 'object' && item !== null) {
                                // Basic support for objects in arrays
                                const objStr = toYAML(item, indent + 2).trim();
                                yaml += `${spaces}  - ${objStr}\n`;
                            } else {
                                const safeItem = typeof item === 'string' && (item.includes(':') || item.includes('#'))
                                    ? `"${item.replace(/"/g, '\\"')}"`
                                    : item;
                                yaml += `${spaces}  - ${safeItem}\n`;
                            }
                        }
                    }
                } else if (typeof val === 'object') {
                    if (Object.keys(val).length === 0) {
                        yaml += `${spaces}${safeKey}: {}\n`;
                    } else {
                        yaml += `${spaces}${safeKey}:\n`;
                        yaml += toYAML(val, indent + 2);
                    }
                }
            }
            return yaml;
        }

        function convert() {
            const raw = inputEl.value.trim();
            if (!raw) {
                outputEl.value = '';
                errorEl.textContent = '';
                return;
            }

            try {
                const parsed = JSON.parse(raw);
                if (typeof parsed !== 'object' || Array.isArray(parsed) || parsed === null) {
                    throw new Error("Input must be a JSON object at the root level.");
                }

                const yamlBody = toYAML(parsed);
                outputEl.value = `---\n${yamlBody}---\n`;
                errorEl.textContent = '';
            } catch (err) {
                errorEl.textContent = `Error: ${err.message}`;
            }
        }

        inputEl.addEventListener('input', convert);
        // Initial check in case browser auto-fills
        convert();

        function copyOutput() {
            navigator.clipboard.writeText(outputEl.value).then(() => {
                const btn = document.querySelector('.col:nth-child(2) button');
                const orig = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = orig, 1500);
            });
        }
    </script>
</body>
</html>
