<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Git Commit Message Formatter</title>
    <style>
    :root {
      color-scheme: light dark;
      --bg: #e9eaed; --panel: #f7f7f9; --panel2: #ffffff;
      --ink: #1d2126; --mut: #5b6068; --faint: #62666e;
      --line: #d6d7dc; --line2: #bfc2ca; --chip: #ececf0;
      --acc: #2f6db3; --acc-strong: #26598f; --acc-ink: #ffffff;
      --ok: #2e7d4f; --err-bg: #fdeeee; --err-line: #efc2c2; --err-ink: #8f2d23;
      --shadow: 0 1px 2px rgba(24, 28, 38, .05), 0 10px 28px rgba(24, 28, 38, .07);
      --ui-font: "Outfit", sans-serif; --mono-font: "JetBrains Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121316; --panel: #1a1b1f; --panel2: #222329;
        --ink: #eceef2; --mut: #a2a6af; --faint: #9ba0aa;
        --line: #2d2f36; --line2: #3d404a; --chip: #26272e;
        --acc: #7db0e6; --acc-strong: #9cc3ee; --acc-ink: #0d1724;
        --ok: #6fce97; --err-bg: #3a2120; --err-line: #6e3a36; --err-ink: #f0a9a0;
        --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .35);
      }
    }
        * { box-sizing: border-box; }
        body { font-family: var(--ui-font); font-size: 15px; line-height: 1.45; max-width: 800px; margin: 0 auto; padding: 2rem; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
        h1 { font-size: 24px; font-weight: 600; }
        a { color: var(--acc-strong); }
        .form-group { margin-bottom: 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px; }
        label { display: block; font-weight: 600; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
        select, input, textarea { width: 100%; padding: 0.55rem 0.7rem; box-sizing: border-box; font-family: var(--mono-font); font-size: 14px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; }
        input[type="checkbox"] { width: auto; accent-color: var(--acc); }
        textarea { height: 100px; resize: vertical; }
        .help { font-size: 0.85rem; color: var(--mut); margin-top: 0.25rem; font-weight: 400; text-transform: none; letter-spacing: normal; }
        .counter { float: right; font-size: 0.85rem; color: var(--faint); font-weight: 400; text-transform: none; letter-spacing: normal; }
        .over-limit { color: var(--err-ink); font-weight: bold; }
        .output-box { background: var(--panel); border: 1px solid var(--line); padding: 1rem; border-radius: 14px; box-shadow: var(--shadow); white-space: pre-wrap; font-family: var(--mono-font); font-size: 1.05rem; }
        button { padding: 0.55rem 1.1rem; cursor: pointer; background: var(--acc); color: var(--acc-ink); border: 1px solid var(--acc); border-radius: 9px; margin-top: 1rem; font: inherit; font-size: 13.5px; font-weight: 600; }
        button:hover { background: var(--acc-strong); border-color: var(--acc-strong); }
        :focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
    </style>
</head>
<body>
    <h1>Git Commit Message Formatter</h1>
    <p>Standardizes commit messages according to <a href="https://www.conventionalcommits.org/" target="_blank">Conventional Commit</a> guidelines.</p>

    <div class="form-group">
        <label>Type <span class="help">(Required)</span></label>
        <select id="i-type">
            <option value="feat">feat (A new feature)</option>
            <option value="fix">fix (A bug fix)</option>
            <option value="docs">docs (Documentation only changes)</option>
            <option value="style">style (Changes that do not affect the meaning of the code)</option>
            <option value="refactor">refactor (A code change that neither fixes a bug nor adds a feature)</option>
            <option value="perf">perf (A code change that improves performance)</option>
            <option value="test">test (Adding missing tests or correcting existing tests)</option>
            <option value="build">build (Changes that affect the build system or external dependencies)</option>
            <option value="ci">ci (Changes to CI configuration files and scripts)</option>
            <option value="chore">chore (Other changes that don't modify src or test files)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Scope <span class="help">(Optional - e.g. 'parser', 'api')</span></label>
        <input type="text" id="i-scope" placeholder="component">
    </div>

    <div class="form-group">
        <label>Description <span class="counter" id="c-desc">0/50</span></label>
        <input type="text" id="i-desc" placeholder="add ability to parse arrays">
        <div class="help">Use the imperative mood (e.g. "add" not "adds" or "added").</div>
    </div>

    <div class="form-group">
        <label>Breaking Change? <span class="help">(Appends '!' to type)</span></label>
        <input type="checkbox" id="i-breaking" style="width: auto;"> Yes
    </div>

    <div class="form-group">
        <label>Body <span class="help">(Optional - wraps at 72 chars)</span></label>
        <textarea id="i-body" placeholder="Detailed explanation of the change..."></textarea>
    </div>

    <div class="form-group">
        <label>Footer / Issue Ref <span class="help">(Optional)</span></label>
        <input type="text" id="i-footer" placeholder="Fixes #123">
    </div>

    <h3>Result:</h3>
    <div id="output" class="output-box"></div>
    <button onclick="copyOutput()">Copy Message</button>

    <script>
        const iType = document.getElementById('i-type');
        const iScope = document.getElementById('i-scope');
        const iDesc = document.getElementById('i-desc');
        const iBreaking = document.getElementById('i-breaking');
        const iBody = document.getElementById('i-body');
        const iFooter = document.getElementById('i-footer');
        const cDesc = document.getElementById('c-desc');
        const output = document.getElementById('output');

        // Simple text wrapper to 72 columns
        function wrapText(text, maxLineLength = 72) {
            const words = text.split(/(\s+)/); // Preserve whitespace to avoid squishing
            let lines = [];
            let currentLine = '';

            for (let word of words) {
                // If it's a newline, force break
                if (word.includes('\n')) {
                    const parts = word.split('\n');
                    currentLine += parts[0];
                    lines.push(currentLine);
                    for (let i = 1; i < parts.length - 1; i++) {
                        lines.push(parts[i]);
                    }
                    currentLine = parts[parts.length - 1];
                    continue;
                }

                if (currentLine.length + word.length > maxLineLength && currentLine.trim().length > 0) {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine += word;
                }
            }
            if (currentLine.trim().length > 0 || currentLine.length > 0) {
                lines.push(currentLine);
            }
            return lines.join('\n');
        }

        function update() {
            const type = iType.value;
            const scope = iScope.value.trim();
            const desc = iDesc.value.trim();
            const isBreaking = iBreaking.checked;
            const body = iBody.value.trim();
            const footer = iFooter.value.trim();

            // Format subject
            let subject = type;
            if (scope) subject += `(${scope})`;
            if (isBreaking) subject += '!';
            subject += `: ${desc}`;

            // Update counter
            cDesc.textContent = `${subject.length}/50 (soft limit) | 72 (hard limit)`;
            cDesc.className = subject.length > 72 ? 'counter over-limit' : 'counter';

            // Build full message
            let msg = subject;
            if (body || footer || isBreaking) {
                msg += '\n\n';
            }

            if (body) {
                msg += wrapText(body) + '\n';
            }

            if (isBreaking && !footer.toUpperCase().includes('BREAKING CHANGE')) {
                msg += '\nBREAKING CHANGE: (Describe the breaking change here)\n';
            }

            if (footer) {
                msg += '\n' + footer;
            }

            output.textContent = msg.trim();
        }

        const inputs = [iType, iScope, iDesc, iBreaking, iBody, iFooter];
        inputs.forEach(el => el.addEventListener('input', update));

        update();

        function copyOutput() {
            navigator.clipboard.writeText(output.textContent).then(() => alert('Copied to clipboard!'));
        }
    </script>
</body>
</html>
