<figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Salisbury: Ramped cross-pin &amp; clutch packs · Torsen: Helical planet pinions in pocket bores</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Spiral bevel ring gears, axle side/sun gears, and bearing pillow blocks</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Left: Multi-plate friction discs with 45°/60° ramps · Right: Gear-separation pocket friction (3.5:1 TBR)</span></span><span class="iso-caption">Comparison of two mechanical limited slip differential architectures on an instrumented dynamometer bench. On an open differential, if one wheel encounters ice, torque to both wheels collapses to zero. Left: Salisbury 1.5-way clutch LSD uses a cross-pin that rides up 45° drive ramps, axially separating two pressure rings to compress multi-plate clutch packs against baseline Belleville preload. Right: Torsen Type 2 differential uses crossed-axis helical planet pinions nested in cylindrical housing pockets; drive torque forces the pinions radially against the pocket walls and axially into bronze thrust washers, generating instant mechanical torque biasing (3.5:1 TBR) with zero clutch wear.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {

            if (facing[(index + count - 1) % count] !== facing[index])

    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {

const P = {"origin":[480,313.8648211696931],"scale":1.8401085523498089,"azimuth":42,"elevation":32};
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

// Interactive Elements
const leftCam = svg.querySelector('[data-part="diff1-left-cam"]');
const rightCam = svg.querySelector('[data-part="diff1-right-cam"]');
const crosspin = svg.querySelector('[data-part="diff1-crosspin"]');
const leftGlow = svg.querySelector('[data-part="diff1-left-glow"]');
const rightGlow = svg.querySelector('[data-part="diff1-right-glow"]');
const torsenGlow1 = svg.querySelector('[data-part="diff2-thrust-glow"]');
const torsenGlow2 = svg.querySelector('[data-part="diff2-thrust-glow2"]');
const throttleNeedle = svg.querySelector('[data-part="throttle-needle"]');
const tractionSlider = svg.querySelector('[data-part="traction-slider"]');

// Simulation state
let throttle = 120; // Input torque in Nm (0 to 200)
let split = -0.7;   // Traction split: -1 (Left on Ice) to 0 (50/50 Dry) to +1 (Right on Ice)
let scenario = 3;   // Active scenario (1: Dry 50/50, 2: Cornering, 3: Ice Split-Mu, 4: Coast)
let clock = 0;
let touring = true;
let visible = false;
let idleTimer = 0;
let frame = 0;
let last = 0;

// Current dynamic outputs
let currentDx = 0;
let currentLeftTorque = 0;
let currentRightTorque = 0;
let currentLockPct = 0;
let currentTbr = 3.5;

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

function setScenario(num) {
  scenario = num;
  touring = false;
  if (num === 1) {
    // 50:50 Dry Acceleration
    throttle = 160;
    split = 0.0;
  } else if (num === 2) {
    // High-speed Cornering
    throttle = 90;
    split = -0.3;
  } else if (num === 3) {
    // Ice Split-Mu (Left wheel zero grip)
    throttle = 140;
    split = -0.85;
  } else if (num === 4) {
    // Decel / Engine Braking
    throttle = 60;
    split = 0.2;
  }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    touring = !still.matches;
    clock = 0;
    run();
  }, 4500);
  run();
}

function updatePhysics(dt) {
  // Traction coefficients on Left and Right wheels
  // Grip capacity: dry asphalt ~ 180 Nm, wet ice ~ 15 Nm
  const gripLeft = clamp(100 - split * 90, 10, 190);
  const gripRight = clamp(100 + split * 90, 10, 190);

  // 1. CLUTCH-PACK LSD (Salisbury 1.5-Way)
  // Preload torque: 45 Nm baseline
  // Ramp angle: 45 deg drive
  const rampAngle = scenario === 4 ? (60 * Math.PI / 180) : (45 * Math.PI / 180);
  const rampForce = (throttle * 0.5) / (0.025 * Math.tan(rampAngle)); // Axial thrust in N
  const totalClamping = 600 + rampForce; // 600 N Belleville preload + dynamic ramp force

  // Axial ramp displacement in world units (mm)
  const targetDx = clamp(totalClamping / 2800, 0, 1.4);
  currentDx += (targetDx - currentDx) * (1 - Math.exp(-dt / 0.15));

  // Locking capacity
  const clutchCapacity = 0.12 * 8 * totalClamping * 0.035; // Friction torque capacity in Nm
  currentLockPct = clamp(Math.round((clutchCapacity / (throttle || 1)) * 100), 15, 100);

  // Torque distribution
  const lowGrip = Math.min(gripLeft, gripRight);
  const transferred = Math.min(clutchCapacity, throttle * 0.5);
  currentLeftTorque = clamp(Math.round(gripLeft < gripRight ? lowGrip : (throttle - lowGrip)), 5, throttle);
  currentRightTorque = clamp(Math.round(throttle - currentLeftTorque), 5, throttle);

  // 2. TORSEN TYPE 2 HELICAL DIFFERENTIAL
  // Torque Bias Ratio (TBR) = ~3.5:1
  currentTbr = 3.5;
  const torsenHigh = Math.min(190, (lowGrip + 5) * currentTbr);
}

function draw() {
  // 1. Move Salisbury pressure rings axially along X
  if (leftCam && rightCam) {
    leftCam.setAttribute("transform", translateAlong(P, [-currentDx, 0, 0]));
    rightCam.setAttribute("transform", translateAlong(P, [currentDx, 0, 0]));
  }

  // 2. Adjust friction clamp glow intensity
  const glowAlpha = clamp(currentDx / 1.4, 0.15, 0.95);
  if (leftGlow) leftGlow.style.opacity = glowAlpha.toFixed(2);
  if (rightGlow) rightGlow.style.opacity = glowAlpha.toFixed(2);

  // 3. Adjust Torsen pocket thrust contact glow intensity
  const torsenAlpha = clamp(throttle / 200, 0.2, 0.95);
  if (torsenGlow1) torsenGlow1.style.opacity = torsenAlpha.toFixed(2);
  if (torsenGlow2) torsenGlow2.style.opacity = torsenAlpha.toFixed(2);

  // 4. Update Throttle Dial Pointer
  if (throttleNeedle) {
    const angle = (throttle / 200) * Math.PI * 1.5 - Math.PI * 0.75;
    const dialX = -11, dialY = 38, dialZ = 12 + 4.2;
    const px = dialX + Math.sin(angle) * 3.8;
    const py = dialY - Math.cos(angle) * 3.8;
    const p1 = lineOnTop([dialX, dialY], [px, py], dialZ, P);
    throttleNeedle.querySelector("path")?.setAttribute("d", p1);
  }

  // 5. Update Traction Slider Knob Position
  if (tractionSlider) {
    const sx = split * 7;
    tractionSlider.setAttribute("transform", translateAlong(P, [sx, 0, 0]));
  }

  // 6. Update Card Readout Telemetry
  let modeName = "Split-Mu";
  if (scenario === 1) modeName = "Dry 50:50";
  else if (scenario === 2) modeName = "Cornering";
  else if (scenario === 4) modeName = "Coast Decel";

  const text = modeName + " · " + Math.round(throttle) + " Nm · Lock " + currentLockPct + "% · TBR " + currentTbr + ":1";
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuenow", String(Math.round(throttle)));
  stage.setAttribute("aria-valuetext", text);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;

  if (touring) {
    clock += dt;
    const tourIndex = Math.floor(clock / 3.8) % 4 + 1;
    if (tourIndex !== scenario) {
      scenario = tourIndex;
      if (scenario === 1) { throttle = 160; split = 0.0; }
      else if (scenario === 2) { throttle = 90; split = -0.35; }
      else if (scenario === 3) { throttle = 140; split = -0.85; }
      else if (scenario === 4) { throttle = 60; split = 0.25; }
    }
  }

  updatePhysics(dt);
  draw();

  frame = visible ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

if (still.matches) touring = false;

// Interactive Pointer handling on Stage
stage.addEventListener("pointerdown", (event) => {
  touring = false;
  const box = svg.getBoundingClientRect();
  const relX = (event.clientX - box.left) / box.width;
  if (relX < 0.45) {
    // Adjust throttle
    throttle = clamp(Math.round(relX / 0.45 * 200), 20, 200);
  } else if (relX > 0.55) {
    // Adjust traction split
    split = clamp((relX - 0.55) / 0.4 * 2 - 1, -1, 1);
  }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { touring = !still.matches; clock = 0; run(); }, 5000);
  run();
});

stage.addEventListener("pointermove", (event) => {
  if (event.buttons > 0) {
    touring = false;
    const box = svg.getBoundingClientRect();
    const relX = (event.clientX - box.left) / box.width;
    if (relX < 0.48) {
      throttle = clamp(Math.round(relX / 0.45 * 200), 20, 200);
    } else {
      split = clamp((relX - 0.55) / 0.4 * 2 - 1, -1, 1);
    }
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { touring = !still.matches; clock = 0; run(); }, 5000);
    run();
  }
});

// Keyboard controls
stage.addEventListener("keydown", (event) => {
  if (event.key === "1") setScenario(1);
  else if (event.key === "2") setScenario(2);
  else if (event.key === "3") setScenario(3);
  else if (event.key === "4") setScenario(4);
  else if (event.key === " ") {
    event.preventDefault();
    setScenario((scenario % 4) + 1);
  } else if (event.key === "ArrowUp" || event.key === "ArrowRight") {
    event.preventDefault();
    touring = false;
    throttle = clamp(throttle + 15, 20, 200);
    run();
  } else if (event.key === "ArrowDown" || event.key === "ArrowLeft") {
    event.preventDefault();
    touring = false;
    throttle = clamp(throttle - 15, 20, 200);
    run();
  }
});

draw();
run();
</script>
<script type="module" data-anatomy-ux>
(() => {
  const body = document.body;
  const stage = document.querySelector(".iso-stage");
  const status = document.querySelector("[data-anatomy-status]");
  const readout = document.querySelector("[data-readout]");
  const slug = location.pathname.replace(/\/+$/, "").split("/").pop();

  /* theme: one vocabulary on every figure, persisted to the site's key */
  const themeButtons = [...document.querySelectorAll("[data-anatomy-theme]")];
  const syncThemeButtons = () => {
    const current = body.getAttribute("data-theme");
    themeButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.anatomyTheme === current)));
  };
  const setTheme = (t) => {
    body.setAttribute("data-theme", t);
    document.documentElement.setAttribute("data-anatomy-theme", t);
    try { localStorage.setItem("bc-theme", t); } catch (e) {}
    const u = new URL(location.href);
    u.searchParams.set("theme", t);
    history.replaceState(null, "", u);
    syncThemeButtons();
  };
  themeButtons.forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.anatomyTheme)));
  syncThemeButtons();
  /* the flame-licker's own extra theme pills are superseded by the shared
     control, so every figure speaks the same theme vocabulary */
  const flameThemeGroup = [...document.querySelectorAll(".engine-toolbar .toolbar-group")]
    .find((g) => g.querySelector("[data-theme-choice]"));
  if (flameThemeGroup) flameThemeGroup.style.display = "none";

  if (!stage) return;

  /* the stage is a labelled control surface, not a single-axis slider:
     strip the value attributes the animation code keeps re-adding */
  const stripAriaValues = () => {
    for (const a of ["aria-valuemin", "aria-valuemax", "aria-valuenow", "aria-valuetext"]) {
      if (stage.hasAttribute(a)) stage.removeAttribute(a);
    }
  };
  stripAriaValues();
  new MutationObserver(stripAriaValues).observe(stage, {
    attributes: true, attributeFilter: ["aria-valuenow", "aria-valuetext"],
  });

  /* mirror the plate readout into a live region, throttled, and only
     shortly after the reader actually drives the figure */
  let announceUntil = 0;
  let statusTimer = 0;
  const markInteracted = () => { announceUntil = Date.now() + 6000; };
  stage.addEventListener("pointerdown", markInteracted);
  stage.addEventListener("keydown", markInteracted);
  if (readout && status) {
    new MutationObserver(() => {
      if (Date.now() > announceUntil) return;
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { status.textContent = readout.textContent; }, 700);
    }).observe(readout, { characterData: true, childList: true, subtree: true });
  }

  /* on-screen controls drive the figure through its own keyboard path */
  const press = (key) => {
    markInteracted();
    stage.focus({ preventScroll: true });
    stage.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true }));
  };
  document.querySelectorAll("[data-anatomy-key]").forEach((btn) => {
    btn.addEventListener("click", () => press(btn.dataset.anatomyKey));
  });

  /* speaker: the slider steers through the stage's own pointer path */
  const range = document.querySelector('[data-anatomy-range="hz"]');
  if (range && slug === "bookshelf-speaker") {
    const out = document.querySelector("[data-anatomy-range-out]");
    const minLog = Math.log10(40), maxLog = Math.log10(20000);
    const steerTo = (hz) => {
      const svg = stage.querySelector("svg");
      if (!svg) return;
      const r = svg.getBoundingClientRect();
      const share = (Math.log10(hz) - minLog) / (maxLog - minLog);
      markInteracted();
      stage.dispatchEvent(new PointerEvent("pointermove", {
        bubbles: true, buttons: 1,
        clientX: r.left + share * r.width, clientY: r.top + r.height / 2,
      }));
      if (out) out.textContent = Math.round(hz).toLocaleString("en-US") + " Hz";
    };
    range.addEventListener("input", () => steerTo(Number(range.value)));
  }

  /* speaker: the cutaway button reflects the stage's own state */
  const cutBtn = document.querySelector('[data-anatomy-action="cutaway"]');
  if (cutBtn) {
    const syncCut = () => cutBtn.setAttribute("aria-pressed", String(stage.getAttribute("data-cutaway") === "true"));
    cutBtn.addEventListener("click", () => { press("c"); syncCut(); });
    new MutationObserver(syncCut).observe(stage, { attributes: true, attributeFilter: ["data-cutaway"] });
    syncCut();
  }

  /* flame-licker: phase descriptions belong on the page, not in tooltips */
  if (slug === "flame-licker") {
    const toolbar = document.querySelector(".engine-toolbar");
    const firstPhase = document.querySelector("[data-phase-btn]");
    if (toolbar && firstPhase) {
      const note = document.createElement("p");
      note.className = "anatomy-phase-note";
      note.setAttribute("role", "status");
      note.textContent = firstPhase.getAttribute("title") || "";
      toolbar.appendChild(note);
      document.querySelectorAll("[data-phase-btn]").forEach((b) =>
        b.addEventListener("click", () => { note.textContent = b.getAttribute("title") || ""; }));
    }
  }
})();
