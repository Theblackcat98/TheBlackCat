{{- /* Runs before first paint: marks JS as available and applies a saved theme choice (no flash). */ -}}
<script>(function(){var d=document.documentElement;d.className=d.className.replace("no-js","js");try{var t=localStorage.getItem("bc-theme");if(t==="light"||t==="dark")d.setAttribute("data-theme",t)}catch(e){}})()</script>
