categories:
  - id: color-design
    name: Color & design
    blurb: Palettes, contrast, type scales and CSS effects.
  - id: text-data
    name: Text & data
    blurb: Text analysis, diffs, encodings, SQL formatting and structured data.
  - id: web-publishing
    name: Web & publishing
    blurb: Meta tags, social cards, security policies, sitemaps, icons and Hugo tools.
  - id: developer-utilities
    name: Developer utilities
    blurb: Tokens, cron schedules, commit messages, keyboard events, IDs and diagrams.
  - id: images-media
    name: Images & media
    blurb: Compression, format conversion, cropping, SVG optimization and QR codes.
  - id: exhibits
    name: Exhibits
    blurb: Interactive visual essays, mathematical ateliers, diagram galleries and cutaways.

