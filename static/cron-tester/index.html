<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Cron Expression Tester</title>
    <!-- Use cronstrue from unpkg for parsing/description (standard approach for client-side tool without npm) -->
    <script src="https://unpkg.com/cronstrue@2.47.0/dist/cronstrue.min.js"></script>
    <style>
    :root {
      color-scheme: light dark;
      --bg: #e9eaed; --panel: #f7f7f9; --panel2: #ffffff;
      --ink: #1d2126; --mut: #5b6068; --faint: #62666e;
      --line: #d6d7dc; --line2: #bfc2ca; --chip: #ececf0;
      --acc: #2f6db3; --acc-strong: #26598f; --acc-ink: #ffffff;
      --ok: #2e7d4f; --err-bg: #fdeeee; --err-line: #efc2c2; --err-ink: #8f2d23;
      --shadow: 0 1px 2px rgba(24, 28, 38, .05), 0 10px 28px rgba(24, 28, 38, .07);
      --ui-font: "Outfit", sans-serif; --mono-font: "JetBrains Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121316; --panel: #1a1b1f; --panel2: #222329;
        --ink: #eceef2; --mut: #a2a6af; --faint: #9ba0aa;
        --line: #2d2f36; --line2: #3d404a; --chip: #26272e;
        --acc: #7db0e6; --acc-strong: #9cc3ee; --acc-ink: #0d1724;
        --ok: #6fce97; --err-bg: #3a2120; --err-line: #6e3a36; --err-ink: #f0a9a0;
        --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .35);
      }
    }
        * { box-sizing: border-box; }
        body { font-family: var(--ui-font); font-size: 15px; line-height: 1.45; max-width: 800px; margin: 0 auto; padding: 2rem; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
        h1 { font-size: 24px; font-weight: 600; }
        input[type="text"] { width: 100%; padding: 1rem; font-family: var(--mono-font); font-size: 1.5rem; margin-bottom: 1rem; text-align: center; box-sizing: border-box; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; }
        .description { font-size: 1.5rem; font-weight: 600; text-align: center; color: var(--acc-strong); margin-bottom: 2rem; min-height: 2.5rem; }
        .parts { display: flex; justify-content: space-between; text-align: center; margin-bottom: 2rem; font-family: var(--mono-font); gap: 8px; }
        .part { flex: 1; padding: 0.75rem 0.5rem; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); }
        .part strong { display: block; font-family: var(--ui-font); font-size: 0.72rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-top: 0.5rem; }
        .error { color: var(--err-ink); background: var(--err-bg); border: 1px solid var(--err-line); border-radius: 9px; padding: 0.5rem 0.75rem; text-align: center; font-weight: 600; }
        .error:empty { display: none; }
        .examples { margin-top: 2rem; border-top: 1px solid var(--line); padding-top: 1rem; }
        .example-btn { display: inline-block; background: var(--chip); color: var(--ink); border: 1px solid var(--line); padding: 0.3rem 0.65rem; margin: 0.25rem; border-radius: 999px; cursor: pointer; font-size: 0.9rem; }
        .example-btn:hover { background: var(--panel2); border-color: var(--line2); }
        :focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
    </style>
</head>
<body>
    <h1>Cron Expression Tester</h1>
    <p>Translate cron scheduling expressions into human-readable text.</p>

    <input type="text" id="cron-input" value="0 12 * * 1-5" placeholder="* * * * *">

    <div id="description" class="description"></div>
    <div id="error-msg" class="error"></div>

    <div class="parts" id="parts">
        <div class="part" id="p-min">-<strong>Minute</strong></div>
        <div class="part" id="p-hr">-<strong>Hour</strong></div>
        <div class="part" id="p-dom">-<strong>Day of Month</strong></div>
        <div class="part" id="p-mo">-<strong>Month</strong></div>
        <div class="part" id="p-dow">-<strong>Day of Week</strong></div>
    </div>

    <div class="examples">
        <strong>Examples:</strong><br>
        <span class="example-btn" onclick="setCron('* * * * *')">Every minute</span>
        <span class="example-btn" onclick="setCron('0 * * * *')">Hourly</span>
        <span class="example-btn" onclick="setCron('0 0 * * *')">Daily at midnight</span>
        <span class="example-btn" onclick="setCron('0 9 * * 1-5')">9 AM weekdays</span>
        <span class="example-btn" onclick="setCron('*/15 * * * *')">Every 15 mins</span>
    </div>

    <script>
        const inputEl = document.getElementById('cron-input');
        const descEl = document.getElementById('description');
        const errEl = document.getElementById('error-msg');
        const parts = [
            document.getElementById('p-min'),
            document.getElementById('p-hr'),
            document.getElementById('p-dom'),
            document.getElementById('p-mo'),
            document.getElementById('p-dow')
        ];

        function setCron(val) {
            inputEl.value = val;
            update();
        }

        function update() {
            const val = inputEl.value.trim();
            errEl.textContent = '';
            descEl.textContent = '';
            parts.forEach(p => p.childNodes[0].nodeValue = '-');

            if (!val) return;

            const tokens = val.split(/\s+/);
            if (tokens.length >= 5) {
                for(let i=0; i<5; i++) {
                    parts[i].childNodes[0].nodeValue = tokens[i];
                }
            }

            try {
                if (window.cronstrue) {
                    descEl.textContent = cronstrue.toString(val);
                }
            } catch (e) {
                errEl.textContent = e.toString();
            }
        }

        inputEl.addEventListener('input', update);

        // Wait for unpkg load if slow
        window.addEventListener('load', update);
        update();
    </script>
</body>
</html>
