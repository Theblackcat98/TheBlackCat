<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Markdown Table Generator/Formatter</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #e9eaed; --panel: #f7f7f9; --panel2: #ffffff;
            --ink: #1d2126; --mut: #5b6068; --faint: #62666e;
            --line: #d6d7dc; --line2: #bfc2ca; --chip: #ececf0;
            --acc: #2f6db3; --acc-strong: #26598f; --acc-ink: #ffffff;
            --ok: #2e7d4f; --err-bg: #fdeeee; --err-line: #efc2c2; --err-ink: #8f2d23;
            --shadow: 0 1px 2px rgba(24,28,38,.05), 0 10px 28px rgba(24,28,38,.07);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg: #121316; --panel: #1a1b1f; --panel2: #222329;
                --ink: #eceef2; --mut: #a2a6af; --faint: #9ba0aa;
                --line: #2d2f36; --line2: #3d404a; --chip: #26272e;
                --acc: #7db0e6; --acc-strong: #9cc3ee; --acc-ink: #0d1724;
                --ok: #6fce97; --err-bg: #3a2120; --err-line: #6e3a36; --err-ink: #f0a9a0;
                --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.35);
            }
        }
        * { box-sizing: border-box; }
        body { font-family: "Outfit", system-ui, sans-serif; font-size: 15px; line-height: 1.45; background: var(--bg); color: var(--ink); max-width: 900px; margin: 0 auto; padding: 2rem; }
        h1 { font-size: 1.55rem; line-height: 1.2; margin: 0 0 0.5rem; }
        :focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
        p { color: var(--mut); }
        textarea { width: 100%; height: 200px; margin-bottom: 1rem; font-family: "JetBrains Mono", monospace; font-size: 0.9rem; padding: 0.6rem; background: var(--panel2); color: var(--ink); border: 1px solid var(--line2); border-radius: 9px; }
        textarea:focus { border-color: var(--acc); outline: none; }
        button { font: inherit; font-weight: 600; padding: 0.5rem 1rem; cursor: pointer; background: var(--acc); color: var(--acc-ink); border: none; border-radius: 9px; }
        button:hover { background: var(--acc-strong); }
        .controls { margin-bottom: 1rem; }
        .controls button { margin-right: 0.5rem; }
        .output-box { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 1rem; border-radius: 14px; white-space: pre; font-family: "JetBrains Mono", monospace; font-size: 0.9rem; margin-top: 1rem; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Markdown Table Generator/Formatter</h1>
    <p>Paste CSV or raw Markdown table text below to format it into a clean, aligned Markdown table.</p>

    <textarea id="input" placeholder="Column 1,Column 2,Column 3&#10;Value A,Value B,Value C"></textarea>

    <div class="controls">
        <button onclick="formatCSV()">Format from CSV (Comma)</button>
        <button onclick="formatTSV()">Format from TSV (Tab)</button>
        <button onclick="formatMD()">Re-format Markdown Table</button>
    </div>

    <h3>Output:</h3>
    <div id="output" class="output-box"></div>
    <button onclick="copyOutput()" style="margin-top: 1rem;">Copy to Clipboard</button>

    <script>
        const inputEl = document.getElementById('input');
        const outputEl = document.getElementById('output');

        function generateTable(rows) {
            if (rows.length === 0) return '';

            // Calculate column widths
            const colWidths = [];
            rows.forEach(row => {
                row.forEach((cell, i) => {
                    const len = (cell || '').trim().length;
                    colWidths[i] = Math.max(colWidths[i] || 3, len);
                });
            });

            let out = '';

            // Header
            const headerRow = rows[0] || [];
            out += '| ' + colWidths.map((w, i) => (headerRow[i] || '').trim().padEnd(w)).join(' | ') + ' |\n';

            // Separator
            out += '| ' + colWidths.map(w => '-'.repeat(w)).join(' | ') + ' |\n';

            // Body
            for (let r = 1; r < rows.length; r++) {
                const row = rows[r];
                // Skip separator row if it was parsed (like in re-format MD)
                if (row.every(cell => cell.trim().match(/^[-:]+$/))) continue;

                out += '| ' + colWidths.map((w, i) => (row[i] || '').trim().padEnd(w)).join(' | ') + ' |\n';
            }

            return out;
        }

        function formatCSV() {
            const lines = inputEl.value.split('\n').filter(l => l.trim() !== '');
            const rows = lines.map(l => l.split(','));
            outputEl.textContent = generateTable(rows);
        }

        function formatTSV() {
            const lines = inputEl.value.split('\n').filter(l => l.trim() !== '');
            const rows = lines.map(l => l.split('\t'));
            outputEl.textContent = generateTable(rows);
        }

        function formatMD() {
            const lines = inputEl.value.split('\n').filter(l => l.trim() !== '');
            const rows = lines.map(l => {
                const parts = l.split('|');
                // Remove first and last empty elements if string starts/ends with |
                if (parts.length > 0 && parts[0].trim() === '') parts.shift();
                if (parts.length > 0 && parts[parts.length-1].trim() === '') parts.pop();
                return parts;
            });
            outputEl.textContent = generateTable(rows);
        }

        function copyOutput() {
            navigator.clipboard.writeText(outputEl.textContent).then(() => {
                alert('Copied!');
            });
        }
    </script>
</body>
</html>
