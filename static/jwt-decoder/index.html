<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JWT Decoder & Debugger</title>
    <style>
        
        
        * { box-sizing: border-box; }
        body { font-family: "Outfit", system-ui, sans-serif; font-size: 15px; line-height: 1.45; background: var(--bg); color: var(--ink); max-width: 900px; margin: 0 auto; padding: 2rem; }
        h1 { font-size: 1.55rem; line-height: 1.2; margin: 0 0 0.5rem; }
        :focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
        p { color: var(--mut); }
        p strong, label { color: var(--ink); }
        textarea { width: 100%; height: 150px; font-family: "JetBrains Mono", monospace; font-size: 0.9rem; padding: 0.6rem; background: var(--panel2); color: var(--ink); border: 1px solid var(--line2); border-radius: 9px; word-break: break-all; }
        textarea:focus { border-color: var(--acc); outline: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
        .box { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 1rem; border-radius: 14px; overflow-x: auto; font-family: "JetBrains Mono", monospace; font-size: 0.9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
        @media (max-width: 720px) {
            .grid { grid-template-columns: 1fr; }
        }
        /* Subject-matter colors: jwt.io header/payload/signature convention — kept deliberately */
        .header-box { border-top: 4px solid #cc0000; }
        .payload-box { border-top: 4px solid #a335ee; }
        .signature-box { border-top: 4px solid #00aadd; margin-top: 1rem; }
        .error { color: var(--err-ink); background: var(--err-bg); border: 1px solid var(--err-line); border-radius: 9px; padding: 0.5rem 0.75rem; font-weight: 600; margin-top: 0.5rem; }
        .error:empty { display: none; }
        h3 { margin-bottom: 0.5rem; }
        h3 small { color: var(--mut); font-weight: 500; }
        .claim-desc { font-family: "Outfit", sans-serif; font-size: 0.85rem; color: var(--faint); display: block; margin-top: 0.25rem; }
    </style>

<body>
<a class="back tk-fallback" href="../tools/">&larr; All tools</a>
    <h1>JWT Decoder</h1>
    <p>Decode JSON Web Tokens securely. <strong>Client-side only:</strong> your token never leaves the browser.</p>

    <label for="jwt-input"><strong>Encoded Token:</strong></label>
    <textarea id="jwt-input" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI..."></textarea>
    <div id="error-msg" class="error"></div>

    <div class="grid">
        <div>
            <h3>Header <small>(Algorithm & Type)</small></h3>
            <div id="header-output" class="box header-box"></div>
        </div>
        <div>
            <h3>Payload <small>(Data & Claims)</small></h3>
            <div id="payload-output" class="box payload-box"></div>
        </div>
    </div>

    <h3>Signature</h3>
    <div id="signature-output" class="box signature-box"></div>

    <script>
        const inputEl = document.getElementById('jwt-input');
        const headerEl = document.getElementById('header-output');
        const payloadEl = document.getElementById('payload-output');
        const sigEl = document.getElementById('signature-output');
        const errorEl = document.getElementById('error-msg');

        const stdClaims = {
            'iss': 'Issuer',
            'sub': 'Subject',
            'aud': 'Audience',
            'exp': 'Expiration Time',
            'nbf': 'Not Before',
            'iat': 'Issued At',
            'jti': 'JWT ID'
        };

        function formatDate(unixSecs) {
            try {
                const d = new Date(unixSecs * 1000);
                return d.toLocaleString() + (d < new Date() ? ' (Expired/Past)' : ' (Future)');
            } catch (e) {
                return String(unixSecs);
            }
        }

        function syntaxHighlight(jsonObj) {
            let json = JSON.stringify(jsonObj, null, 2);
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // Add tooltips for standard claims in payload
            return json.replace(/"([^"]+)":/g, (match, key) => {
                let html = `<strong>"${key}"</strong>:`;
                if (stdClaims[key]) {
                    html += `<span class="claim-desc">// ${stdClaims[key]}`;
                    if (['exp', 'iat', 'nbf'].includes(key) && typeof jsonObj[key] === 'number') {
                         html += ` &rarr; ${formatDate(jsonObj[key])}`;
                    }
                    html += `</span>`;
                }
                return html;
            });
        }

        function decodeJWT() {
            const raw = inputEl.value.trim();
            errorEl.textContent = '';
            headerEl.innerHTML = '';
            payloadEl.innerHTML = '';
            sigEl.textContent = '';

            if (!raw) return;

            const parts = raw.split('.');
            if (parts.length !== 3) {
                errorEl.textContent = 'Invalid JWT format. Must contain 3 parts separated by dots.';
                return;
            }

            try {
                // Fix Base64Url to Base64
                const decodeB64Url = (str) => {
                    let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
                    while (b64.length % 4 !== 0) b64 += '=';
                    // Decode to UTF-8
                    const binStr = atob(b64);
                    const bytes = new Uint8Array(binStr.length);
                    for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                    const decoder = new TextDecoder('utf-8');
                    return decoder.decode(bytes);
                };

                const headerObj = JSON.parse(decodeB64Url(parts[0]));
                const payloadObj = JSON.parse(decodeB64Url(parts[1]));

                headerEl.innerHTML = syntaxHighlight(headerObj);
                payloadEl.innerHTML = syntaxHighlight(payloadObj);

                // Signature is binary, just show the hex or raw b64url
                sigEl.textContent = parts[2] + '\n\n(Signature verification not supported client-side without the secret/key)';
            } catch (err) {
                errorEl.textContent = 'Failed to decode token: ' + err.message;
            }
        }

        inputEl.addEventListener('input', decodeJWT);
        decodeJWT();
    </script>
</body>
</html>
