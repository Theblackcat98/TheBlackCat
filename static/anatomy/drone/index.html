  const set = (next, options) => {
    if (options && options.detail !== undefined) {
      const value = Math.max(0, Math.min(1, options.detail));
      if (value !== detail) {
        detail = value;
        lastPoses = null;
      }
    }
    if (typeof next === "number") {
      const g = data.groups.find((group) => group.kind === "turn");
      if (g) values[g.name] = next;
    } else if (next) for (const [name, value] of Object.entries(next)) values[name] = value;

    const svg = first;
    const box = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    const x = vb.x + ((clientX - box.left) / box.width) * vb.width;
    const y = vb.y + ((clientY - box.top) / box.height) * vb.height;
    const c = t3Camera(scene.P, null);

    const q = (y - c.oy + z * c.ce * c.k) / (c.se * c.k);

    const wy = -p * c.ca + q * c.sa;

    const raw = (Math.atan2(wy - pivot[1], wx - pivot[0]) * 180) / Math.PI;

    cover: (names, options) => t3Cover(controller, names, options),

      get() {

        return { ...values };
      },
      order(name) {
        hold();
        return controller.order(name);
      },
      events() {
        hold();
        return controller.events();
      },
      stats() {
        hold();

      },
      layers() {

function t3Enclose(points, edges) {
  const hull = t3Hull(points);
  const n = hull.length;
  if (n < 3) return [];
  let area = 0;
  for (let i = 0; i < n; i++) area += hull[i][0] * hull[(i + 1) % n][1] - hull[(i + 1) % n][0] * hull[i][1];
  const sign = area >= 0 ? 1 : -1;
  let lines = [];
  for (let i = 0; i < n; i++) {
    const p = hull[i];
    const q = hull[(i + 1) % n];
    const dx = q[0] - p[0];
    const dy = q[1] - p[1];
    const l = Math.hypot(dx, dy);
    if (l < 1e-9) continue;
    const nx = (sign * dy) / l;
    const ny = (-sign * dx) / l;
    lines.push([nx, ny, -(nx * p[0] + ny * p[1])]);
  }
  const meet = (A, B) => {
    const det = A[0] * B[1] - A[1] * B[0];
    if (Math.abs(det) < 1e-12) return null;
    return [(-A[2] * B[1] + B[2] * A[1]) / det, (-A[0] * B[2] + B[0] * A[2]) / det];
  };
  while (lines.length > edges) {
    let best = -1;
    let cost = Infinity;
    const m = lines.length;
    for (let i = 0; i < m; i++) {
      const prev = lines[(i - 1 + m) % m];
      const self = lines[i];
      const next = lines[(i + 1) % m];
      const turn = prev[0] * next[1] - prev[1] * next[0];
      if (sign * turn <= 1e-9) continue;
      const apex = meet(prev, next);
      const a = meet(prev, self);
      const b = meet(self, next);
      if (!apex || !a || !b) continue;
      const added = Math.abs((a[0] - apex[0]) * (b[1] - apex[1]) - (a[1] - apex[1]) * (b[0] - apex[0])) / 2;
      if (added < cost) {
        cost = added;
        best = i;
      }
    }
    if (best < 0) break;
    lines.splice(best, 1);
  }
  return lines;
}

function t3Cover(controller, names, { polygons = 6, edges = 10, pad = 0.3, layers = null } = {}) {
  const uCoverEdge = new Float32Array(polygons * edges * 3);
  const uCoverCount = new Float32Array(polygons);
  const scene = controller.scene();
  const frames = controller.frames();
  const sets = Array.isArray(names) ? (names.length && Array.isArray(names[0]) ? names : [names]) : [[names]];
  const candidates = [];
  const taken = new Set();
  for (const list of sets) {
    const targets = scene.runs.filter((run) => list.includes(run.name));
    if (!targets.length) continue;
    const box = [Infinity, Infinity, -Infinity, -Infinity];
    for (const run of targets) {
      const b = frames[run.index].box;
      box[0] = Math.min(box[0], b[0]);
      box[1] = Math.min(box[1], b[1]);
      box[2] = Math.max(box[2], b[2]);
      box[3] = Math.max(box[3], b[3]);
    }
    const home = targets[0].layer;
    scene.layers.forEach((layer, index) => {
      const order = controller.orderIndex(layer.name);
      if (!order) return;
      let from = 0;
      if (index === home) {
        for (let at = 0; at < order.length; at++) if (targets.some((run) => run.index === order[at])) from = at + 1;
      } else if (!(layers && layers.includes(layer.name)) || index < home) return;
      for (let at = from; at < order.length; at++) {
        const run = scene.runs[order[at]];
        if (list.includes(run.name) || taken.has(run.index)) continue;
        const f = frames[run.index];
        const b = f.box;
        if (!(b[0] < box[2] + pad && box[0] < b[2] + pad && b[1] < box[3] + pad && box[1] < b[3] + pad)) continue;
        if (!targets.some((target) => !t3Disjoint(frames[target.index], f, -pad))) continue;
        taken.add(run.index);
        const share = (Math.min(b[2], box[2]) - Math.max(b[0], box[0])) * (Math.min(b[3], box[3]) - Math.max(b[1], box[1]));
        candidates.push({ run, f, share });
      }
    });
  }
  candidates.sort((a, b) => b.share - a.share);
  const parts = [];
  let slot = 0;
  for (const { run, f } of candidates) {
    if (slot >= polygons) break;
    const points = [];
    if (f.quadN) for (const [buf, count] of f.quadList) for (let i = 0; i < count; i++) points.push([buf[2 * i], buf[2 * i + 1]]);
    else for (let i = 0; i < f.hullN; i++) points.push([f.hull[2 * i], f.hull[2 * i + 1]]);
    const lines = t3Enclose(points, edges);
    if (!lines.length) continue;
    lines.forEach((line, e) => {
      const at = (slot * edges + e) * 3;
      uCoverEdge[at] = line[0];
      uCoverEdge[at + 1] = line[1];
      uCoverEdge[at + 2] = line[2] - pad;
    });
    uCoverCount[slot] = lines.length;
    parts.push(run.name);
    slot++;
  }
  return { uCoverEdge, uCoverCount, dropped: Math.max(0, candidates.length - slot), parts };
}

function t3PoseOf(scene, cams, name) {
  const index = scene.groups.findIndex((g) => g.name === name);
  const cam = index >= 0 && cams ? cams[index] : null;
  return { R: cam ? Array.from(cam.R) : Array.from(T3_EYE), t: cam ? [cam.t[0], cam.t[1], cam.t[2]] : [0, 0, 0] };
}

function t3Anchor(scene, cams, name, point, direction) {
  const index = name === null || name === undefined ? -1 : scene.groups.findIndex((g) => g.name === name);
  const cam = index >= 0 ? cams[index] : cams.world;
  const o = index >= 0 ? scene.groups[index].origin : [0, 0, 0];
  const R = cam.R;
  const q = [point[0] - o[0], point[1] - o[1], point[2] - o[2]];
  const world = [R[0] * q[0] + R[1] * q[1] + R[2] * q[2] + cam.t[0], R[3] * q[0] + R[4] * q[1] + R[5] * q[2] + cam.t[1], R[6] * q[0] + R[7] * q[1] + R[8] * q[2] + cam.t[2]];
  const w = cams.world;
  const screen = [w.ox + w.m[0] * world[0] + w.m[1] * world[1] + w.m[2] * world[2], w.oy + w.m[3] * world[0] + w.m[4] * world[1] + w.m[5] * world[2]];
  const out = { world, screen };
  if (direction) out.direction = [R[0] * direction[0] + R[1] * direction[1] + R[2] * direction[2], R[3] * direction[0] + R[4] * direction[1] + R[5] * direction[2], R[6] * direction[0] + R[7] * direction[1] + R[8] * direction[2]];
  return out;
}

function t3FloorOf(scene, name, R = T3_EYE) {
  const index = scene.groups.findIndex((g) => g.name === name);
  let low = Infinity;
  for (const run of scene.runs) {
    if (run.group !== index) continue;
    const c = run.cloud;
    for (let i = 0; i < c.length; i += 3) {
      const z = R[6] * c[i] + R[7] * c[i + 1] + R[8] * c[i + 2];
      if (z < low) low = z;
    }
  }
  return low;
}

function t3Compose(A, B) {
  return Array.from(t3Mul(A, B));
}

function t3PoseUniforms(controller, group, prefix = "uGroup") {
  const scene = controller.scene();
  const index = scene.groups.findIndex((g) => g.name === group);
  const cams = controller.cams();
  const cam = index >= 0 && cams ? cams[index] : null;
  const R = cam ? cam.R : T3_EYE;
  const t = cam ? cam.t : [0, 0, 0];
  const o = index >= 0 ? scene.groups[index].origin : [0, 0, 0];
  const T = [t[0] - (R[0] * o[0] + R[1] * o[1] + R[2] * o[2]), t[1] - (R[3] * o[0] + R[4] * o[1] + R[5] * o[2]), t[2] - (R[6] * o[0] + R[7] * o[1] + R[8] * o[2])];
  return { [`${prefix}X`]: [R[0], R[3], R[6]], [`${prefix}Y`]: [R[1], R[4], R[7]], [`${prefix}Z`]: [R[2], R[5], R[8]], [`${prefix}T`]: T };
}

  const block = (values) => T3_MAT_KEYS.map((key, i) => `--anatomy-${key}:${values[i]}`).concat(T3_MAT_TUBE.map((key, i) => `--mat-${key}:${values[T3_MAT_KEYS.length + i]}`)).join(";");
  for (const [name, { light, dark }] of Object.entries(T3_MATERIALS)) {
    rules.push(`[data-mat="${name}"]{${block(dark)}}`);
    rules.push(`.iso[data-theme="light"] [data-mat="${name}"]{${block(light)}}`);
    rules.push(`.iso[data-theme="dark"] [data-mat="${name}"]{${block(dark)}}`);
  }
  rules.push("[data-mat] .tb-body{fill:var(--mat-body)}");
  rules.push("[data-mat] .tb-shine{fill:var(--mat-shine)}");
  rules.push("[data-mat] .tb-shade{fill:var(--mat-shade)}");
  rules.push("[data-mat] .tb-edge{stroke:var(--mat-edge)}");
  return rules.join("\n");
}

}

const P = DATA.P;
// Quadcopter model: a 1.4 kg, 450-class frame with 10 x 4.5 inch props, X layout,
// ArduPilot motor numbering. Everything the figure shows (rotor speeds, tilt, the
// load-cell reading, the telemetry bars) is computed here.
//
// Static thrust of a propeller: T = C_T · ρ · n² · D⁴ (n in rev/s, D in m).
// Reaction torque:              Q = C_Q · ρ · n² · D⁵.
// With C_T ≈ 0.10 and D = 0.254 m, a hover share of 3.43 N needs ≈ 82 rev/s ≈ 4,900 rpm.

const MASS = 1.4; // kg
const G0 = 9.81; // m/s²
const RHO = 1.225; // kg/m³
const D = 0.254; // m, 10 inch prop
const CT = 0.1;
const CQ = 0.0075;
const WEIGHT = MASS * G0; // 13.73 N
const KT = CT * RHO * D ** 4; // N per (rev/s)²
const HOVER_T = WEIGHT / 4; // N per motor
const HOVER_RPM = Math.sqrt(HOVER_T / KT) * 60; // ≈ 4,920 rpm
const MAX_TILT = 12; // degrees the stand allows, and the attitude the sticks command
const YAW_RATE = 60; // degrees per second at full yaw stick

// Motors: position on the frame (x forward, y left), spin seen from above.
// ArduPilot quad X: 1 front-right CCW, 2 rear-left CCW, 3 front-left CW, 4 rear-right CW.
const MOTORS = [
  { id: 1, x: 1, y: -1, spin: 1 },
  { id: 2, x: -1, y: 1, spin: 1 },
  { id: 3, x: 1, y: 1, spin: -1 },
  { id: 4, x: -1, y: -1, spin: -1 },
];

// The mixer. Sticks are -1..1: throttle (0 = hover), pitch (+ = nose down), roll
// (+ = right side down), yaw (+ = clockwise seen from above). Each output is a
// thrust share relative to hover.
//   pitch forward: the rear pair speeds up, the front pair slows.
//   roll right:    the left pair speeds up.
//   yaw clockwise: the counter-clockwise props speed up; their reaction torque on
//                  the frame is clockwise, and total thrust stays the same.
function mix({ throttle = 0, pitch = 0, roll = 0, yaw = 0 }) {
  return MOTORS.map((m) => 1 + 0.32 * throttle - 0.14 * pitch * m.x + 0.14 * roll * m.y + 0.18 * yaw * m.spin);
}

const rpmOf = (share) => Math.sqrt((Math.max(0, share) * HOVER_T) / KT) * 60;
const thrustOf = (rpm) => KT * (rpm / 60) ** 2;
const torqueOf = (rpm) => CQ * RHO * (rpm / 60) ** 2 * D ** 5;

// What the stand measures and what free flight would do.
function state(sticks, tilt = { pitch: 0, roll: 0 }) {
  const shares = mix(sticks);
  const rpm = shares.map(rpmOf);
  const thrust = rpm.map(thrustOf);
  const total = thrust.reduce((a, b) => a + b, 0);
  const rad = Math.PI / 180;
  const vertical = total * Math.cos(tilt.pitch * rad) * Math.cos(tilt.roll * rad);
  const net = vertical - WEIGHT; // N, what the load cell under the post reads
  const yawTorque = rpm.reduce((sum, r, i) => sum + MOTORS[i].spin * torqueOf(r), 0); // + = clockwise
  const tiltAngle = Math.acos(Math.cos(tilt.pitch * rad) * Math.cos(tilt.roll * rad)) / rad;
  const sideways = G0 * Math.tan(tiltAngle * rad); // m/s² if altitude were held
  return { shares, rpm, thrust, total, net, yawTorque, sideways };
}

const follow = (v) => ({ yaw: -(v.heading ?? 0), pitch: v.pitch ?? 0, roll: v.roll ?? 0, prop1: v.prop1 ?? 0, prop2: v.prop2 ?? 0, prop3: v.prop3 ?? 0, prop4: v.prop4 ?? 0 });
const gaugeNeedle = (newtons) => {
  const v = Math.max(-GAUGE_SPAN * 1.08, Math.min(GAUGE_SPAN * 1.08, newtons));
  const a = (v / GAUGE_SPAN) * GAUGE_SWEEP * D2R + Math.PI; // zero points away from the viewer
  const [x, y] = GAUGE;
  const dir = [Math.sin(a), -Math.cos(a)];
  return k.lineOnTop([x - dir[0] * 3.6, y - dir[1] * 3.6], [x + dir[0] * (GAUGE_R - 4.6), y + dir[1] * (GAUGE_R - 4.6)], GAUGE_Z + 2.2, P);
};
const stickTip = (side, x, y) => {
  const [cx, cy] = STICKS[side];
  const lean = 24 * D2R;
  const ax = Math.sin(lean * x);
  const ay = Math.sin(lean * y);
  return [cx + STICK_L * ax, cy + STICK_L * ay, STICK_Z + STICK_L * Math.sqrt(Math.max(0, 1 - ax * ax - ay * ay))];
};
const stickPath = (side, x, y) => k.segment([...STICKS[side], STICK_Z], stickTip(side, x, y), P);
const barPath = (i, share) => {
  const f = Math.max(0.02, Math.min(1, (share - 0.55) / 0.9));
  const y = BAR.rows[i];
  return k.onTop([[BAR.x0, y - BAR.w / 2], [BAR.x0 + BAR.len * f, y - BAR.w / 2], [BAR.x0 + BAR.len * f, y + BAR.w / 2], [BAR.x0, y + BAR.w / 2]], TX_Z1 + 0.05, P, true);
};
const D2R = Math.PI / 180;
const GAUGE = DATA.gauge.at, GAUGE_R = DATA.gauge.r, GAUGE_Z = DATA.gauge.z, GAUGE_SPAN = DATA.gauge.span, GAUGE_SWEEP = DATA.gauge.sweep;
const STICKS = DATA.sticks.at, STICK_Z = DATA.sticks.z, STICK_L = DATA.sticks.l, BAR = DATA.bar, TX_Z1 = DATA.screenZ;
const G = { sub3: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]] };
const k = { lineOnTop, segment, onTop, translateAlong };

const stage = document.querySelector(".dr-stage");
const readout = document.querySelector("[data-readout]");
const needleEl = stage.querySelector('[data-part="needle"]');
const barEls = [0, 1, 2, 3].map((i) => stage.querySelector(`[data-bar="${i}"]`));
const stickLeftShaft = stage.querySelector('[data-stick="left"] [data-part="shaft"]');
const stickLeftKnob = stage.querySelector('[data-stick="left"] [data-part="knob"]');
const stickRightShaft = stage.querySelector('[data-stick="right"] [data-part="shaft"]');
const stickRightKnob = stage.querySelector('[data-stick="right"] [data-part="knob"]');

const still = matchMedia("(prefers-reduced-motion: reduce)");

let visible = false;
let frame = 0;
let last = 0;
let clock = 0;
let idleTimer = 0;
let touring = !still.matches;

// Current and target control stick inputs [-1..1]
const targetSticks = { throttle: 0, pitch: 0, roll: 0, yaw: 0 };
const curSticks = { throttle: 0, pitch: 0, roll: 0, yaw: 0 };

let heading = 0;
const propAngles = [0, 0, 0, 0];

// Tour steps
function tourAt(t) {
  const cycle = t % 18;
  if (cycle < 2.5) {
    // Hover
    return { throttle: 0, pitch: 0, roll: 0, yaw: 0, label: "hover" };
  } else if (cycle < 6.0) {
    // Pitch forward (rear motors speed up)
    const p = Math.sin(((cycle - 2.5) / 3.5) * Math.PI) * 0.75;
    return { throttle: 0, pitch: p, roll: 0, yaw: 0, label: "pitch forward · nose down" };
  } else if (cycle < 9.5) {
    // Roll right (left motors speed up)
    const r = Math.sin(((cycle - 6.0) / 3.5) * Math.PI) * 0.75;
    return { throttle: 0, pitch: 0, roll: r, yaw: 0, label: "roll right" };
  } else if (cycle < 13.0) {
    // Yaw clockwise (CCW motors speed up, reaction torque turns frame CW)
    const y = Math.sin(((cycle - 9.5) / 3.5) * Math.PI) * 0.8;
    return { throttle: 0, pitch: 0, roll: 0, yaw: y, label: "yaw clockwise" };
  } else if (cycle < 16.0) {
    // Climb (all motors speed up)
    const th = Math.sin(((cycle - 13.0) / 3.0) * Math.PI) * 0.6;
    return { throttle: th, pitch: 0, roll: 0, yaw: 0, label: "throttle climb" };
  } else {
    return { throttle: 0, pitch: 0, roll: 0, yaw: 0, label: "settle to hover" };
  }
}

const controller = TURN.mount(stage, DATA.turn, {
  follow,
  onHold: () => {
    touring = false;
    clearTimeout(idleTimer);
  },
  onFrame: () => {},
});

function draw(st, tourLabel) {
  // Update 3D drone attitude and prop spins
  const pitchDeg = curSticks.pitch * DATA.tilt;
  const rollDeg = curSticks.roll * DATA.tilt;

  controller.set({
    heading,
    pitch: pitchDeg,
    roll: rollDeg,
    prop1: propAngles[0],
    prop2: propAngles[1],
    prop3: propAngles[2],
    prop4: propAngles[3],
  });

  // Gauge needle: net force
  needleEl.setAttribute("d", gaugeNeedle(st.net));

  // Sticks on transmitter
  stickLeftShaft.setAttribute("d", stickPath("left", curSticks.yaw, curSticks.throttle));
  const lTip = stickTip("left", curSticks.yaw, curSticks.throttle);
  stickLeftKnob.setAttribute(
    "transform",
    k.translateAlong(P, G.sub3(lTip, [STICKS.left[0], STICKS.left[1], STICK_Z + STICK_L])),
  );

  stickRightShaft.setAttribute("d", stickPath("right", curSticks.roll, curSticks.pitch));
  const rTip = stickTip("right", curSticks.roll, curSticks.pitch);
  stickRightKnob.setAttribute(
    "transform",
    k.translateAlong(P, G.sub3(rTip, [STICKS.right[0], STICKS.right[1], STICK_Z + STICK_L])),
  );

  // Screen bars for 4 motors
  for (let i = 0; i < 4; i++) {
    barEls[i].setAttribute("d", barPath(i, st.shares[i]));
  }

  // Live readout
  let modeDesc = tourLabel || "hover";
  if (!touring) {
    if (Math.abs(curSticks.pitch) > 0.15) modeDesc = curSticks.pitch > 0 ? "pitch forward" : "pitch back";
    else if (Math.abs(curSticks.roll) > 0.15) modeDesc = curSticks.roll > 0 ? "roll right" : "roll left";
    else if (Math.abs(curSticks.yaw) > 0.15) modeDesc = curSticks.yaw > 0 ? "yaw clockwise" : "yaw counter-cw";
    else if (Math.abs(curSticks.throttle) > 0.15) modeDesc = curSticks.throttle > 0 ? "climb" : "descend";
    else modeDesc = "hover";
  }

  const avgRpm = Math.round(st.rpm.reduce((a, b) => a + b, 0) / 4);
  const sign = st.net >= 0 ? "+" : "−";
  const absNet = Math.abs(st.net).toFixed(1);
  const text = `${modeDesc} · ${avgRpm.toLocaleString("en-US")} rpm · net ${sign}${absNet} N`;
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;

  let tourLabel = "";
  if (touring) {
    clock += dt;
    const tour = tourAt(clock);
    targetSticks.throttle = tour.throttle;
    targetSticks.pitch = tour.pitch;
    targetSticks.roll = tour.roll;
    targetSticks.yaw = tour.yaw;
    tourLabel = tour.label;
  }

  const calm = still.matches;
  const easeRate = calm ? 1 : 1 - Math.exp(-dt / 0.16);
  curSticks.throttle += (targetSticks.throttle - curSticks.throttle) * easeRate;
  curSticks.pitch += (targetSticks.pitch - curSticks.pitch) * easeRate;
  curSticks.roll += (targetSticks.roll - curSticks.roll) * easeRate;
  curSticks.yaw += (targetSticks.yaw - curSticks.yaw) * easeRate;

  const tilt = { pitch: curSticks.pitch * DATA.tilt, roll: curSticks.roll * DATA.tilt };
  const st = state(curSticks, tilt);

  // Yaw rate integration
  heading = ((heading + curSticks.yaw * YAW_RATE * dt) % 360 + 360) % 360;

  // Propeller spin integration
  for (let i = 0; i < 4; i++) {
    const revPerSec = st.rpm[i] / 60;
    const dDeg = MOTORS[i].spin * revPerSec * 360 * dt;
    propAngles[i] = ((propAngles[i] + dDeg) % 180 + 180) % 180;
  }

  draw(st, tourLabel);

  const settled =
    !touring &&
    Math.abs(targetSticks.throttle - curSticks.throttle) < 0.005 &&
    Math.abs(targetSticks.pitch - curSticks.pitch) < 0.005 &&
    Math.abs(targetSticks.roll - curSticks.roll) < 0.005 &&
    Math.abs(targetSticks.yaw - curSticks.yaw) < 0.005 &&
    Math.abs(curSticks.yaw) < 0.005;

  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

const hold = () => {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    touring = !still.matches;
    clock = 0;
    run();
  }, 3600);
};

// Pointer interaction on stage: dragging tilts drone (pitch & roll)
let dragging = false;
let dragOrigin = null;

stage.addEventListener("pointerdown", (e) => {
  hold();
  dragging = true;
  dragOrigin = [e.clientX, e.clientY];
  stage.setPointerCapture(e.pointerId);
  stage.setAttribute("data-drag", "");
});

stage.addEventListener("pointermove", (e) => {
  if (!dragging || !dragOrigin) return;
  const dx = (e.clientX - dragOrigin[0]) / 80;
  const dy = (e.clientY - dragOrigin[1]) / 80;
  targetSticks.roll = Math.max(-1, Math.min(1, dx));
  targetSticks.pitch = Math.max(-1, Math.min(1, -dy));
  run();
});

const endDrag = (e) => {
  if (!dragging) return;
  dragging = false;
  dragOrigin = null;
  stage.removeAttribute("data-drag");
  targetSticks.pitch = 0;
  targetSticks.roll = 0;
  hold();
  run();
};

stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

// Keyboard interaction
stage.addEventListener("keydown", (e) => {
  let handled = true;
  hold();
  switch (e.key) {
    case "ArrowUp":
      targetSticks.pitch = Math.min(1, targetSticks.pitch + 0.35);
      break;
    case "ArrowDown":
      targetSticks.pitch = Math.max(-1, targetSticks.pitch - 0.35);
      break;
    case "ArrowLeft":
      targetSticks.roll = Math.max(-1, targetSticks.roll - 0.35);
      break;
    case "ArrowRight":
      targetSticks.roll = Math.min(1, targetSticks.roll + 0.35);
      break;
    case "w":
    case "W":
      targetSticks.throttle = Math.min(1, targetSticks.throttle + 0.25);
      break;
    case "s":
    case "S":
      targetSticks.throttle = Math.max(-1, targetSticks.throttle - 0.25);
      break;
    case "a":
    case "A":
      targetSticks.yaw = Math.max(-1, targetSticks.yaw - 0.35);
      break;
    case "d":
    case "D":
      targetSticks.yaw = Math.min(1, targetSticks.yaw + 0.35);
      break;
    case " ":
    case "Enter":
      targetSticks.throttle = 0;
      targetSticks.pitch = 0;
      targetSticks.roll = 0;
      targetSticks.yaw = 0;
      break;
    default:
      handled = false;
  }
  if (handled) {
    e.preventDefault();
    run();
  }
});

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

// Initial draw
const initTilt = { pitch: 0, roll: 0 };
draw(state(curSticks, initTilt), "hover");
</script>
<script type="module" data-anatomy-ux>
(() => {
  const body = document.body;
  const stage = document.querySelector(".iso-stage");
  const status = document.querySelector("[data-anatomy-status]");
  const readout = document.querySelector("[data-readout]");
  const slug = location.pathname.replace(/\/+$/, "").split("/").pop();

  /* theme: one vocabulary on every figure, persisted to the site's key */
  const themeButtons = [...document.querySelectorAll("[data-anatomy-theme]")];
  const syncThemeButtons = () => {
    const current = body.getAttribute("data-theme");
    themeButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.anatomyTheme === current)));
  };
  const setTheme = (t) => {
    body.setAttribute("data-theme", t);
    document.documentElement.setAttribute("data-anatomy-theme", t);
    try { localStorage.setItem("bc-theme", t); } catch (e) {}
    const u = new URL(location.href);
    u.searchParams.set("theme", t);
    history.replaceState(null, "", u);
    syncThemeButtons();
  };
  themeButtons.forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.anatomyTheme)));
  syncThemeButtons();
  /* the flame-licker's own extra theme pills are superseded by the shared
     control, so every figure speaks the same theme vocabulary */
  const flameThemeGroup = [...document.querySelectorAll(".engine-toolbar .toolbar-group")]
    .find((g) => g.querySelector("[data-theme-choice]"));
  if (flameThemeGroup) flameThemeGroup.style.display = "none";

  if (!stage) return;

  /* the stage is a labelled control surface, not a single-axis slider:
     strip the value attributes the animation code keeps re-adding */
  const stripAriaValues = () => {
    for (const a of ["aria-valuemin", "aria-valuemax", "aria-valuenow", "aria-valuetext"]) {
      if (stage.hasAttribute(a)) stage.removeAttribute(a);
    }
  };
  stripAriaValues();
  new MutationObserver(stripAriaValues).observe(stage, {
    attributes: true, attributeFilter: ["aria-valuenow", "aria-valuetext"],
  });

  /* mirror the plate readout into a live region, throttled, and only
     shortly after the reader actually drives the figure */
  let announceUntil = 0;
  let statusTimer = 0;
  const markInteracted = () => { announceUntil = Date.now() + 6000; };
  stage.addEventListener("pointerdown", markInteracted);
  stage.addEventListener("keydown", markInteracted);
  if (readout && status) {
    new MutationObserver(() => {
      if (Date.now() > announceUntil) return;
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { status.textContent = readout.textContent; }, 700);
    }).observe(readout, { characterData: true, childList: true, subtree: true });
  }

  /* on-screen controls drive the figure through its own keyboard path */
  const press = (key) => {
    markInteracted();
    stage.focus({ preventScroll: true });
    stage.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true }));
  };
  document.querySelectorAll("[data-anatomy-key]").forEach((btn) => {
    btn.addEventListener("click", () => press(btn.dataset.anatomyKey));
  });

  /* speaker: the slider steers through the stage's own pointer path */
  const range = document.querySelector('[data-anatomy-range="hz"]');
  if (range && slug === "bookshelf-speaker") {
    const out = document.querySelector("[data-anatomy-range-out]");
    const minLog = Math.log10(40), maxLog = Math.log10(20000);
    const steerTo = (hz) => {
      const svg = stage.querySelector("svg");
      if (!svg) return;
      const r = svg.getBoundingClientRect();
      const share = (Math.log10(hz) - minLog) / (maxLog - minLog);
      markInteracted();
      stage.dispatchEvent(new PointerEvent("pointermove", {
        bubbles: true, buttons: 1,
        clientX: r.left + share * r.width, clientY: r.top + r.height / 2,
      }));
      if (out) out.textContent = Math.round(hz).toLocaleString("en-US") + " Hz";
    };
    range.addEventListener("input", () => steerTo(Number(range.value)));
  }

  /* speaker: the cutaway button reflects the stage's own state */
  const cutBtn = document.querySelector('[data-anatomy-action="cutaway"]');
  if (cutBtn) {
    const syncCut = () => cutBtn.setAttribute("aria-pressed", String(stage.getAttribute("data-cutaway") === "true"));
    cutBtn.addEventListener("click", () => { press("c"); syncCut(); });
    new MutationObserver(syncCut).observe(stage, { attributes: true, attributeFilter: ["data-cutaway"] });
    syncCut();
  }

  /* flame-licker: phase descriptions belong on the page, not in tooltips */
  if (slug === "flame-licker") {
    const toolbar = document.querySelector(".engine-toolbar");
    const firstPhase = document.querySelector("[data-phase-btn]");
    if (toolbar && firstPhase) {
      const note = document.createElement("p");
      note.className = "anatomy-phase-note";
      note.setAttribute("role", "status");
      note.textContent = firstPhase.getAttribute("title") || "";
      toolbar.appendChild(note);
      document.querySelectorAll("[data-phase-btn]").forEach((b) =>
        b.addEventListener("click", () => { note.textContent = b.getAttribute("title") || ""; }));
    }
  }

  /* deep links: the interesting state lives in the URL, restored on load */
  const q = new URLSearchParams(location.search);
  const setParam = (k, v) => {
    const u = new URL(location.href);
    if (v === null || v === undefined) u.searchParams.delete(k);
    else u.searchParams.set(k, String(v));
    history.replaceState(null, "", u);
  };
  const pressGroup = (group, key) => {
    document.querySelectorAll('[data-anatomy-group="' + group + '"]').forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.anatomyKey === key)));
  };

  if (slug === "limited-slip-differential") {
    stage.addEventListener("keydown", (e) => {
      if (/^[1-4]$/.test(e.key)) { pressGroup("scenario", e.key); setParam("scenario", e.key); }
    });
    const v = q.get("scenario");
    if (/^[1-4]$/.test(v || "")) { pressGroup("scenario", v); press(v); }
    else pressGroup("scenario", "3"); /* the figure's own initial scenario */
  }

  if (slug === "robotic-cat") {
    stage.addEventListener("keydown", (e) => {
      if (/^[1-4]$/.test(e.key)) { pressGroup("preset", e.key); setParam("preset", e.key); }
    });
    const v = q.get("preset");
    if (/^[1-4]$/.test(v || "")) { pressGroup("preset", v); press(v); }
  }

  if (slug === "bookshelf-speaker") {
    const presetHz = { "1": 45, "2": 800, "3": 2800, "4": 12000 };
    stage.addEventListener("keydown", (e) => {
      if (presetHz[e.key]) setParam("hz", presetHz[e.key]);
      if (e.key === " " || e.key.toLowerCase() === "c") {
        setTimeout(() => setParam("cutaway", stage.getAttribute("data-cutaway") === "true" ? null : "0"), 0);
      }
    });
    if (range) range.addEventListener("input", () => setParam("hz", range.value));
    const hz = Number(q.get("hz"));
    if (hz >= 40 && hz <= 20000 && range) {
      range.value = String(Math.round(hz));
      range.dispatchEvent(new Event("input", { bubbles: true }));
    }
    if (q.get("cutaway") === "0" && stage.getAttribute("data-cutaway") === "true") press("c");
  }

  if (slug === "drone") {
    let throttleSteps = 0;
    stage.addEventListener("keydown", (e) => {
      if (e.key === "w" || e.key === "W") throttleSteps = Math.min(4, throttleSteps + 1);
      else if (e.key === "s" || e.key === "S") throttleSteps = Math.max(-4, throttleSteps - 1);
      else if (e.key === "Enter") throttleSteps = 0;
      else return;
      setParam("throttle", throttleSteps === 0 ? null : String(throttleSteps * 0.25));
    });
    const th = Number(q.get("throttle"));
    if (th) {
      const steps = Math.max(-4, Math.min(4, Math.round(th / 0.25)));
      for (let i = 0; i < Math.abs(steps); i++) press(steps > 0 ? "w" : "s");
    }
  }

  if (slug === "flame-licker") {
    document.querySelectorAll("[data-phase-btn]").forEach((b) =>
      b.addEventListener("click", () => setParam("step", b.dataset.phaseBtn)));
    stage.addEventListener("keydown", (e) => {
      if (/^[1-4]$/.test(e.key)) setParam("step", e.key);
    });
    const speed = document.querySelector("#speed-slider");
    if (speed) {
      speed.addEventListener("input", () => setParam("rpm", speed.value));
      const rpm = Number(q.get("rpm"));
      if (rpm >= 30 && rpm <= 180) {
        speed.value = String(rpm);
        speed.dispatchEvent(new Event("input", { bubbles: true }));
      }
    }
    const step = q.get("step");
    if (/^[1-4]$/.test(step || "")) {
      const b = document.querySelector('[data-phase-btn="' + step + '"]');
      if (b) b.click();
    }
  }
})();
</script>
