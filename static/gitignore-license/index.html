<style>
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:100 800;font-display:swap;src:url("../fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2")}

:root{
  color-scheme: light dark;
  --bg:#e9eaed; --surface:#f7f7f9; --surface-2:#ffffff;
  --ink:#1d2126; --muted:#5b6068; --line:#d6d7dc; --line-2:#bfc2ca; --chip:#ececf0;
  --accent:#2f6db3; --accent-strong:#26598f; --accent-ink:#ffffff;
  --ok:#2e7d4f; --danger:#8f2d23; --danger-bg:#fdeeee; --danger-line:#efc2c2;
  --warn:#7a4b00; --warn-bg:#fff4dc; --warn-line:#e8c98a;
  --shadow:0 1px 2px rgba(24,28,38,.05),0 10px 28px rgba(24,28,38,.07);
  --ui-font:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono-font:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121316; --surface:#1a1b1f; --surface-2:#222329;
    --ink:#eceef2; --muted:#a2a6af; --line:#2d2f36; --line-2:#3d404a; --chip:#26272e;
    --accent:#7db0e6; --accent-strong:#9cc3ee; --accent-ink:#0d1724;
    --ok:#6fce97; --danger:#f0a9a0; --danger-bg:#3a2120; --danger-line:#6e3a36;
    --warn:#fdd663; --warn-bg:#352c12; --warn-line:#6b5a22;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--ui-font);font-size:15px;line-height:1.45;background:var(--bg);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:var(--accent-strong)}
header.site{padding:1rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--line)}
header.site .top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap}
header.site h1{margin:0;font-size:1.35rem;font-weight:600;line-height:1.2}
header.site .back{font-size:.8125rem;color:var(--muted);text-decoration:none}
header.site .back:hover{color:var(--accent-strong);text-decoration:underline}
header.site p{margin:.35rem 0 0;color:var(--muted);max-width:60rem}
main.wrap{max-width:1180px;margin:0 auto;padding:1rem 1.25rem 3rem;display:grid;gap:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:1rem}
.card>h2,.lbl{margin:0 0 .6rem;font-size:.6875rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lbl{display:block;margin:0 0 .25rem}
.cols{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end}
.row.center{align-items:center}
.field{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.field.grow{flex:1 1 180px}
input[type=text],input[type=number],input[type=search],input[type=url],input[type=date],select,textarea{
  font:inherit;font-size:.875rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:.4rem .6rem;min-width:0;width:100%}
input[type=number]{font-family:var(--mono-font);font-size:.8125rem}
textarea{font-family:var(--mono-font);font-size:.8125rem;line-height:1.5;resize:vertical;tab-size:2}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
input[type=color]{width:2.4rem;height:2rem;padding:0;border:1px solid var(--line-2);border-radius:8px;background:none;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:1rem;height:1rem;margin:0}
label.chk{display:inline-flex;gap:.4rem;align-items:center;font-size:.875rem;cursor:pointer}
button,.btn{font:inherit;font-size:.875rem;padding:.4rem .85rem;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;line-height:1.2}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
button:disabled{opacity:.5;cursor:not-allowed}
button.sm{padding:.2rem .6rem;font-size:.75rem}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;border-radius:0;background:transparent;padding:.35rem .8rem}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.out{position:relative;margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:.75rem 3.6rem .75rem .85rem;font-family:var(--mono-font);font-size:.8125rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:26rem}
.out>button.copy{position:absolute;top:.4rem;right:.4rem}
.note{font-size:.8125rem;color:var(--muted);margin:.5rem 0 0}
.msg{border-radius:9px;padding:.5rem .75rem;font-size:.8125rem;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn)}
.msg.bad{border-color:var(--danger-line);background:var(--danger-bg);color:var(--danger)}
.msg:empty{display:none}
.pill{display:inline-block;font-size:.6875rem;font-weight:600;padding:.1rem .5rem;border-radius:999px;background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--danger)}
table.t{width:100%;border-collapse:collapse;font-size:.8125rem}
table.t th,table.t td{text-align:left;padding:.35rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.t td.m,.mono{font-family:var(--mono-font)}
.scroll{overflow:auto}
.toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.45rem .9rem;border-radius:999px;font-size:.8125rem;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50}
.toast.show{opacity:1}
.drop{border:2px dashed var(--line-2);border-radius:12px;padding:1.4rem;text-align:center;color:var(--muted);background:var(--surface-2);cursor:pointer}
.drop.over,.drop:hover{border-color:var(--accent);color:var(--ink)}
kbd{font-family:var(--mono-font);font-size:.75rem;background:var(--chip);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:.05rem .4rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation-duration:.001ms!important;animation-iteration-count:1!important}}


.picks{display:flex;flex-wrap:wrap;gap:.35rem}
.picks label{display:inline-flex;gap:.35rem;align-items:center;border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:.2rem .7rem;font-size:.8125rem;cursor:pointer}
.picks label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.picks input{position:absolute;opacity:0;pointer-events:none}
.picks label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.grp{margin-top:.9rem}.grp:first-of-type{margin-top:0}
.tags3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-top:.6rem}
.tags3 div{border:1px solid var(--line);border-radius:9px;padding:.5rem .7rem;font-size:.8125rem;background:var(--surface-2)}
.tags3 b{display:block;font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.15rem}
#l-out,#g-out{min-height:18rem;max-height:32rem}

</style>

<body>
<header class="site">
  <div class="top"><h1>.gitignore & License Generator</h1><a class="back" href="../tools/">&larr; All tools</a></div>
  <p>Combine .gitignore templates for your languages, editors and operating systems, and fill in a license with your name and year. Templates are embedded from upstream, so nothing is fetched.</p>
</header>
<main class="wrap">

<section class="card" aria-labelledby="h-gi">
  <h2 id="h-gi">.gitignore</h2>
  <div class="row center" style="margin-bottom:.6rem">
    <div class="field grow"><label class="sr-only" for="g-q">Filter templates</label><input type="search" id="g-q" placeholder="Filter templates (node, python, jetbrains)"></div>
    <button id="g-clear">Clear selection</button>
  </div>
  <div id="g-picks"></div>
  <div class="field" style="margin-top:.8rem"><label class="lbl" for="g-extra">Your own patterns (optional)</label>
    <textarea id="g-extra" rows="3" spellcheck="false" placeholder=".env.local&#10;/dist/"></textarea></div>
  <div class="row center" style="margin-top:.6rem">
    <label class="chk"><input type="checkbox" id="g-dedupe" checked> Skip patterns already listed above</label>
    <label class="chk"><input type="checkbox" id="g-heads" checked> Section headers</label>
  </div>
</section>
<section class="card" aria-labelledby="h-gout">
  <h2 id="h-gout">Result <span class="pill" id="g-stat" style="margin-left:.4rem"></span></h2>
  <label class="sr-only" for="g-out">Generated .gitignore</label>
  <textarea id="g-out" readonly spellcheck="false"></textarea>
  <div class="row" style="margin-top:.6rem">
    <button class="primary copy" data-copy-from="g-out">Copy</button>
    <button id="g-dl">Download .gitignore</button>
  </div>
</section>
<section class="card" aria-labelledby="h-lic">
  <h2 id="h-lic">License</h2>
  <div class="row">
    <div class="field grow"><label class="lbl" for="l-sel">License</label><select id="l-sel"></select></div>
    <div class="field grow"><label class="lbl" for="l-name">Copyright holder</label><input type="text" id="l-name" placeholder="Your name or organization" autocomplete="name"></div>
    <div class="field" style="width:6rem"><label class="lbl" for="l-year">Year</label><input type="text" id="l-year" inputmode="numeric"></div>
    <div class="field grow"><label class="lbl" for="l-mail">Email (optional)</label><input type="text" id="l-mail" autocomplete="email"></div>
  </div>
  <p class="note" id="l-desc" style="margin:.7rem 0 0"></p>
  <div class="tags3" id="l-tags"></div>
  <p class="msg" id="l-msg" hidden></p>
  <label class="lbl" for="l-out" style="margin-top:.8rem">LICENSE</label>
  <textarea id="l-out" readonly spellcheck="false"></textarea>
  <div class="row" style="margin-top:.6rem">
    <button class="primary copy" data-copy-from="l-out">Copy</button>
    <button id="l-dl">Download LICENSE</button>
    <button id="z-dl">Download both (.zip)</button>
  </div>
  <div class="row" style="margin-top:.8rem">
    <div class="field grow"><label class="lbl" for="l-spdx">SPDX header for source files</label><input type="text" id="l-spdx" readonly></div>
    <div class="field grow"><label class="lbl" for="l-pkg">package.json</label><input type="text" id="l-pkg" readonly></div>
  </div>
</section>
<p class="note" id="src-note"></p>


</main>
<script>
const TOOL="gitignore-license";

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const store={
  get(k,d){try{const v=localStorage.getItem('bc:'+TOOL+':'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('bc:'+TOOL+':'+k,JSON.stringify(v))}catch(e){}}
};
let _toastT;
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;t.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('show'),1400)}
async function copyText(text,label){
  try{await navigator.clipboard.writeText(text)}catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')}catch(_){}ta.remove()}
  toast((label||'Copied')+' to clipboard')}
function download(name,data,type){
  const blob=data instanceof Blob?data:new Blob([data],{type:type||'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button.copy[data-copy-from]');
  if(b){const el=document.getElementById(b.dataset.copyFrom);if(el)copyText(el.value!==undefined&&el.tagName==='TEXTAREA'?el.value:el.textContent)}});


const _crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=_crcT[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
/* Minimal ZIP writer (stored, no compression). files: [{name, data:Uint8Array}] */
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let offset=0;
  const d=new Date(),dt=((d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate())&0xFFFF,tm=(d.getHours()<<11|d.getMinutes()<<5|(d.getSeconds()>>1))&0xFFFF;
  for(const f of files){
    const name=enc.encode(f.name),crc=crc32(f.data),size=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,size,true);lh.setUint32(22,size,true);
    lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,size,true);ch.setUint32(24,size,true);
    ch.setUint16(28,name.length,true);ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name);
    offset+=30+name.length+size}
  const cdSize=central.reduce((n,p)=>n+p.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'})}

</script>

ing platform-specific dependencies or dependencies\n#   having no cross-platform support, pipenv may install dependencies that don't work, or not\n#   install all needed dependencies.\n# Pipfile.lock\n\n# uv\n#   Similar to Pipfile.lock, it is generally recommended to include uv.lock in version control.\n#   This is especially recommended for binary packages to ensure reproducibility, and is more\n#   commonly ignored for libraries.\n# uv.lock\n\n# poetry\n#   Similar to Pipfile.lock, it is generally recommended to include poetry.lock in version control.\n#   This is especially recommended for binary packages to ensure reproducibility, and is more\n#   commonly ignored for libraries.\n#   https://python-poetry.org/docs/basic-usage/#commit-your-poetrylock-file-to-version-control\n# poetry.lock\n# poetry.toml\n\n# pdm\n#   Similar to Pipfile.lock, it is generally recommended to include pdm.lock in version control.\n#   pdm recommends including project-wide configuration in pdm.toml, but excluding .pdm-python.\n#   https://pdm-project.org/en/latest/usage/project/#working-with-version-control\n# pdm.lock\n# pdm.toml\n.pdm-python\n.pdm-build/\n\n# pixi\n#   Similar to Pipfile.lock, it is generally recommended to include pixi.lock in version control.\n# pixi.lock\n#   Pixi creates a virtual environment in the .pixi directory, just like venv module creates one\n#   in the .venv directory. It is recommended not to include this directory in version control.\n.pixi/*\n!.pixi/config.toml\n\n# PEP 582; used by e.g. github.com/David-OConnor/pyflow and github.com/pdm-project/pdm\n__pypackages__/\n\n# Celery stuff\ncelerybeat-schedule*\ncelerybeat.pid\n\n# Redis\n*.rdb\n*.aof\n*.pid\n\n# RabbitMQ\nmnesia/\nrabbitmq/\nrabbitmq-data/\n\n# ActiveMQ\nactivemq-data/\n\n# SageMath parsed files\n*.sage.py\n\n# Environments\n.env\n.envrc\n.venv\nenv/\nvenv/\nENV/\nenv.bak/\nvenv.bak/\n\n# Conda environments\nconda-meta/\n\n# Spyder project settings\n.spyderproject\n.spyproject\n\n# Rope p ore, Objective-C.gitignore & Swift.gitignore\n\n## User settings\nxcuserdata/\n\n## Obj-C/Swift specific\n*.hmap\n\n## App packaging\n*.ipa\n*.dSYM.zip\n*.dSYM\n\n## Playgrounds\ntimeline.xctimeline\nplayground.xcworkspace\n\n# Swift Package Manager\n#\n# Add this line if you want to avoid checking in source code from Swift Package Manager dependencies.\n# Packages/\n# Package.pins\n# Package.resolved\n# *.xcodeproj\n#\n# Xcode automatically generates this directory with a .xcworkspacedata file and xcuserdata\n# hence it is not needed unless you have added a package configuration file to your project\n# .swiftpm\n\n.build/\n\n# CocoaPods\n#\n# We recommend against adding the Pods directory to your .gitignore. However\n# you should judge for yourself, the pros and cons are mentioned at:\n# https://guides.cocoapods.org/using/using-cocoapods.html#should-i-check-the-pods-directory-into-source-control\n#\n# Pods/\n#\n# Add this line if you want to avoid checking in source code from the Xcode workspace\n# *.xcworkspace\n\n# Carthage\n#\n# Add this line if you want to avoid checking in source code from Carthage dependencies.\n# Carthage/Checkouts\n\nCarthage/Build/\n\n# fastlane\n#\n# It is recommended to not store the screenshots in the git repo.\n# Instead, use fastlane to re-generate the screenshots whenever they are needed.\n# For more information about the recommended setup visit:\n# https://docs.fastlane.tools/best-practices/source-control/#source-control\n\nfastlane/report.xml\nfastlane/Preview.html\nfastlane/screenshots/**/*.png\nfastlane/test_output\n"},{"id":"Ruby","group":"Language & framework","body":"*.gem\n*.rbc\n/.config\n/coverage/\n/InstalledFiles\n/pkg/\n/spec/reports/\n/spec/examples.txt\n/test/tmp/\n/test/version_tmp/\n/tmp/\n\n# Used by dotenv library to load environment variables.\n# .env\n\n# Ignore Byebug command history file.\n.byebug_history\n\n## Specific to RubyMotion:\n.dat*\n.repl_history\nbuild/\n*.bridgesupport\nbuild-iPhoneOS/\nbuild-iPhone an get excessive in size\n/[Rr]ecordings/\n\n# Uncomment this line if you wish to ignore the asset store tools plugin\n# /[Aa]ssets/AssetStoreTools*\n\n# Autogenerated Jetbrains Rider plugin\n/[Aa]ssets/Plugins/Editor/JetBrains*\n# Jetbrains Rider personal-layer settings\n*.DotSettings.user\n\n# Visual Studio cache directory\n.vs/\n\n# Gradle cache directory\n.gradle/\n\n# Autogenerated VS/MD/Consulo solution and project files\nExportedObj/\n.consulo/\n*.csproj\n*.unityproj\n*.sln\n*.slnx\n*.suo\n*.tmp\n*.user\n*.userprefs\n*.pidb\n*.booproj\n*.svd\n*.pdb\n*.mdb\n*.opendb\n*.VC.db\n\n# Unity3D generated meta files\n*.pidb.meta\n*.pdb.meta\n*.mdb.meta\n\n# Unity3D generated file on crash reports\nsysinfo.txt\n\n# Mono auto generated files\n.dirstamp\nmono_crash.*\ntmpinst-dir.stamp\n\n# Builds\n/*_BackUpThisFolder_ButDontShipItWithYourGame/\n/*_BurstDebugInformation_DoNotShip/\n*.apk\n*.aab\n*.obb\n*.unitypackage\n*.unitypackage.meta\n*.app\n\n# Crashlytics generated file\ncrashlytics-build.properties\n\n# Blender generated backup files\n/[Aa]ssets/**/*.blend1\n/[Aa]ssets/**/*.blend1.meta\n\n# TouchDesigner generated cache files\n/[Aa]ssets/**/TDImportCache/\n/[Aa]ssets/**/TDImportCache.meta\n\n# Unity Crash Recovery generated files\n/[Aa]ssets/_Recovery/\n/[Aa]ssets/_Recovery.meta\n\n# Addressables default ignores, before user customizations\n# By default, Addressables content builds will generate addressables_content_state.bin\n# files in platform-specific subfolders, for example:\n# /Assets/AddressableAssetsData/OSX/addressables_content_state.bin\n/[Aa]ssets/AddressableAssetsData/*/addressables_content_state.bin\n/[Aa]ssets/AddressableAssetsData/*/addressables_content_state.bin.meta\n/[Aa]ssets/AddressableAssetsData/link.xml\n/[Aa]ssets/AddressableAssetsData/link.xml.meta\n/[Aa]ssets/Addressables_Temp/\n/[Aa]ssets/Addressables_Temp.meta\n/[Aa]ssets/StreamingAssets/aa/\n/[Aa]ssets/StreamingAssets/aa.meta\n/ServerData/\n\n# EDM4U generated files\n/[Aa]ssets/GeneratedLocalRepo/\n/[Aa]ssets/GeneratedLocalRepo.meta\n\n# Android Gradle generated files\n/[Aa]ssets/Plugins/Android/**/*.gradle.backup*\n/[Aa]ssets/Plugins/Android/**/local.properties\n\n# Test Framework generated files\n/[Aa]ssets/Resources/PerformanceTestRunInfo.json\n/[Aa]ssets/Resources/PerformanceTestRunInfo.json.meta\n/[Aa]ssets/Resources/PerformanceTestRunSettings.json\n/[Aa]ssets/Resources/PerformanceTestRunSettings.json.meta\n/[Aa]ssets/InitTestScene*.unity\n/[Aa]ssets/InitTestScene*.unity.meta\n\n# Visual Scripting auto-generated files\n/[Aa]ssets/Unity.VisualScripting.Generated/VisualScripting.Core/Property Providers/\n/[Aa]ssets/Unity.VisualScripting.Generated/VisualScripting.Core/Property Providers.meta\n/[Aa]ssets/Unity.VisualScripting.Generated/VisualScripting.Flow/UnitOptions.db\n/[Aa]ssets/Unity.VisualScripting.Generated/VisualScripting.Flow/UnitOptions.db.meta\n\n# UI Toolkit auto generated files\n/UIElementsSchema/\n\n# Auto-generated cache in Assets folder\n/[Aa]ssets/[Ss]ceneDependencyCache*\n"},{"id":"UnrealEngine","group":"Language & framework","body":"# Visual Studio 2015 user specific files\n.vs/\n\n# Compiled Object files\n*.slo\n*.lo\n*.o\n*.obj\n\n# Precompiled Headers\n*.gch\n*.pch\n\n# Compiled Dynamic libraries\n*.so\n*.dylib\n*.dll\n\n# Fortran module files\n*.mod\n\n# Compiled Static libraries\n*.lai\n*.la\n*.a\n*.lib\n\n# Executables\n*.exe\n*.out\n*.app\n*.ipa\n\n# These project files can be generated by the engine\n*.xcodeproj\n*.xcworkspace\n*.sln\n*.suo\n*.opensdf\n*.sdf\n*.VC.db\n*.VC.opendb\n.vsconfig\n\n# Precompiled Assets\nSourceArt/**/*.png\nSourceArt/**/*.tga\n\n# Binary Files\nBinaries/*\nPlugins/**/Binaries/*\n\n# Builds\nBuild/*\n\n# Whitelist PakBlacklist-<BuildConfiguration>.txt files\n!Build/*/\nBuild/*/**\n!Build/*/PakBlacklist*.txt\n\n# Don't ignore icon files in Build\n!Build/**/*.ico\n\n# Built data for maps\n*_BuiltData.uasset\n\n# Configuration files generated by the Editor\nSaved/*\n\n# Compiled source files for l using negated pattern\n# !example_override.tf\n\n# Include tfplan files to ignore the plan output of command: terraform plan -out=tfplan\n# example: *tfplan*\n\n# Ignore CLI configuration files\n.terraformrc\nterraform.rc\n\n# Optional: ignore graph output files generated by `terraform graph`\n# *.dot\n\n# Optional: ignore plan files saved before destroying Terraform configuration\n# Uncomment the line below if you want to ignore planout files.\n# planout\n"},{"id":"TeX","group":"Language & framework","body":"## Core latex/pdflatex auxiliary files:\n*.aux\n*.lof\n*.log\n*.lot\n*.fls\n*.out\n*.toc\n*.fmt\n*.fot\n*.cb\n*.cb2\n.*.lb\n\n## Intermediate documents:\n*.dvi\n*.xdv\n*-converted-to.*\n# these rules might exclude image files for figures etc.\n# *.ps\n# *.eps\n# *.pdf\n\n## Generated if empty string is given at \"Please type another file name for output:\"\n.pdf\n\n## Bibliography auxiliary files (bibtex/biblatex/biber):\n*.bbl\n*.bbl-SAVE-ERROR\n*.bcf\n*.bcf-SAVE-ERROR\n*.blg\n*-blx.aux\n*-blx.bib\n*.run.xml\n\n## Build tool auxiliary files:\n*.fdb_latexmk\n*.synctex\n*.synctex(busy)\n*.synctex.gz\n*.synctex.gz(busy)\n*.pdfsync\n*.rubbercache\nrubber.cache\n\n## Build tool directories for auxiliary files\n# latexrun\nlatex.out/\n\n## Auxiliary and intermediate files from other packages:\n# algorithms\n*.alg\n*.loa\n\n# achemso\nacs-*.bib\n\n# amsthm\n*.thm\n\n# attachfile2\n*.atfi\n\n# beamer\n*.nav\n*.pre\n*.snm\n*.vrb\n\n# changes\n*.soc\n*.loc\n\n# comment\n*.cut\n\n# context\n*.tuc\n*.tui\n*.tuo\n\n# cprotect\n*.cpt\n\n# elsarticle (documentclass of Elsevier journals)\n*.spl\n\n# endnotes\n*.ent\n\n# fixme\n*.lox\n\n# feynmf/feynmp\n*.mf\n*.mp\n*.t[1-9]\n*.t[1-9][0-9]\n*.tfm\n\n#(r)(e)ledmac/(r)(e)ledpar\n*.end\n*.?end\n*.[1-9]\n*.[1-9][0-9]\n*.[1-9][0-9][0-9]\n*.[1-9]R\n*.[1-9][0-9]R\n*.[1-9][0-9][0-9]R\n*.eledsec[1-9]\n*.eledsec[1-9]R\n*.eledsec[1-9][0-9]\n*.eledsec[1-9][0-9]R\n*.eledsec[1-9][0-9][0-9]\n*.eledsec[1-9][0-9][0-9]R\n\n# glossaries\n*.acn\ id":"Julia","group":"Language & framework","body":"# Files generated by invoking Julia with --code-coverage\n*.jl.cov\n*.jl.*.cov\n\n# Files generated by invoking Julia with --track-allocation\n*.jl.mem\n*.jl.*.mem\n\n# System-specific files and directories generated by the BinaryProvider and BinDeps packages\n# They contain absolute paths specific to the host computer, and so should not be committed\ndeps/deps.jl\ndeps/build.log\ndeps/downloads/\ndeps/usr/\ndeps/src/\n\n# Build artifacts for creating documentation generated by the Documenter package\ndocs/build/\ndocs/site/\n\n# File generated by Pkg, the package manager, based on a corresponding Project.toml\n# It records a fixed state of all packages used by the project. As such, it should not be\n# committed for packages, but should be committed for applications that require a static\n# environment.\nManifest*.toml\n\n# File generated by the Preferences package to store local preferences\nLocalPreferences.toml\nJuliaLocalPreferences.toml\n\n# Conda environment and metadata created in the project directory by the CondaPkg package\n.CondaPkg/\n"},{"id":"Gradle","group":"Language & framework","body":".gradle\n**/build/\n!**/src/**/build/\n\n# Ignore Gradle GUI config\ngradle-app.setting\n\n# Avoid ignoring Gradle wrapper jar file (.jar files are usually ignored)\n!gradle-wrapper.jar\n\n# Avoid ignore Gradle wrapper properties\n!gradle-wrapper.properties\n\n# Cache of project\n.gradletasknamecache\n\n# Eclipse Gradle plugin generated files\n# Eclipse Core\n.project\n# JDT-specific (Eclipse Java Development Tools)\n.classpath\n"},{"id":"Maven","group":"Language & framework","body":"target/\npom.xml.tag\npom.xml.releaseBackup\npom.xml.versionsBackup\npom.xml.next\nrelease.properties\ndependency-reduced-pom.xml\nbuildNumber.properties\n.mvn/timing.properties\n# https://maven.apache.org/tools/wrapper/#Usage_with_or_without_Binary_JAR\n.mvn/wrapper/maven-wrapper.jar\n\n# Eclipse m2e generated files\n# Eclipse Core\n.project\n# JDT-specific (Eclipse Java Development Tools)\n.classpath\n"},{"id":"Jekyll","group":"Language & framework","body":"_site/\n.sass-cache/\n.jekyll-cache/\n.jekyll-metadata\n# Ignore folders generated by Bundler\n.bundle/\nvendor/\n"},{"id":"Zig","group":"Language & framework","body":".zig-cache/\nzig-out/\nzig-pkg/\n*.o\n"},{"id":"Nim","group":"Language & framework","body":"nimcache/\nnimblecache/\nhtmldocs/\n"},{"id":"VisualStudio","group":"Language & framework","body":"## Ignore Visual Studio temporary files, build results, and\n## files generated by popular Visual Studio add-ons.\n##\n## Get latest from https://github.com/github/gitignore/blob/main/VisualStudio.gitignore\n\n# User-specific files\n*.rsuser\n*.suo\n*.user\n*.userosscache\n*.sln.docstates\n*.env\n\n# User-specific files (MonoDevelop/Xamarin Studio)\n*.userprefs\n\n# Mono auto generated files\nmono_crash.*\n\n# Build results\n[Dd]ebug/\n[Dd]ebugPublic/\n[Rr]elease/\n[Rr]eleases/\n\n[Dd]ebug/x64/\n[Dd]ebugPublic/x64/\n[Rr]elease/x64/\n[Rr]eleases/x64/\nbin/x64/\nobj/x64/\n\n[Dd]ebug/x86/\n[Dd]ebugPublic/x86/\n[Rr]elease/x86/\n[Rr]eleases/x86/\nbin/x86/\nobj/x86/\n\n[Ww][Ii][Nn]32/\n[Aa][Rr][Mm]/\n[Aa][Rr][Mm]64/\n[Aa][Rr][Mm]64[Ee][Cc]/\nbld/\n[Oo]bj/\n[Oo]ut/\n[Ll]og/\n[Ll]ogs/\n\n# Build results on 'Bin' directories\n**/[Bb]in/*\n# Uncomment if you have tasks that rely on *.refresh files to move binaries\n# (https://github.com/github/gitignore/pull/3736)\n#!**/[Bb]in/*.refresh\n\n# Visual Studio 2015/2017 cache/options directory\n.vs/\n# Uncomment if you have tasks that create the project's static files in wwwroot\n#wwwroot/\n\n# Visual Studio 2017 auto generated files\nGenerated\\ Files/\n\n# MSTest test Results\n[Tt]est[Rr]esult*/\n[Bb]uild[Ll]og.*\n*.trx\n\n# NUnit\n*.VisualState.xml\nTestResult.xml\nnunit-*.xml\n\n# Approval Tests result files\n*.received.*\n\n# Build Results of an ATL Project\n[Dd]ebugPS/\n[Rr]eleasePS/\ndlldata.c\n\n# Benchmark Results\nBenchmarkDotNet.Artifacts/\n\n# .NET Core\nproject.lock.json\nproject.fragment.lock.json\nartifacts/\n.artifacts/\n\n# ASP.NET Scaffolding\nScaffoldingReadMe.txt\n\n# StyleCop\nStyleCopReport.xml\n\n# Files built by Visual Studio\n*_i.c\n*_p.c\n*_h.h\n*_i.h\n*.ilk\n*.meta\n*.obj\n*.idb\n*.iobj\n*.pch\n*.pdb\n*.ipdb\n*.pgc\n*.pgd\n*.rsp\n# but not Directory.Build.rsp, as it configures directory-level build defaults\n!Directory.Build.rsp\n*.sbr\n*.tlb\n*.tli\n*.tlh\n*.tmp\n*.tmp_proj\n*_wpftmp.csproj\n*.log\n*.tlog\n*.vspscc\n*.vssscc\n.builds\n*.pidb\n*.svclog\n*.scc\n\n# Chutzpah Test files\n_Chutzpah*\n\n# Visual C++ cache files\nipch/\n*.aps\n*.ncb\n*.opendb\n*.opensdf\n*.sdf\n*.cachefile\n*.VC.db\n*.VC.VC.opendb\n\n# Visual Studio profiler\n*.psess\n*.vsp\n*.vspx\n*.sap\n\n# Visual Studio Trace Files\n*.e2e\n\n# TFS 2012 Local Workspace\n$tf/\n\n# Guidance Automation Toolkit\n*.gpState\n\n# ReSharper is a .NET coding add-in\n_ReSharper*/\n*.[Rr]e[Ss]harper\n*.DotSettings.user\n\n# TeamCity is a build add-in\n_TeamCity*\n\n# DotCover is a Code Coverage Tool\n*.dotCover\n\n# AxoCover is a Code Coverage Tool\n.axoCover/*\n!.axoCover/settings.json\n\n# Coverlet is a free, cross platform Code Coverage Tool\ncoverage*.json\ncoverage*.xml\ncoverage*.info\n\n# Visual Studio code coverage results\n*.coverage\n*.coveragexml\n\n# NCrunch\n_NCrunch_*\n.NCrunch_*\n.*crunch*.local.xml\nnCrunchTemp_*\n\n# MightyMoose\n*.mm.*\nAutoTest.Net/\n\n# Web workbench (sass)\n.sass-cache/\n\n# Installshield output folder\n[Ee]xpress/\n\n# DocProject is a documentation generator add-in\nDocProject/buildhelp/\nDocProject/Help/*.HxT\nDocProject/Help/*.HxC\nDocProject/Help/*.hhc\nDocProject/Help/*.hhk\nDocProject/Help/*.hhp\nDocProject/Help/Html2\nDocProject/Help/html\n\n# Click-Once directory\npublish/\n\n# Publish Web Output\n*.[Pp]ublish.xml\n*.azurePubxml\n# Note: Comment the next line if you want to checkin your web deploy settings,\n# but database connection strings (with potential passwords) will be unencrypted\n*.pubxml\n*.publishproj\n\n# Microsoft Azure Web App publish settings. Comment the next line if you want to\n# checkin your Azure Web App publish settings, but sensitive information contained\n# in these scripts will be unencrypted\nPublishScripts/\n\n# NuGet Packages\n*.nupkg\n# NuGet Symbol Packages\n*.snupkg\n# The packages folder can be ignored because of Package Restore\n**/[Pp]ackages/*\n# except build/, which is used as an MSBuild target.\n!**/[Pp]ackages/build/\n# Uncomment if necessary however generally it will be regenerated when needed\n#!**/[Pp]ackages/repositories.config\n# NuGet v3's project.json files produces more ignorable files\n*.nuget.props\n*.nuget.targets\n\n# Microsoft Azure Build Output\ncsx/\n*.build.csdef\n\n# Microsoft Azure Emulator\necf/\nrcf/\n\n# Windows Store app package directories and files\nAppPackages/\nBundleArtifacts/\nPackage.StoreAssociation.xml\n_pkginfo.txt\n*.appx\n*.appxbundle\n*.appxupload\n\n# Visual Studio cache files\n# files ending in .cache can be ignored\n*.[Cc]ache\n# but keep track of directories ending in .cache\n!?*.[Cc]ache/\n\n# Others\nClientBin/\n~$*\n*~\n*.dbmdl\n*.dbproj.schemaview\n*.jfm\n*.pfx\n*.publishsettings\norleans.codegen.cs\n\n# Since there are multiple workflows, uncomment next line to ignore bower_components\n# (https://github.com/github/gitignore/pull/1529#issuecomment-104372622)\n#bower_components/\n\n# RIA/Silverlight projects\nGenerated_Code/\n\n# Backup & report files from converting an old project file\n# to a newer Visual Studio version. Backup files are not needed,\n# because we have git ;-)\n_UpgradeReport_Files/\nBackup*/\nUpgradeLog*.XML\nUpgradeLog*.htm\nServiceFabricBackup/\n*.rptproj.bak\n\n# SQL Server files\n*.mdf\n*.ldf\n*.ndf\n\n# Business Intelligence projects\n*.rdl.data\n*.bim.layout\n*.bim_*.settings\n*.rptproj.rsuser\n*- [Bb]ackup.rdl\n*- [Bb]ackup ([0-9]).rdl\n*- [Bb]ackup ([0-9][0-9]).rdl\n\n# Microsoft Fakes\nFakesAssemblies/\n\n# GhostDoc plugin setting file\n*.GhostDoc.xml\n\n# Node.js Tools for Visual Studio\n.ntvs_analysis.dat\nnode_modules/\n\n# Visual Studio 6 build log\n*.plg\n\n# Visual Studio 6 workspace options file\n*.opt\n\n# Visual Studio 6 auto-generated workspace file (contains which files were open etc.)\n*.vbw\n\n# Visual Studio 6 workspace and project file (working project files containing files to include in project)\n*.dsw\n*.dsp\n\n# Visual Studio 6 technical files\n*.ncb\n*.aps\n\n# Visual Studio LightSwitch build output\n**/*.HTMLClient/GeneratedArtifacts\n**/*.DesktopClient/GeneratedArtifacts\n**/*.DesktopClient/ModelManifest.xml\n**/*.Server/GeneratedArtifacts\n**/*.Server/ModelManifest.xml\n_Pvt_Extensions\n\n# Paket dependency manager\n**/.paket/paket.exe\npaket-files/\n\n# FAKE - F# Make\n**/.fake/\n\n# CodeRush personal settings\n**/.cr/personal\n\n# Python Tools for Visual Studio (PTVS)\n**/__pycache__/\n*.pyc\n\n# Cake - Uncomment if you are using it\n#tools/**\n#!tools/packages.config\n\n# Tabs Studio\n*.tss\n\n# Telerik's JustMock configuration file\n*.jmconfig\n\n# BizTalk build output\n*.btp.cs\n*.btm.cs\n*.odx.cs\n*.xsd.cs\n\n# OpenCover UI analysis results\nOpenCover/\n\n# Azure Stream Analytics local run output\nASALocalRun/\n\n# MSBuild Binary and Structured Log\n*.binlog\nMSBuild_Logs/\n\n# AWS SAM Build and Temporary Artifacts folder\n.aws-sam\n\n# NVidia Nsight GPU debugger configuration file\n*.nvuser\n\n# MFractors (Xamarin productivity tool) working folder\n**/.mfractor/\n\n# Local History for Visual Studio\n**/.localhistory/\n\n# Visual Studio History (VSHistory) files\n.vshistory/\n\n# BeatPulse healthcheck temp database\nhealthchecksdb\n\n# Backup folder for Package Reference Convert tool in Visual Studio 2017\nMigrationBackup/\n\n# Ionide (cross platform F# VS Code tools) working folder\n**/.ionide/\n\n# Fody - auto-generated XML schema\nFodyWeavers.xsd\n\n# VS Code files for those working on multiple tools\n.vscode/*\n!.vscode/settings.json\n!.vscode/tasks.json\n!.vscode/launch.json\n!.vscode/extensions.json\n!.vscode/*.code-snippets\n\n# Local History for Visual Studio Code\n.history/\n\n# Built Visual Studio Code Extensions\n*.vsix\n\n# Windows Installer files from build outputs\n*.cab\n*.msi\n*.msix\n*.msm\n*.msp\n\n# Official VS Code C# Dev Kit Extension exclusion\n#*.lscache\n"},{"id":"Angular","group":"Language & framework","body":"# Angular specific\n/dist/\n/out-tsc/\n/tmp/\n/coverage/\n/e2e/test-output/\n/.angular/\n.angular/\n\n# Node modules and dependency files\n/node_modules/\n/package-lock.json\n/yarn.lock\n\n# Environment files\n/.env\n\n# Angular CLI and build artefacts\n/.angular-cli.json\n/.ng/\n\n# TypeScript cache\n*.tsbuildinfo\n\n# Logs\nnpm-debug.log*\nyarn-debug.log*\nyarn-error.log*\n"},{"id":"Symfony","group":"Language & framework","body":"# Cache and logs (Symfony2)\n/app/cache/*\n/app/logs/*\n!app/cache/.gitkeep\n!app/logs/.gitkeep\n\n# Email spool folder\n/app/spool/*\n\n# Cache, session files and logs (Symfony3)\n/var/cache/*\n/var/logs/*\n/var/sessions/*\n!var/cache/.gitkeep\n!var/logs/.gitkeep\n!var/sessions/.gitkeep\n\n# Logs (Symfony4)\n/var/log/*\n!var/log/.gitkeep\n\n# Parameters\n/app/config/parameters.yml\n/app/config/parameters.ini\n\n# Managed by Composer\n/app/bootstrap.php.cache\n/var/bootstrap.php.cache\n/bin/*\n!bin/console\n!bin/symfony_requirements\n/vendor/\n\n# Assets and user uploads\n/web/bundles/\n/web/uploads/\n\n# PHPUnit\n/app/phpunit.xml\n/phpunit.xml\n\n# Build data\n/build/\n\n# Composer PHAR\n/composer.phar\n\n# Backup entities generated with doctrine:generate:entities command\n**/Entity/*~\n\n# Embedded web-server pid file\n/.web-server-pid\n"},{"id":"Yii","group":"Language & framework","body":"assets/*\n!assets/.gitignore\nprotected/runtime/*\n!protected/runtime/.gitignore\nprotected/data/*.db\nthemes/classic/views/\n"},{"id":"Objective-C","group":"Language & framework","body":"# Xcode\n#\n# gitignore contributors: remember to update Global/Xcode.gitignore, Objective-C.gitignore & Swift.gitignore\n\n## User settings\nxcuserdata/\n\n## Obj-C/Swift specific\n*.hmap\n\n## App packaging\n*.ipa\n*.dSYM.zip\n*.dSYM\n\n# CocoaPods\n#\n# We recommend against adding the Pods directory to your .gitignore. However\n# you should judge for yourself, the pros and cons are mentioned at:\n# https://guides.cocoapods.org/using/using-cocoapods.html#should-i-check-the-pods-directory-into-source-control\n#\n# Pods/\n#\n# Add this line if you want to avoid checking in source code from the Xcode workspace\n# *.xcworkspace\n\n# Carthage\n#\n# Add this line if you want to avoid checking in source code from Carthage dependencies.\n# Carthage/Checkouts\n\nCarthage/Build/\n\n# fastlane\n#\n# It is recommended to not store the screenshots in the git repo.\n# Instead, use fastlane to re-generate the screenshots whenever they are needed.\n# For more information about the recommended setup visit:\n# https://docs.fastlane.tools/best-practices/source-control/#source-control\n\nfastlane/report.xml\nfastlane/Preview.html\nfastlane/screenshots/**/*.png\nfastlane/test_output\n"},{"id":"Erlang","group":"Language & framework","body":".eunit\n*.o\n*.beam\n*.plt\nerl_crash.dump\n.concrete/DEV_MODE\n\n# rebar 2.x\n.rebar\nrel/example_project\nebin/*.beam\ndeps\n\n# rebar 3\n.rebar3\n_build/\n_checkouts/\n"},{"id":"OCaml","group":"Language & framework","body":"*.annot\n*.cmo\n*.cma\n*.cmi\n*.a\n*.o\n*.cmx\n*.cmxs\n*.cmxa\n\n# Files containing detailed information about the compilation (generated\n# by `ocamlc`/`ocamlopt` when invoked using the option `-bin-annot`).\n# These files are typically useful for code inspection tools\n# (e.g. Merlin).\n*.cmt\n*.cmti\n\n# ocamlbuild and Dune default working directory\n_build/\n\n# ocamlbuild targets\n*.byte\n*.native\n\n# oasis generated files\nsetup.data\nsetup.log\n\n# Merlin configuring file for Vim and Emacs\n.merlin\n\n# Dune generated files\n*.install\n\n# Local OPAM switch\n_opam/\n"},{"id":"Clojure","group":"Language & framework","body":"pom.xml\npom.xml.asc\n*.jar\n*.class\n/lib/\n/classes/\n/target/\n/checkouts/\n.lein-deps-sum\n.lein-repl-history\n.lein-plugins/\n.lein-failures\n.nrepl-port\n.cpcache/\n"},{"id":"Qt","group":"Language & framework","body":"# C++ objects and libs\n*.slo\n*.lo\n*.o\n*.a\n*.la\n*.lai\n*.so\n*.so.*\n*.dll\n*.dylib\n\n# Qt-es\nobject_script.*.Release\nobject_script.*.Debug\n*_plugin_import.cpp\n/.qmake.cache\n/.qmake.stash\n*.pro.user\n*.pro.user.*\n*.qbs.user\n*.qbs.user.*\n*.moc\nmoc_*.cpp\nmoc_*.h\nqrc_*.cpp\nui_*.h\n*.qmlc\n*.jsc\nMakefile*\n*build-*\nbuild/\n*.qm\n*.prl\n*.qmlls.ini\n\n# Qt unit tests\ntarget_wrapper.*\n\n# QtCreator\n*.autosave\n\n# QtCreator Qml\n*.qmlproject.user\n*.qmlproject.user.*\n\n# QtCreator CMake\nCMakeLists.txt.user*\n\n# QtCreator 4.8< compilation database\ncompile_commands.json\n\n# QtCreator local machine specific files for imported projects\n*creator.user*\n\n*_qmlcache.qrc\n"},{"id":"Delphi","group":"Language & framework","body":"# Uncomment these types if you want even more clean repository. But be careful.\n# It can make harm to an existing project source. Read explanations below.\n#\n# Resource files are binaries containing manifest, project icon and version info.\n# They can not be viewed as text or compared by diff-tools. Consider replacing them with .rc files.\n#*.res\n#\n# Type library file (binary). In old Delphi versions it should be stored.\n# Since Delphi 2009 it is produced from .ridl file and can safely be ignored.\n#*.tlb\n#\n# Diagram Portfolio file. Used by the diagram editor up to Delphi 7.\n# Uncomment this if you are not using diagrams or use newer Delphi version.\n#*.ddp\n#\n# Visual LiveBindings file. Added in Delphi XE2.\n# Uncomment this if you are not using LiveBindings Designer.\n#*.vlb\n#\n# Deployment Manager configuration file for your project. Added in Delphi XE2.\n# Uncomment this if it is not mobile development and you do not use remote debug feature.\n#*.deployproj\n#\n# C++ object files produced when C/C++ Output file generation is configured.\n# Uncomment this if you are not using external objects (zlib library for example).\n#*.obj\n#\n\n# Default Delphi compiler directories\n# Content of this directories are generated with each Compile/Construct of a project.\n# Most of the time, files here have not there place in a code repository.\n#Win32/\n#Win64/\n#OSX64/\n#OSXARM64/\n#Android/\n#Android64/\n#iOSDevice64/\n#Linux64/\n\n# Delphi compiler-generated binaries (safe to delete)\n*.exe\n*.dll\n*.bpl\n*.bpi\n*.dcp\n*.so\n*.apk\n*.drc\n*.map\n*.dres\n*.rsm\n*.tds\n*.dcu\n*.lib\n*.a\n*.o\n*.ocx\n\n# Delphi autogenerated files (duplicated info)\n*.cfg\n*.hpp\n*Resource.rc\n\n# Delphi local files (user-specific info)\n*.local\n*.identcache\n*.projdata\n*.tvsconfig\n*.dsk\n*.dsv\n\n# Delphi history and backups\n__history/\n__recovery/\n*.~*\n\n# Castalia statistics file (since XE7 Castalia is distributed with Delphi)\n*.stat\n"},{"id":"Packer","group":"Language & framework","body":"# Cache objects\npacker_cache/\n\n# Crash log\ncrash.log\n\n# https://www.packer.io/guides/hcl/variables\n# Exclude all .pkrvars.hcl files, which are likely to contain sensitive data,\n# such as password, private keys, and other secrets. These should not be part of\n# version control as they are data points which are potentially sensitive and\n# subject to change depending on the environment.\n#\n*.pkrvars.hcl\n\n# For built boxes\n*.box\n"},{"id":"macOS","group":"Editor, OS & tools","body":"# General\n.DS_Store\n.localized\n__MACOSX/\n.AppleDouble\n.LSOverride\nIcon[\n]\n\n# Resource forks\n._*\n\n# Files and directories that might appear in the root of a volume\n.DocumentRevisions-V100\n.fseventsd\n.Spotlight-V100\n.TemporaryItems\n.Trashes\n.VolumeIcon.icns\n.com.apple.timemachine.donotpresent\n.com.apple.timemachine.supported\n.PKInstallSandboxManager\n.PKInstallSandboxManager-SystemSoftware\n.hotfiles.btree\n.vol\n.file\n.disk_label*\nlost+found\n.HFS+ Private Directory Data[\n]\n\n# Directories potentially created on remote AFP share\n.AppleDB\n.AppleDesktop\nNetwork Trash Folder\nTemporary Items\n.apdisk\n\n# Mac OS 6 to 9\nDesktop DB\nDesktop DF\nTheFindByContentFolder\nTheVolumeSettingsFolder\n.FBCIndex\n.FBCSemaphoreFile\n.FBCLockFolder\n\n# Quota system\n.quota.group\n.quota.user\n.quota.ops.group\n.quota.ops.user\n\n# TimeMachine\nBackups.backupdb\n.MobileBackups\n.MobileBackups.trash\nMobileBackups.trash\ntmbootpicker.efi\n"},{"id":"Windows","group":"Editor, OS & tools","body":"# Windows thumbnail cache files\nThumbs.db\nThumbs.db:encryptable\nehthumbs.db\nehthumbs_vista.db\n\n# Dump file\n*.stackdump\n\n# Folder config file\n[Dd]esktop.ini\n\n# Recycle Bin used on file shares\n$RECYCLE.BIN/\n\n# Windows Installer files\n*.cab\n*.msi\n*.msix\n*.msm\n*.msp\n\n# Windows shortcuts\n*.lnk\n"},{"id":"Linux","group":"Editor, OS & tools","body":"*~\n\n# temporary files which can be created if a process still has a handle open of a deleted file\n.fuse_hidden*\n\n# Metadata left by Dolphin file manager, which comes with KDE Plasma\n.directory\n\n# Linux trash folder which might appear on any partition or disk\n.Trash-*\n\n# .nfs files are created when an open file is removed but is still being accessed\n.nfs*\n\n# Log files created by default by the nohup command\nnohup.out\n"},{"id":"VisualStudioCode","group":"Editor, OS & tools","body":"# Visual Studio Code\n.vscode/*\n!.vscode/settings.json\n!.vscode/tasks.json\n!.vscode/launch.json\n!.vscode/extensions.json\n!.vscode/*.code-snippets\n!*.code-workspace\n\n# Built Visual Studio Code Extensions\n*.vsix\n"},{"id":"JetBrains","group":"Editor, OS & tools","body":"# Covers JetBrains IDEs: IntelliJ, GoLand, RubyMine, PhpStorm, AppCode, PyCharm, CLion, Android Studio, WebStorm and Rider\n# Reference: https://intellij-support.jetbrains.com/hc/en-us/articles/206544839\n\n# User-specific stuff\n.idea/**/workspace.xml\n.idea/**/tasks.xml\n.idea/**/usage.statistics.xml\n.idea/**/dictionaries\n.idea/**/shelf\n\n# AWS User-specific\n.idea/**/aws.xml\n\n# Generated files\n.idea/**/contentModel.xml\n\n# Sensitive or high-churn files\n.idea/**/dataSources/\n.idea/**/dataSources.ids\n.idea/**/dataSources.local.xml\n.idea/**/sqlDataSources.xml\n.idea/**/dynamic.xml\n.idea/**/uiDesigner.xml\n.idea/**/dbnavigator.xml\n\n# Gradle\n.idea/**/gradle.xml\n.idea/**/libraries\n\n# Gradle and Maven with auto-import\n# When using Gradle or Maven with auto-import, you should exclude module files,\n# since they will be recreated, and may cause churn.  Uncomment if using\n# auto-import.\n# .idea/artifacts\n# .idea/compiler.xml\n# .idea/jarRepositories.xml\n# .idea/modules.xml\n# .idea/*.iml\n# .idea/modules\n# *.iml\n# *.ipr\n\n# CMake\ncmake-build-*/\n\n# Mongo Explorer plugin\n.idea/**/mongoSettings.xml\n\n# File-based project format\n*.iws\n\n# IntelliJ\nout/\n\n# mpeltonen/sbt-idea plugin\n.idea_modules/\n\n# JIRA plugin\natlassian-ide-plugin.xml\n\n# Cursive Clojure plugin\n.idea/replstate.xml\n\n# SonarLint plugin\n.idea/sonarlint/\n# see https://community.sonarsource.com/t/is-the-file-idea-idea-idea-sonarlint-xml-intended-to-be-under-source-control/121119\n.idea/sonarlint.xml\n\n# Crashlytics plugin (for Android Studio and IntelliJ)\ncom_crashlytics_export_strings.xml\ncrashlytics.properties\ncrashlytics-build.properties\nfabric.properties\n\n# Editor-based HTTP Client\n.idea/httpRequests\nhttp-client.private.env.json\n\n# Android studio 3.1+ serialized cache file\n.idea/caches/build_file_checksums.ser\n\n# Apifox Helper cache\n.idea/.cache/.Apifox_Helper\n.idea/ApifoxUploaderProjectSetting.xml\n\n# Github Copilot persisted session migrations, see: https://github.com/microsoft/copilot-intellij-feedback/issues/712#issuecomment-3322062215\n.idea/**/copilot.data.migration.*.xml\n\n# Kubernetes Plugin\n.idea/kubernetes/configs/kubeconfig_*\n"},{"id":"Vim","group":"Editor, OS & tools","body":"# Swap\n[._]*.s[a-v][a-z]\n# comment out the next line if you don't need vector files\n!*.svg\n[. onfigurations\"\n*.launch\n\n# PyDev specific (Python IDE for Eclipse)\n*.pydevproject\n\n# CDT-specific (C/C++ Development Tooling)\n.cproject\n\n# CDT- autotools\n.autotools\n\n# Java annotation processor (APT)\n.factorypath\n\n# PDT-specific (PHP Development Tools)\n.buildpath\n\n# sbteclipse plugin\n.target\n\n# Tern plugin\n.tern-project\n\n# TeXlipse plugin\n.texlipse\n\n# STS (Spring Tool Suite)\n.springBeans\n\n# Code Recommenders\n.recommenders/\n\n# Annotation Processing\n.apt_generated/\n.apt_generated_tests/\n\n# Scala IDE specific (Scala & Java development for Eclipse)\n.cache-main\n.scala_dependencies\n.worksheet\n\n# Uncomment this line if you wish to ignore the project description file.\n# Typically, this file would be tracked if it contains build/dependency configurations:\n#.project\n"},{"id":"NetBeans","group":"Editor, OS & tools","body":"**/nbproject/private/\n**/nbproject/Makefile-*.mk\n**/nbproject/Package-*.bash\nbuild/\nnbbuild/\ndist/\nnbdist/\n.nb-gradle/\n"},{"id":"Xcode","group":"Editor, OS & tools","body":"## User settings\nxcuserdata/\n"},{"id":"Dropbox","group":"Editor, OS & tools","body":"# Dropbox settings and caches\n.dropbox\n.dropbox.attr\n.dropbox.cache\n"},{"id":"Archives","group":"Editor, OS & tools","body":"# It's better to unpack these files and commit the raw source because\n# git has its own built in compression methods.\n*.7z\n*.jar\n*.rar\n*.zip\n*.gz\n*.gzip\n*.tgz\n*.bzip\n*.bzip2\n*.bz2\n*.xz\n*.lzma\n*.cab\n*.xar\n*.zst\n*.tzst\n\n# Packing-only formats\n*.iso\n*.tar\n\n# Package management formats\n*.dmg\n*.xpi\n*.gem\n*.egg\n*.deb\n*.rpm\n*.msi\n*.msm\n*.msp\n*.txz\n"},{"id":"Images","group":"Editor, OS & tools","body":"# JPEG\n*.jpg\n*.jpeg\n*.jpe\n*.jif\n*.jfif\n*.jfi\n\n# JPEG 2000\n*.jp2\n*.j2k\n*.jpf\n*.jpx\n*.jpm\n*.mj2\n\n# JPEG XR\n*.jxr\n*.hdp\n*.wdp\n\n# Graphics Interchange Format\n*.gif\n\n# RAW\n*.raw\n\n# Web P\n*.webp\n\n# Portable Network Graphics\n*.png\n\n# Animated Portable Network Graphics\n*.apng\n\n# Multiple-image Network Graphics\n*.mng\n\n# Tagged Image File Format\n*.tiff\n*.tif\n\n# Scalable Vector Graphics\n*.svg\n*.svgz\n\n# Portable Document Format\n*.pdf\n\n# X BitMap\n*.xbm\n\n# BMP\n*.bmp\n*.dib\n\n# ICO\n*.ico\n\n# 3D Images\n*.3dm\n*.max\n"},{"id":"Backup","group":"Editor, OS & tools","body":"# Generic backup files\n*.bak\n*.back\n*.backup\n\n# Norton Ghost backup files\n*.gho\n\n# Generic original files\n*.ori\n*.orig\n*.original\n\n# Generic temporary files\n*.tmp\n*.temp\n*.temporary\n"},{"id":"Tags","group":"Editor, OS & tools","body":"# Ignore tags created by etags, ctags, gtags (GNU global) and cscope\nTAGS\n.TAGS\n!TAGS/\ntags\n.tags\n!tags/\ngtags.files\nGTAGS\nGRTAGS\nGPATH\nGSYMS\ncscope.files\ncscope.out\ncscope.in.out\ncscope.po.out\n"},{"id":"Patch","group":"Editor, OS & tools","body":"*.orig\n*.rej\n"},{"id":"VirtualEnv","group":"Editor, OS & tools","body":"# Virtualenv\n# https://realpython.com/python-virtual-environments-a-primer/#the-virtualenv-project\n.venv/\nvenv/\n.python-version\n\n# pyenv: Simple Python Version Management\npyvenv.cfg\n\n# pip: package installer for Python\npip-selfcheck.json\n\n# Custom python interpreter\n.Python\n[Bb]in\n[Ii]nclude\n[Ll]ib\n[Ll]ib64\n[Ll]ocal\n[Ss]cripts\n"}],"license":[{"id":"mit","name":"MIT License","spdx":"MIT","desc":"A short and simple permissive license with conditions only requiring preservation of copyright and license notices. Licensed works, modifications, and larger works may be distributed under different terms and without source code.","perm":["commercial-use","modifications","distribution","private-use"],"cond":["include-copyright"],"lim":["liability","warranty"],"body":"MIT License\n\nCopyright (c) [year] [fullname]\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the \"Software\"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, mod   const GI = DATA.gitignore, LI = DATA.license;
  const sel = new Set(store.get('sel', ['Node', 'macOS', 'VisualStudioCode']).filter(n => GI.some(g => g.id === n)));
  const PRETTY = { VisualStudioCode: 'VS Code', VisualStudio: 'Visual Studio', 'C++': 'C++', JetBrains: 'JetBrains', TeX: 'TeX', UnrealEngine: 'Unreal Engine', 'Objective-C': 'Objective-C', VirtualEnv: 'virtualenv' };
  const label = id => PRETTY[id] || id;
  const picks = $('#g-picks');

  function drawPicks() {
    const q = $('#g-q').value.trim().toLowerCase(); let html = '';
    for (const grp of ['Language & framework', 'Editor, OS & tools']) {
      const items = GI.filter(g => g.group === grp && (!q || g.id.toLowerCase().includes(q) || label(g.id).toLowerCase().includes(q)));
      if (!items.length) continue;
      html += '<div class="grp"><span class="lbl">' + esc(grp) + '</span><div class="picks">' + items.map(g =>
        '<label><input type="checkbox" value="' + esc(g.id) + '"' + (sel.has(g.id) ? ' checked' : '') + '>' + esc(label(g.id)) + '</label>').join('') + '</div></div>';
    }
    picks.innerHTML = html || '<p class="note">No templates match.</p>';
  }
  picks.addEventListener('change', e => { const c = e.target; if (c.type !== 'checkbox') return; c.checked ? sel.add(c.value) : sel.delete(c.value); store.set('sel', [...sel]); genGi(); });
  $('#g-q').addEventListener('input', drawPicks);
  $('#g-clear').addEventListener('click', () => { sel.clear(); store.set('sel', []); drawPicks(); genGi(); });
  ['g-extra', 'g-dedupe', 'g-heads'].forEach(id => $('#' + id).addEventListener('input', genGi));

  function genGi() {
    const dedupe = $('#g-dedupe').checked, heads = $('#g-heads').checked, seen = new Set(), parts = []; let skipped = 0;
    const add = (title, body) => {
      const keep = [];
      body.replace(/\r/g, '').split('\n').forEach(l => {
        const t = l.trim();
        if (dedupe && t && !t.startsWith('#')) { if (seen.has(t)) { skipped++; return; } seen.add(t); }
        keep.push(l.replace(/\s+$/, ''));
      });
      const txt = keep.join('\n').replace(/^\n+|\n+$/g, '').replace(/\n{3,}/g, '\n\n');
      if (!txt.replace(/#.*$/gm, '').trim()) return;
      parts.push((heads ? '### ' + title + ' ###\n' : '') + txt);
    };
    GI.filter(g => sel.has(g.id)).forEach(g => add(label(g.id), g.body));
    const extra = $('#g-extra').value; if (extra.trim()) add('Custom', extra);
    const out = parts.join('\n\n') + (parts.length ? '\n' : '');
    $('#g-out').value = out;
    const n = out.split('\n').filter(l => l.trim() && !l.trim().startsWith('#')).length;
    $('#g-stat').textContent = n + ' patterns' + (skipped ? ' · ' + skipped + ' duplicates skipped' : '');
    $('#g-dl').disabled = !out;
  }
  $('#g-dl').addEventListener('click', () => download('.gitignore', $('#g-out').value, 'application/octet-stream'));

  /* license */
  const ls = $('#l-sel');
  const order = LI.map(l => l.id);
  ls.innerHTML = LI.map(l => '<option value="' + esc(l.id) + '">' + esc(l.name) + '</option>').join('');
  ls.value = store.get('lic', 'mit'); if (!ls.value) ls.value = 'mit';
  $('#l-year').value = store.get('year', String(new Date().getFullYear()));
  $('#l-name').value = store.get('holder', ''); $('#l-mail').value = store.get('mail', '');
  const human = s => s.replace(/-/g, ' ').replace(/^./, c => c.toUpperCase()).replace('Include copyright', 'Include copyright').replace('Disclose source', 'Disclose source');
  const col = (t, a) => '<div><b>' + t + '</b>' + (a.length ? a.map(x => esc(human(x))).join('<br>') : '—') + '</div>';

  function genLi() {
    const l = LI.find(x => x.id === ls.value) || LI[0];
    const year = $('#l-year').value.trim() || String(new Date().getFullYear()), name = $('#l-name').value.trim(), mail = $('#l-mail').value.trim();
    const holder = name ? name + (mail ? ' <' + mail + '>' : '') : '';
    let used = false, miss = [];
    const rep = (re, v, what) => { l.__t = l.__t.replace(re, m => { if (v) { used = true; return v; } miss.push(what); return m; }); };
    l.__t = l.body.replace(/\s+$/, '') + '\n';
    rep(/\[year\]|\[yyyy\]|<year>/g, year, 'year');
    rep(/\[fullname\]|\[name of copyright owner\]|<name of author>/g, holder, 'copyright holder');
    l.__t = l.__t.replace(/\[email\]/g, m => mail || m);
    $('#l-out').value = l.__t;
    $('#l-desc').textContent = l.desc;
    $('#l-tags').innerHTML = col('Permissions', l.perm) + col('Conditions', l.cond) + col('Limitations', l.lim);
    const m = $('#l-msg');
    const hasHolderSlot = /\[year\]|\[yyyy\]|<year>|\[fullname\]|\[name of copyright owner\]|<name of author>/.test(l.body);
    if (!hasHolderSlot) { m.hidden = false; m.className = 'msg'; m.textContent = l.name + ' has no name or year to fill in. Copyright notices go in file headers or the README instead.'; }
    else if (!name) { m.hidden = false; m.className = 'msg warn'; m.textContent = 'Add the copyright holder to complete the text.'; }
    else m.hidden = true;
    const sp = /^(A?GPL|LGPL|GFDL)-\d/.test(l.spdx) && !/-(only|or-later)$/.test(l.spdx) ? l.spdx + '-only' : l.spdx;
    $('#l-spdx').value = 'SPDX-License-Identifier: ' + sp;
    $('#l-pkg').value = '"license": "' + sp + '"';
    store.set('lic', l.id); store.set('year', year); store.set('holder', name); store.set('mail', mail);
  }
  ['l-sel', 'l-name', 'l-year', 'l-mail'].forEach(id => $('#' + id).addEventListener('input', genLi));
  $('#l-dl').addEventListener('click', () => download('LICENSE', $('#l-out').value));
