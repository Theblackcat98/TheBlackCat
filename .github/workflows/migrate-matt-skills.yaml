name: Migrate Matt Pocock Skills

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclassify imported Matt Pocock skills
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          while IFS= read -r -d '' file; do
            if grep -q 'github.com/mattpocock/skills' "$file" && grep -q '^type: bookmark$' "$file"; then
              sed -i '0,/^type: bookmark$/s//type: skill/' "$file"
              git add "$file"
              changed=1
            fi
          done < <(find content/library/ai/skills -name index.md -print0)

          if [ "$changed" -eq 0 ]; then
            echo "No Matt Pocock skill records require migration."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reclassify imported Matt Pocock content as skills'
          git push
