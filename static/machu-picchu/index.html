function mb(a){return()=>{let t=(a+=0x6d2b79f5);t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

// Battered trapezoidal stone volume helper
function incaWallBox(x, y, z, w, h, d, opts = {}) {
  const b = opts.batter !== undefined ? opts.batter : 0.06;
  const pal = PAL[opts.pal || 'stone'];
  const edge = opts.edge || 'med';
  const courses = opts.courses !== undefined ? opts.courses : 3;
  const x0 = x, x1 = x + w, z0 = z, z1 = z + d;
  const tx0 = x + b, tx1 = x + w - b, tz0 = z + b, tz1 = z + d - b;
  const Y = y + h;
  // Sides shaded properly
  qn([x0, y, z1], [x1, y, z1], [tx1, Y, tz1], [tx0, Y, tz1], pal, [0, 0.1, 1]);
  qn([x1, y, z0], [x0, y, z0], [tx0, Y, tz0], [tx1, Y, tz0], pal, [0, 0.1, -1]);
  qn([x1, y, z1], [x1, y, z0], [tx1, Y, tz0], [tx1, Y, tz1], pal, [1, 0.1, 0]);
  qn([x0, y, z0], [x0, y, z1], [tx0, Y, tz1], [tx0, Y, tz0], pal, [-1, 0.1, 0]);
  if (opts.cap !== false) qn([tx0, Y, tz0], [tx0, Y, tz1], [tx1, Y, tz1], [tx1, Y, tz0], pal, [0, 1, 0]);
  const B = [[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]], T = [[tx0,Y,tz0],[tx1,Y,tz0],[tx1,Y,tz1],[tx0,Y,tz1]];
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    ln(B[i], B[j], edge, 0.01);
    ln(T[i], T[j], edge, 0.01);
    ln(B[i], T[i], edge, 0.01);
  }
  for (let c = 1; c < courses; c++) {
    const t = c / courses, yy = y + h * t;
    const cx0 = x0 + b * t, cx1 = x1 - b * t, cz0 = z0 + b * t, cz1 = z1 - b * t;
    ln([cx0, yy, cz1], [cx1, yy, cz1], 'fine', 0);
    ln([cx1, yy, cz1], [cx1, yy, cz0], 'fine', 0);
    ln([cx0, yy, cz0], [cx0, yy, cz1], 'fine', 0);
    ln([cx1, yy, cz0], [cx0, yy, cz0], 'fine', 0);
  }
}

// Recessed trapezoidal opening on a wall face (face: 'z+', 'z-', 'x+', 'x-')
function trapOpening(cx, y, cz, bw, tw, h, face, lintel = true) {
  const rec = 0.025;
  let b0, b1, t0, t1, l0, l1;
  if (face === 'z+' || face === 'z-') {
    const s = face === 'z+' ? 1 : -1;
    const zf = cz + s * rec;
    b0 = [cx - bw/2, y, zf]; b1 = [cx + bw/2, y, zf];
    t0 = [cx - tw/2, y + h, zf]; t1 = [cx + tw/2, y + h, zf];
    quad(b0, b1, t1, t0, 0x3b322b);
    l0 = [cx - tw*0.72, y + h + 0.06, zf + s*0.01]; l1 = [cx + tw*0.72, y + h + 0.06, zf + s*0.01];
  } else {
    const s = face === 'x+' ? 1 : -1;
    const xf = cx + s * rec;
    b0 = [xf, y, cz - bw/2]; b1 = [xf, y, cz + bw/2];
    t0 = [xf, y + h, cz - tw/2]; t1 = [xf, y + h, cz + tw/2];
    quad(b0, b1, t1, t0, 0x3b322b);
    l0 = [xf + s*0.01, y + h + 0.06, cz - tw*0.72]; l1 = [xf + s*0.01, y + h + 0.06, cz + tw*0.72];
  }
  ln(b0, t0, 'med', 0); ln(b1, t1, 'med', 0); ln(t0, t1, 'med', 0);
  if (lintel) ln(l0, l1, 'bold', 0.005);
}

// Detailed Inca Kancha hall: battered ashlar walls, trapezoidal door & side windows, gabled mud-mortar ends, layered ichu thatch roof
function kanchaHouse(x, z, w, d, h, rh, orientZ, y = P, opts = {}) {
  const b = 0.065;
  incaWallBox(x, y, z, w, h, d, { batter: b, pal: 'stone', edge: 'med', courses: 4, cap: false });
  const cx = x + w / 2, cz = z + d / 2;
  const frontFace = opts.doorFace || (orientZ ? 'x+' : 'z+');
  if (frontFace === 'z+' || frontFace === 'z-') {
    const fz = frontFace === 'z+' ? z + d - b*0.4 : z + b*0.4;
    const doors = opts.doors || 1;
    for (let i = 0; i < doors; i++) {
      const dx = doors === 1 ? cx : x + w * (0.30 + 0.40 * i);
      trapOpening(dx, y + 0.02, fz, 0.34, 0.24, h * 0.68, frontFace);
    }
    if (opts.windows) {
      trapOpening(x + b*0.4, y + h*0.36, cz, 0.22, 0.16, 0.28, 'x-');
      trapOpening(x + w - b*0.4, y + h*0.36, cz, 0.22, 0.16, 0.28, 'x+');
    }
  } else {
    const fx = frontFace === 'x+' ? x + w - b*0.4 : x + b*0.4;
    const doors = opts.doors || 1;
    for (let i = 0; i < doors; i++) {
      const dz = doors === 1 ? cz : z + d * (0.30 + 0.40 * i);
      trapOpening(fx, y + 0.02, dz, 0.34, 0.24, h * 0.68, frontFace);
    }
  }
  if (opts.open) return; // roofless ruin (wayrana / ceremonial enclosure)

  const Y = y + h, ov = 0.16;
  const a = (orientZ ? w - 2*b : d - 2*b) / 2 + ov;
  const l = (orientZ ? d - 2*b : w - 2*b) / 2 + ov;
  const m = orientZ ? (u, yy, v) => [cx + u, yy, cz + v] : (u, yy, v) => [cx + v, yy, cz + u];
  const n = orientZ ? (px, py, pz) => [px, py, pz] : (px, py, pz) => [pz, py, px];

  // Masonry end-gables (pignon walls) slightly inset inside overhang
  const gi = l - ov + 0.02, ga = a - ov;
  tn(m(-ga, Y, gi), m(ga, Y, gi), m(0, Y + rh - 0.04, gi), PAL.stone, n(0, 0, 1));
  tn(m(ga, Y, -gi), m(-ga, Y, -gi), m(0, Y + rh - 0.04, -gi), PAL.stone, n(0, 0, -1));
  ln(m(-ga, Y, gi), m(0, Y + rh - 0.04, gi), 'med', 0); ln(m(ga, Y, gi), m(0, Y + rh - 0.04, gi), 'med', 0);
  ln(m(-ga, Y, -gi), m(0, Y + rh - 0.04, -gi), 'med', 0); ln(m(ga, Y, -gi), m(0, Y + rh - 0.04, -gi), 'med', 0);

  // Thick thatched roof slopes + eaves
  const T0 = m(0, Y + rh, -l), T1 = m(0, Y + rh, l);
  const E00 = m(-a, Y - 0.04, -l), E01 = m(-a, Y - 0.04, l);
  const E10 = m(a, Y - 0.04, -l), E11 = m(a, Y - 0.04, l);
  qn(E00, E01, T1, T0, PAL.thatch, n(-0.7, 0.7, 0));
  qn(E11, E10, T0, T1, PAL.thatch, n(0.7, 0.7, 0));
  ln(T0, T1, 'bold', 0.015);
  ln(E00, E01, 'med', 0.01); ln(E10, E11, 'med', 0.01);
  ln(E01, T1, 'med', 0.01); ln(E11, T1, 'med', 0.01);
  ln(E00, T0, 'med', 0.01); ln(E10, T0, 'med', 0.01);
  // Horizontal thatch courses & bundle striations
  for (let i = 1; i <= 7; i++) {
    const v = -l + 2 * l * i / 8;
    ln(m(-a, Y - 0.04, v), m(0, Y + rh, v), 'fine', 0);
    ln(m(a, Y - 0.04, v), m(0, Y + rh, v), 'fine', 0);
  }
  for (let row of [0.35, 0.68]) {
    const ry = Y - 0.04 + (rh + 0.04) * row, rx = a * (1 - row);
    ln(m(-rx, ry, -l), m(-rx, ry, l), 'fine', 0);
    ln(m(rx, ry, -l), m(rx, ry, l), 'fine', 0);
  }
}

function stoneStair(x, y0, z, w, d, h, dir, steps = 5) {
  for (let i = 0; i < steps; i++) {
    const t = i / steps, sh = h / steps;
    if (dir === 'x+') box(x + w * t, y0 + h * t, z, w / steps + 0.02, sh, d, 'stone', 'fine');
    else if (dir === 'x-') box(x + w * (1 - t) - w/steps, y0 + h * t, z, w / steps + 0.02, sh, d, 'stone', 'fine');
    else if (dir === 'z+') box(x, y0 + h * t, z + d * t, w, sh, d / steps + 0.02, 'stone', 'fine');
    else box(x, y0 + h * t, z + d * (1 - t) - d/steps, w, sh, d / steps + 0.02, 'stone', 'fine');
  }
}
