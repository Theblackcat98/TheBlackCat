*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--ui-font);font-size:15px;line-height:1.45;background:var(--bg);color:var(--ink)}

  font:inherit;font-size:.875rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:.4rem .6rem;min-width:0;width:100%}

button,.btn{font:inherit;font-size:.875rem;padding:.4rem .85rem;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;line-height:1.2}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
button:disabled{opacity:.5;cursor:not-allowed}

.seg button{border:0;border-radius:0;background:transparent;padding:.35rem .8rem}

.out>button.copy{position:absolute;top:.4rem;right:.4rem}
.note{font-size:.8125rem;color:var(--muted);margin:.5rem 0 0}
.msg{border-radius:9px;padding:.5rem .75rem;font-size:.8125rem;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn)}
.msg.bad{border-color:var(--danger-line);background:var(--danger-bg);color:var(--danger)}
.msg:empty{display:none}
.pill{display:inline-block;font-size:.6875rem;font-weight:600;padding:.1rem .5rem;border-radius:999px;background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--danger)}
table.t{width:100%;border-collapse:collapse;font-size:.8125rem}
table.t th,table.t td{text-align:left;padding:.35rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.t td.m,.mono{font-family:var(--mono-font)}
.scroll{overflow:auto}
.toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.45rem .9rem;border-radius:999px;font-size:.8125rem;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50}
.toast.show{opacity:1}
.drop{border:2px dashed var(--line-2);border-radius:12px;padding:1.4rem;text-align:center;color:var(--muted);background:var(--surface-2);cursor:pointer}
.drop.over,.drop:hover{border-color:var(--accent);color:var(--ink)}
kbd{font-family:var(--mono-font);font-size:.75rem;background:var(--chip);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:.05rem .4rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation-duration:.001ms!important;animation-iteration-count:1!important}}


.stage{border:1px solid var(--line);border-radius:12px;min-height:20rem;display:grid;place-items:center;padding:2rem;position:relative;overflow:hidden}
.stage .pv{transition:none}
.layer{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:.7rem;display:grid;gap:.5rem}
.layer .sl{display:grid;grid-template-columns:4.2rem 1fr 3.4rem;gap:.5rem;align-items:center;font-size:.8125rem}
.layer .sl span:last-child,.sl2 span:last-child{font-family:var(--mono-font);text-align:right;color:var(--muted)}
.sl2{display:grid;grid-template-columns:7rem 1fr 4rem;gap:.5rem;align-items:center;font-size:.8125rem;margin-bottom:.3rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.glassbg{position:absolute;inset:0;background:linear-gradient(135deg,#ff6a88,#ffa24c 35%,#3b82f6 70%,#8b5cf6)}
.glassbg i{position:absolute;border-radius:50%;display:block}

</style>

<script>
const TOOL="shadow-shape";

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const store={
  get(k,d){try{const v=localStorage.getItem('bc:'+TOOL+':'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('bc:'+TOOL+':'+k,JSON.stringify(v))}catch(e){}}
};
let _toastT;
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;t.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('show'),1400)}
async function copyText(text,label){
  try{await navigator.clipboard.writeText(text)}catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')}catch(_){}ta.remove()}
  toast((label||'Copied')+' to clipboard')}
function download(name,data,type){
  const blob=data instanceof Blob?data:new Blob([data],{type:type||'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button.copy[data-copy-from]');
  if(b){const el=document.getElementById(b.dataset.copyFrom);if(el)copyText(el.value!==undefined&&el.tagName==='TEXTAREA'?el.value:el.textContent)}});


</script>
<script>

(() => {
  const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const rgba = (h, a) => { const [r, g, b] = hex2rgb(h); return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + (Math.round(a * 1000) / 1000) + ')'; };
  const L = (x, y, blur, spread, color, alpha, inset) => ({ x, y, blur, spread, color: color || '#000000', alpha, inset: !!inset });
  const PRES = {
    Soft: { l: [L(0, 4, 12, 0, 0, 10)] },
    Layered: { l: [L(0, 1, 1, 0, 0, 7.5), L(0, 2, 2, 0, 0, 7.5), L(0, 4, 4, 0, 0, 7.5), L(0, 8, 8, 0, 0, 7.5), L(0, 16, 16, 0, 0, 7.5)] },
    Floating: { l: [L(0, 20, 25, -5, 0, 10), L(0, 8, 10, -6, 0, 10)] },
    Hard: { l: [L(6, 6, 0, 0, 0, 100)] },
    Inset: { l: [L(0, 2, 6, 0, 0, 25, true)] },
    Glow: { l: [L(0, 0, 24, 4, '#2f6db3', 60)] },
    Neumorphic: { l: [L(-8, -8, 16, 0, '#ffffff', 80), L(8, 8, 16, 0, '#000000', 15)], box: '#e0e5ec', bg: '#e0e5ec' }
  };
  const S = store.get('s', null) || { layers: PRES.Layered.l, box: '#ffffff', bg: '#e9eaed', rad: 16 };
  const SP = store.get('sp', null) || { unit: '%', link: true, r: [[16, 16], [16, 16], [16, 16], [16, 16]], clip: 'none' };
  const GL = store.get('gl', null) || { blur: 16, alpha: 22, sat: 140, bd: 35, rad: 20, tint: '#ffffff' };
  let tab = 'shadow';
  const pv = $('#pv'), stage = $('#stage'), out = $('#css-out'), note = $('#css-note');

  /* ---------- shadow ---------- */
  const SL = [['x', 'X offset', -100, 100], ['y', 'Y offset', -100, 100], ['blur', 'Blur', 0, 200], ['spread', 'Spread', -100, 100], ['alpha', 'Opacity %', 0, 100]];
  function shadowCss() { return S.layers.map(l => (l.inset ? 'inset ' : '') + l.x + 'px ' + l.y + 'px ' + l.blur + 'px ' + l.spread + 'px ' + rgba(l.color, l.alpha / 100)).join(',\n    '); }
  function renderLayers() {
    $('#sh-layers').innerHTML = S.layers.map((l, i) =>
      '<div class="layer" data-i="' + i + '"><div class="row center"><strong style="font-size:.8125rem">Layer ' + (i + 1) + '</strong>' +
      '<input type="color" data-k="color" value="' + l.color + '" aria-label="Layer ' + (i + 1) + ' color">' +
      '<label class="chk"><input type="checkbox" data-k="inset"' + (l.inset ? ' checked' : '') + '> inset</label><span style="margin-left:auto"></span>' +
      '<button class="sm" data-rm aria-label="Remove layer ' + (i + 1) + '"' + (S.layers.length < 2 ? ' disabled' : '') + '>Remove</button></div>' +
      SL.map(([k, n, a, b]) => '<div class="sl"><label for="l' + i + k + '">' + n + '</label><input id="l' + i + k + '" type="range" data-k="' + k + '" min="' + a + '" max="' + b + '" step="' + (k === 'alpha' ? 0.5 : 1) + '" value="' + l[k] + '"><span>' + l[k] + '</span></div>').join('') + '</div>').join('');
  }
  $('#sh-presets').innerHTML = Object.keys(PRES).map(n => '<button class="sm" data-p="' + n + '">' + n + '</button>').join('');
  $('#sh-presets').addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if (!b) return; const p = PRES[b.dataset.p];
    S.layers = p.l.map(x => ({ ...x })); if (p.box) { S.box = p.box; S.bg = p.bg; $('#sh-box').value = p.box; $('#sh-bg').value = p.bg; } renderLayers(); draw();
  });
  $('#sh-layers').addEventListener('input', e => {
    const row = e.target.closest('.layer'); if (!row) return; const l = S.layers[+row.dataset.i], k = e.target.dataset.k; if (!k) return;
    l[k] = e.target.type === 'checkbox' ? e.target.checked : (e.target.type === 'range' ? parseFloat(e.target.value) : e.target.value);
    if (e.target.type === 'range') e.target.nextElementSibling.textContent = l[k]; draw();
  });
  $('#sh-layers').addEventListener('click', e => { if (e.target.closest('[data-rm]') && S.layers.length > 1) { S.layers.splice(+e.target.closest('.layer').dataset.i, 1); renderLayers(); draw(); } });
  $('#sh-add').addEventListener('click', () => { if (S.layers.length >= 8) { toast('Eight layers is plenty'); return; } S.layers.push(L(0, 8, 16, 0, 0, 15)); renderLayers(); draw(); });
  ['#sh-box', '#sh-bg', '#sh-rad'].forEach(id => $(id).addEventListener('input', () => { S.box = $('#sh-box').value; S.bg = $('#sh-bg').value; S.rad = +$('#sh-rad').value; draw(); }));

  /* ---------- shape ---------- */
  const CORN = ['Top left', 'Top right', 'Bottom right', 'Bottom left'];
  const CLIPS = {
    none: '', circle: 'circle(50% at 50% 50%)', ellipse: 'ellipse(50% 38% at 50% 50%)',
    triangle: 'polygon(50% 0, 100% 100%, 0 100%)', diamond: 'polygon(50% 0, 100% 50%, 50% 100%, 0 50%)',
    pentagon: 'polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%)', hexagon: 'polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%)',
    octagon: 'polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%)',
    star: 'polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)',
    chevron: 'polygon(75% 0, 100% 50%, 75% 100%, 0 100%, 25% 50%, 0 0)'
  };
  $('#sp-clips').innerHTML = Object.keys(CLIPS).map(n => '<button class="sm" data-c="' + n + '">' + n + '</button>').join('');
  const maxV = () => SP.unit === '%' ? 100 : 200;
  function renderShape() {
    const ml = SP.link ? 1 : 4; let h = '';
    for (let i = 0; i < ml; i++) {
      const name = SP.link ? 'All corners' : CORN[i];
      h += '<div class="sl2"><label for="sp' + i + 'h">' + name + ' ↔</label><input id="sp' + i + 'h" type="range" data-i="' + i + '" data-a="0" min="0" max="' + maxV() + '" value="' + SP.r[i][0] + '"><span>' + SP.r[i][0] + SP.unit + '</span></div>' +
           '<div class="sl2"><label for="sp' + i + 'v">' + name + ' ↕</label><input id="sp' + i + 'v" type="range" data-i="' + i + '" data-a="1" min="0" max="' + maxV() + '" value="' + SP.r[i][1] + '"><span>' + SP.r[i][1] + SP.unit + '</span></div>';
    }
    $('#sp-sliders').innerHTML = h;
    $$('#sp-unit button').forEach(b => b.setAttribute('aria-pressed', b.dataset.u === SP.unit));
    $$('#sp-clips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === SP.clip));
  }
  $('#sp-sliders').addEventListener('input', e => {
    const i = +e.target.dataset.i, a = +e.target.dataset.a, v = +e.target.value;
    if (SP.link) for (let k = 0; k < 4; k++) SP.r[k][a] = v; else SP.r[i][a] = v;
    e.target.nextElementSibling.textContent = v + SP.unit; draw();
  });
  $('#sp-link').addEventListener('change', e => { SP.link = e.target.checked; if (SP.link) for (let k = 1; k < 4; k++) SP.r[k] = SP.r[0].slice(); renderShape(); draw(); });
  $('#sp-unit').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.u === SP.unit) return;
    const f = b.dataset.u === 'px' ? 2 : 0.5; SP.unit = b.dataset.u; SP.r = SP.r.map(p => p.map(v => clamp(Math.round(v * f), 0, maxV()))); renderShape(); draw();
  });
  $('#sp-blob').addEventListener('click', () => {
    const r = () => 30 + Math.floor(Math.random() * 41), a = r(), b = r(), c = r(), d = r();
    SP.unit = '%'; SP.link = false; $('#sp-link').checked = false;
    SP.r = [[a, c], [100 - a, d], [b, 100 - d], [100 - b, 100 - c]]; renderShape(); draw();
  });
  $('#sp-clips').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { SP.clip = b.dataset.c; renderShape(); draw(); } });
  function radiusCss() {
    const u = SP.unit, hs = SP.r.map(p => p[0] + u), vs = SP.r.map(p => p[1] + u);
    const same = a => a.every(x => x === a[0]);
    if (same(hs) && same(vs) && hs[0] === vs[0]) return hs[0];
    if (same(hs) && same(vs)) return hs[0] + ' / ' + vs[0];
    return hs.join(' ') + ' / ' + vs.join(' ');
  }

  /* ---------- glass ---------- */
  const GS = [['blur', 'gl-blur', 'px'], ['alpha', 'gl-alpha', '%'], ['sat', 'gl-sat', '%'], ['bd', 'gl-bd', '%'], ['rad', 'gl-rad', 'px']];
  GS.forEach(([k, id, u]) => { const el = $('#' + id); el.value = GL[k]; el.nextElementSibling.textContent = GL[k] + u; el.addEventListener('input', () => { GL[k] = +el.value; el.nextElementSibling.textContent = GL[k] + u; draw(); }); });
  $('#gl-tint').value = GL.tint; $('#gl-tint').addEventListener('input', e => { GL.tint = e.target.value; draw(); });

  /* ---------- draw ---------- */
  function draw() {
    pv.removeAttribute('style'); stage.style.background = ''; stage.innerHTML = ''; stage.appendChild(pv);
    if (tab === 'shadow') {
      stage.style.background = S.bg;
      pv.style.cssText = 'width:180px;height:180px;background:' + S.box + ';border-radius:' + S.rad + 'px;box-shadow:' + shadowCss().replace(/\n\s*/g, ' ');
      out.textContent = 'box-shadow:\n    ' + shadowCss() + ';' + (S.rad ? '\nborder-radius: ' + S.rad + 'px;' : '');
      note.textContent = 'Several soft layers usually look more natural than one large blur. Keep opacity low, and test on your real background color.';
    } else if (tab === 'shape') {
      stage.style.background = 'var(--surface-2)';
      const clip = CLIPS[SP.clip];
      pv.style.cssText = 'width:200px;height:200px;background:linear-gradient(135deg,var(--accent),#8b5cf6);border-radius:' + radiusCss() + (clip ? ';clip-path:' + clip : '');
      out.textContent = 'border-radius: ' + radiusCss() + ';' + (clip ? '\nclip-path: ' + clip + ';' : '');
      note.textContent = clip ? 'clip-path cuts away everything outside the shape, including borders and box-shadow. Use filter: drop-shadow() on a wrapper if you need a shadow.' : 'The slash syntax sets horizontal radii before it and vertical radii after it, in the order top-left, top-right, bottom-right, bottom-left.';
    } else {
      stage.innerHTML = '<div class="glassbg"><i style="width:140px;height:140px;left:12%;top:14%;background:#fde047"></i><i style="width:110px;height:110px;right:14%;bottom:12%;background:#22d3ee"></i><i style="width:80px;height:80px;right:30%;top:10%;background:#34d399"></i></div>';
      stage.appendChild(pv);
      const bg = rgba(GL.tint, GL.alpha / 100), bd = rgba('#ffffff', GL.bd / 100), f = 'blur(' + GL.blur + 'px) saturate(' + GL.sat + '%)';
      pv.style.cssText = 'position:relative;width:240px;height:150px;background:' + bg + ';backdrop-filter:' + f + ';-webkit-backdrop-filter:' + f + ';border:1px solid ' + bd + ';border-radius:' + GL.rad + 'px;box-shadow:0 8px 32px rgba(0,0,0,0.18)';
      out.textContent = 'background: ' + bg + ';\nbackdrop-filter: ' + f + ';\n-webkit-backdrop-filter: ' + f + ';\nborder: 1px solid ' + bd + ';\nborder-radius: ' + GL.rad + 'px;\nbox-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);\n\n/* Fallback where backdrop-filter is unsupported */\n@supports not (backdrop-filter: blur(1px)) {\n  .glass { background: ' + rgba(GL.tint, Math.min(1, GL.alpha / 100 + 0.5)) + '; }\n}';
      note.textContent = 'backdrop-filter only shows through if the element has a translucent background and something behind it. Heavy blur can be costly on large areas.';
    }
    $('#sh-radv').textContent = S.rad + 'px';
    store.set('s', S); store.set('sp', SP); store.set('gl', GL);
  }

  /* ---------- tabs ---------- */
  function setTab(t) {
    tab = t;
    ['shadow', 'shape', 'glass'].forEach(n => { $('#tab-' + n).setAttribute('aria-selected', n === t); $('#p-' + n).hidden = n !== t; });
    draw();
  }
  ['shadow', 'shape', 'glass'].forEach(n => $('#tab-' + n).addEventListener('click', () => setTab(n)));
  $('#sh-box').value = S.box; $('#sh-bg').value = S.bg; $('#sh-rad').value = S.rad; $('#sp-link').checked = SP.link;
  renderLayers(); renderShape(); draw();
})();

</script>
</body>
</html>
