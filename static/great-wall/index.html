  <script src="../vendor/three/three.min.js"></script>
  <script src="../vendor/three/OrbitControls.js"></script>
  <script>
    function mulberry32(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rng = mulberry32(1570); // Longqing Ming masonry reconstruction era

    function generatePaperOverlay() {
      const canvas = document.getElementById('paper-overlay');
      const w = (canvas.width = window.innerWidth);
      const h = (canvas.height = window.innerHeight);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ede9e0';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(130, 120, 108, 0.09)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x < w; x += 28) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
      for (let y = 0; y < h; y += 28) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
      ctx.stroke();
      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;
      const lr = mulberry32(8219);
      for (let i = 0; i < d.length; i += 4) {
        const g = (lr() - 0.5) * 18;
        d[i] = Math.max(0, Math.min(255, d[i] + g));
        d[i+1] = Math.max(0, Math.min(255, d[i+1] + g));
        d[i+2] = Math.max(0, Math.min(255, d[i+2] + g));
      }
      ctx.putImageData(img, 0, 0);
    }
    generatePaperOverlay();

    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0xe5e0d6, 1);
    container.insertBefore(renderer.domElement, document.getElementById('paper-overlay'));

    const scene = new THREE.Scene();
    const frustumSize = 72;
    const aspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.OrthographicCamera(
      (-frustumSize * aspect) / 2, (frustumSize * aspect) / 2,
      frustumSize / 2, -frustumSize / 2, -250, 400
    );
    const targetPt = new THREE.Vector3(0, 5.2, 0);
    const camDist = 96;
    const defaultCamPos = new THREE.Vector3(camDist, targetPt.y + camDist * 0.72, camDist);
    camera.position.copy(defaultCamPos);
    camera.lookAt(targetPt);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(targetPt);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minZoom = 0.55;
    controls.maxZoom = 3.0;
    controls.update();

    window.addEventListener('dblclick', () => {
      camera.position.copy(defaultCamPos);
      controls.target.copy(targetPt);
      camera.zoom = 1;
      camera.updateProjectionMatrix();
      controls.update();
    });

    // =========================================================================
    // PALETTE & 6-LAYER INK ENGINE
    // =========================================================================
    const PALETTE = {
      granite: { lit: 0xe8e0d0, mid: 0xd6ccb9, shade: 0xbbb09c, top: 0xf0e9dc, bot: 0x857867 },
      brick:   { lit: 0xd5cec2, mid: 0xc2bab0, shade: 0xa69e94, top: 0xe2dcd1, bot: 0x736c63 },
      roof:    { lit: 0x8f877e, mid: 0x787068, shade: 0x5d564f, top: 0xa49b91, bot: 0x413c37 },
      timber:  { lit: 0xb87153, mid: 0x9c5a40, shade: 0x7c442f, top: 0xc98465, bot: 0x562c1d },
      flag:    { lit: 0xede6d8, mid: 0xded6c6, shade: 0xc7beae, top: 0xf4eee2, bot: 0x948a7b },
      dark:    { lit: 0x594e45, mid: 0x453c35, shade: 0x302924, top: 0x6b5f55, bot: 0x201b17 },
      pine:    { lit: 0x6c8856, mid: 0x587347, shade: 0x435936, top: 0x7c9866, bot: 0x2f4026 },
      rock:    { lit: 0xc7bba6, mid: 0xb1a48e, shade: 0x958975, top: 0xd4c8b4, bot: 0x675d4f },
      ghost:   { lit: 0xe6e0d4, mid: 0xdcd5c8, shade: 0xd0c8ba, top: 0xebe5da, bot: 0xb8b0a2 }
    };

    const washPositions = [], washColors = [];
    const inkLayers = { bold: [], medium: [], fine: [], rust: [], teal: [], faint: [] };
    const tc = new THREE.Color();
    const lightDir = new THREE.Vector3(-0.45, 0.65, 0.60).normalize();

    function shadeHex(palName, nx, ny, nz) {
      const p = PALETTE[palName] || PALETTE.brick;
      if (ny > 0.68) return p.top;
      if (ny < -0.60) return p.bot;
      const d = nx * lightDir.x + ny * lightDir.y + nz * lightDir.z;
      return d > 0.28 ? p.lit : d > -0.18 ? p.mid : p.shade;
    }
    function pushTriWorld(a, b, c, hex, sh = 0) {
      tc.setHex(hex);
      if (sh) tc.offsetHSL(0, 0, sh);
      washPositions.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
      for (let i = 0; i < 3; i++) washColors.push(tc.r, tc.g, tc.b);
    }
    function pushQuadWorld(p0, p1, p2, p3, hex, sh = 0) {
      pushTriWorld(p0, p1, p2, hex, sh);
      pushTriWorld(p0, p2, p3, hex, sh);
    }
    function quadN(pts, pal, n, sh = 0) {
      pushQuadWorld(pts[0], pts[1], pts[2], pts[3], shadeHex(pal, n[0], n[1], n[2]), sh);
    }
    function addLineWorld(a, b, layer = 'medium', ov = 0.015) {
      const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
      const L = Math.hypot(dx, dy, dz);
      if (L < 1e-5) return;
      const u = ov ? [dx / L * ov, dy / L * ov, dz / L * ov] : [0, 0, 0];
      const j = layer === 'faint' || !ov ? 0 : 0.004;
      const r = () => (rng() - 0.5) * j;
      const ax = a[0] - u[0] + r(), ay = a[1] - u[1] + r(), az = a[2] - u[2] + r();
      const bx = b[0] + u[0] + r(), by = b[1] + u[1] + r(), bz = b[2] + u[2] + r();
      (inkLayers[layer] || inkLayers.medium).push(ax, ay, az, bx, by, bz);
      if (layer === 'bold') {
        inkLayers.bold.push(ax + 0.014, ay, az - 0.014, bx + 0.014, by, bz - 0.014);
      }
    }
    function orientedBox(cx, y0, cz, w, h, d, angle, pal = 'brick', lyr = 'medium', courses = 0) {
      const ca = Math.cos(angle), sa = Math.sin(angle);
      const rot = (lx, ly, lz) => [cx + lx * ca - lz * sa, ly, cz + lx * sa + lz * ca];
      const hw = w / 2, hd = d / 2, y1 = y0 + h;
      const C = [
        rot(-hw, y0, -hd), rot(hw, y0, -hd), rot(hw, y1, -hd), rot(-hw, y1, -hd),
        rot(-hw, y0,  hd), rot(hw, y0,  hd), rot(hw, y1,  hd), rot(-hw, y1,  hd)
      ];
      quadN([C[4], C[5], C[6], C[7]], pal, [-sa, 0, ca]);
      quadN([C[1], C[5], C[6], C[2]], pal, [ca, 0, sa]);
      quadN([C[0], C[3], C[2], C[1]], pal, [sa, 0, -ca]);
      quadN([C[0], C[4], C[7], C[3]], pal, [-ca, 0, -sa]);
      quadN([C[3], C[2], C[6], C[7]], pal, [0, 1, 0]);
      quadN([C[0], C[1], C[5], C[4]], pal, [0, -1, 0]);
      [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([a, b]) => addLineWorld(C[a], C[b], lyr, 0.01));
      for (let c = 1; c < courses; c++) {
        const cy = y0 + h * c / courses;
        const r0 = rot(-hw, cy, hd), r1 = rot(hw, cy, hd), r2 = rot(hw, cy, -hd), r3 = rot(-hw, cy, -hd);
        addLineWorld(r0, r1, 'fine', 0); addLineWorld(r1, r2, 'fine', 0);
        addLineWorld(r2, r3, 'fine', 0); addLineWorld(r3, r0, 'fine', 0);
      }
    }

    // =========================================================================
    // 1. CONTINUOUS YAN MOUNTAINS RIDGELINE TERRAIN BLOCK (B = 40, N = 112)
    // =========================================================================
    const thash = (i, j) => {
      let h = Math.imul(i, 374761393) + Math.imul(j, 668265263);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    };
    const tsmooth = t => t * t * (3 - 2 * t);
    const tss = (a, b, x) => {
      const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    };
    function tval(x, z) {
      const i = Math.floor(x), j = Math.floor(z), u = tsmooth(x - i), v = tsmooth(z - j);
      return (thash(i, j) * (1 - u) + thash(i + 1, j) * u) * (1 - v) +
             (thash(i, j + 1) * (1 - u) + thash(i + 1, j + 1) * u) * v;
    }
    const tfbm = (x, z) => tval(x, z) * 0.52 + tval(x * 2.1, z * 2.1) * 0.28 + tval(x * 4.4, z * 4.4) * 0.20;

    const B_TER = 40, N_TER = 112, Y_BOT = -8.5;
    // Main sinuous mountain crest locus z_ridge(x)
    function ridgeZ(x) {
      return 6.5 * Math.sin(x * 0.085 - 0.35) + 0.14 * x;
    }
    function ridgeElev(x) {
      // West peak (+14.5) -> central pass saddle (+5.8) -> high central bastion crag (+16.2) -> eastern ridge crest (+18.5)
      const p1 = 13.5 * Math.exp(-Math.pow((x + 25) / 14, 2));
      const p2 = 15.8 * Math.exp(-Math.pow((x + 4) / 12, 2));
      const p3 = 18.2 * Math.exp(-Math.pow((x - 24) / 15, 2));
      const saddle = 6.2 + 1.8 * Math.cos(x * 0.09);
      return Math.max(saddle, p1, p2, p3);
    }
    function H_yan(x, z) {
      const dz = z - ridgeZ(x);
      const rc = ridgeElev(x);
      // Narrow rocky ridge profile sloping down into deep northern & southern valleys
      const flankWidth = 10.5 + 3.0 * Math.sin(x * 0.12);
      let h = -3.8 + (rc + 3.8) * Math.exp(-Math.pow(Math.abs(dz) / flankWidth, 1.85));
      // North-west beacon peak spur at (-24, -24)
      h = Math.max(h, -3.5 + 17.5 * Math.exp(-Math.pow(Math.hypot(x + 23, z + 23) / 11.5, 1.75)));
      // South-east rocky spur at (28, 26)
      h = Math.max(h, -3.5 + 11.5 * Math.exp(-Math.pow(Math.hypot(x - 28, z - 25) / 12.0, 1.8)));
      // Keep crisp ridge crest directly under wall centerline smooth
      const crestFlatten = 1 - tss(1.8, 4.8, Math.abs(dz));
      h += (tfbm(x * 0.14, z * 0.14) - 0.45) * 4.2 * (1 - crestFlatten * 0.72);
      return h;
    }

    const st = (2 * B_TER) / N_TER;
    const hGrid = [];
    for (let j = 0; j <= N_TER; j++) {
      for (let i = 0; i <= N_TER; i++) hGrid.push(H_yan(-B_TER + i * st, -B_TER + j * st));
    }
    const gPt = (i, j) => [-B_TER + i * st, hGrid[j * (N_TER + 1) + i], -B_TER + j * st];

    for (let j = 0; j < N_TER; j++) {
      for (let i = 0; i < N_TER; i++) {
        const a = gPt(i, j), b = gPt(i + 1, j), c = gPt(i + 1, j + 1), d = gPt(i, j + 1);
        [[a, b, c], [a, c, d]].forEach(tri => {
          const p0 = tri[0], p1 = tri[1], p2 = tri[2];
          const ux = p1[0] - p0[0], uy = p1[1] - p0[1], uz = p1[2] - p0[2];
          const vx = p2[0] - p0[0], vy = p2[1] - p0[1], vz = p2[2] - p0[2];
          let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
          const l = Math.hypot(nx, ny, nz) || 1;
          nx /= l; ny /= l; nz /= l;
          if (ny < 0) { nx = -nx; ny = -ny; nz = -nz; }
          const cx = (p0[0] + p1[0] + p2[0]) / 3;
          const cy = (p0[1] + p1[1] + p2[1]) / 3;
          const cz = (p0[2] + p1[2] + p2[2]) / 3;
          const dot = nx * lightDir.x + ny * lightDir.y + nz * lightDir.z;
          const sh = dot * 0.045;
          let colHex;
          if (ny < 0.72) {
            colHex = dot > 0.12 ? PALETTE.rock.lit : dot > -0.15 ? PALETTE.rock.mid : PALETTE.rock.shade;
          } else {
            const gq = tfbm(cx * 0.28 + 4, cz * 0.28);
            colHex = cy > 11 ? (gq > 0.5 ? 0xc0c294 : 0xafa886) : (gq > 0.5 ? 0x9eb57b : 0x869e68);
          }
          pushTriWorld(p0, p1, p2, colHex, sh);
        });
      }
    }

    // Stratified Yan Mountains Granite & Dolomite Bedrock Cutaway Skirts
    const ysYan = [Y_BOT, -5.5, -2.5, 0.5, 4.0, 8.0, 12.0, 16.0, 22.0];
    const yanHexes = [0x786d63, 0x8f8276, 0xa89b8d, 0xb8a997, 0xc9b9a3, 0xb5a692, 0xc7bca8, 0xd9cfbc];
    function addYanSkirt(isX, fixedVal, nSign) {
      const fDot = isX ? nSign * lightDir.x : nSign * lightDir.z;
      for (let i = 0; i < N_TER; i++) {
        const u0 = -B_TER + i * st, u1 = u0 + st;
        const x0 = isX ? fixedVal : u0, z0 = isX ? u0 : fixedVal;
        const x1 = isX ? fixedVal : u1, z1 = isX ? u1 : fixedVal;
        const h0 = H_yan(x0, z0), h1 = H_yan(x1, z1);
        for (let s = 0; s < ysYan.length - 1; s++) {
          const yA = ysYan[s], yB = ysYan[s + 1];
          const top0 = Math.min(h0, yB), top1 = Math.min(h1, yB);
          const bot0 = Math.min(h0, yA), bot1 = Math.min(h1, yA);
          if (top0 - bot0 < 0.02 && top1 - bot1 < 0.02) continue;
          pushQuadWorld([x0, bot0, z0], [x1, bot1, z1], [x1, top1, z1], [x0, top0, z0], yanHexes[s], fDot * 0.04);
          if (s > 0 && h0 > yA && h1 > yA) addLineWorld([x0, yA, z0], [x1, yA, z1], s % 3 === 0 ? 'rust' : 'fine', 0);
        }
        addLineWorld([x0, h0, z0], [x1, h1, z1], 'bold', 0);
        addLineWorld([x0, Y_BOT, z0], [x1, Y_BOT, z1], 'bold', 0);
        if (i === 0) addLineWorld([x0, Y_BOT, z0], [x0, h0, z0], 'bold', 0);
        if (i === N_TER - 1) addLineWorld([x1, Y_BOT, z1], [x1, h1, z1], 'bold', 0);
      }
    }
    addYanSkirt(false,  B_TER,  1);
    addYanSkirt(false, -B_TER, -1);
    addYanSkirt(true,   B_TER,  1);
    addYanSkirt(true,  -B_TER, -1);

    // Topographic contours along all mountain slopes
    for (let lv = -2; lv <= 17; lv += 1.6) {
      const lyr = Math.abs(lv % 3.2) < 0.3 ? 'medium' : 'fine';
      for (let j = 0; j < N_TER; j++) {
        for (let i = 0; i < N_TER; i++) {
          const a = gPt(i, j), b = gPt(i + 1, j), c = gPt(i + 1, j + 1), d = gPt(i, j + 1);
          [[a, b, c], [a, c, d]].forEach(T => {
            const cr = [];
            [[T[0], T[1]], [T[1], T[2]], [T[2], T[0]]].forEach(([u, v]) => {
              if ((u[1] < lv) !== (v[1] < lv)) {
                const t = (lv - u[1]) / (v[1] - u[1]);
                cr.push([u[0] + (v[0] - u[0]) * t, lv + 0.04, u[2] + (v[2] - u[2]) * t]);
              }
            });
            if (cr.length === 2) addLineWorld(cr[0], cr[1], lyr, 0);
          });
        }
      }
    }

    // =========================================================================
    // 2. CONTINUOUS MITERED GREAT WALL RIBBON HUGGING RIDGE H(x,z)
    // =========================================================================
    const N_WALL = 64;
    const stations = [];
    for (let i = 0; i <= N_WALL; i++) {
      const x = -B_TER + 0.5 + ((2 * B_TER - 1.0) * i) / N_WALL;
      const z = ridgeZ(x);
      stations.push({ x, z, y: H_yan(x, z) });
    }

    // Compute smooth left/right wall normal vectors at each station
    const wallHalfBase = 1.55, wallHalfTop = 1.08, wallHeight = 3.35;
    const frames = stations.map((pt, i) => {
      const pPrev = stations[Math.max(0, i - 1)];
      const pNext = stations[Math.min(N_WALL, i + 1)];
      const tx = pNext.x - pPrev.x, tz = pNext.z - pPrev.z;
      const len = Math.hypot(tx, tz) || 1;
      const nx = -tz / len, nz = tx / len; // normal toward south (+Z) & north (-Z)
      const hNorth = H_yan(pt.x - nx * wallHalfBase, pt.z - nz * wallHalfBase);
      const hSouth = H_yan(pt.x + nx * wallHalfBase, pt.z + nz * wallHalfBase);
      const yDeck = pt.y + wallHeight;
      return {
        x: pt.x, z: pt.z, nx, nz, yDeck, hNorth, hSouth,
        nBot: [pt.x - nx * wallHalfBase, hNorth - 1.85, pt.z - nz * wallHalfBase],
        sBot: [pt.x + nx * wallHalfBase, hSouth - 1.85, pt.z + nz * wallHalfBase],
        nTop: [pt.x - nx * wallHalfTop, yDeck, pt.z - nz * wallHalfTop],
        sTop: [pt.x + nx * wallHalfTop, yDeck, pt.z + nz * wallHalfTop]
      };
    });

    for (let i = 0; i < N_WALL; i++) {
      const F0 = frames[i], F1 = frames[i + 1];
      const nNorth = [-F0.nx, 0.14, -F0.nz];
      const nSouth = [F0.nx, 0.14, F0.nz];
      // Battered stone & brick curtain wall faces
      quadN([F0.nBot, F1.nBot, F1.nTop, F0.nTop], 'brick', nNorth);
      quadN([F1.sBot, F0.sBot, F0.sTop, F1.sTop], 'brick', nSouth);
      // Flagstone wall walk ("horse road")
      quadN([F0.nTop, F1.nTop, F1.sTop, F0.sTop], 'flag', [0, 1, 0]);
      // Close cut ends at west and east block borders cleanly
      if (i === 0) {
        quadN([F0.nBot, F0.sBot, F0.sTop, F0.nTop], 'granite', [-1, 0, 0]);
        addLineWorld(F0.nTop, F0.sTop, 'bold', 0);
        addLineWorld(F0.sBot, F0.sTop, 'bold', 0);
      }
      if (i === N_WALL - 1) {
        quadN([F1.sBot, F1.nBot, F1.nTop, F1.sTop], 'granite', [1, 0, 0]);
        addLineWorld(F1.nTop, F1.sTop, 'bold', 0);
        addLineWorld(F1.sBot, F1.sTop, 'bold', 0);
      }
      addLineWorld(F0.nTop, F1.nTop, 'bold', 0);
      addLineWorld(F0.sTop, F1.sTop, 'bold', 0);
      // Ink bedrock footing contact along actual ridge ground line + horizontal masonry courses
      addLineWorld([F0.sBot[0], F0.hSouth + 0.05, F0.sBot[2]], [F1.sBot[0], F1.hSouth + 0.05, F1.sBot[2]], 'medium', 0);
      addLineWorld([F0.nBot[0], F0.hNorth + 0.05, F0.nBot[2]], [F1.nBot[0], F1.hNorth + 0.05, F1.nBot[2]], 'medium', 0);
      [0.35, 0.68].forEach(c => {
        const ly0 = F0.hSouth + (F0.yDeck - F0.hSouth) * c, ly1 = F1.hSouth + (F1.yDeck - F1.hSouth) * c;
        addLineWorld([F0.sTop[0], ly0, F0.sTop[2]], [F1.sTop[0], ly1, F1.sTop[2]], 'fine', 0);
        const ry0 = F0.hNorth + (F0.yDeck - F0.hNorth) * c, ry1 = F1.hNorth + (F1.yDeck - F1.hNorth) * c;
        addLineWorld([F0.nTop[0], ry0, F0.nTop[2]], [F1.nTop[0], ry1, F1.nTop[2]], 'fine', 0);
      });
      // Stepped stair treads on steep wall walk pitches
      if (Math.abs(F1.yDeck - F0.yDeck) > 0.25) {
        addLineWorld(F0.nTop, F0.sTop, 'fine', 0);
      }

      // Crenellated North Battlements (merlons) & Low South Parapet
      const ang = Math.atan2(F1.z - F0.z, F1.x - F0.x);
      const midX = (F0.nTop[0] + F1.nTop[0]) / 2, midZ = (F0.nTop[2] + F1.nTop[2]) / 2, midY = (F0.yDeck + F1.yDeck) / 2;
      if (i % 2 === 0 && i !== 26 && i !== 49) {
        orientedBox(midX + F0.nx * 0.16, midY - 0.05, midZ + F0.nz * 0.16, 0.65, 0.88, 0.26, -ang, 'granite', 'medium');
      }
      const smX = (F0.sTop[0] + F1.sTop[0]) / 2, smZ = (F0.sTop[2] + F1.sTop[2]) / 2;
      orientedBox(smX - F0.nx * 0.15, midY - 0.05, smZ - F0.nz * 0.15, 1.15, 0.45, 0.22, -ang, 'granite', 'fine');
    }

    // =========================================================================
    // 3. DETAILED TWO-STOREY MING WATCHTOWERS (DIKONG / ENEMY TOWERS) & BEACON
    // =========================================================================
    function addMingWatchtower(idx, scale = 1.0) {
      const F = frames[idx], Fn = frames[Math.min(N_WALL, idx + 1)];
      const ang = -Math.atan2(Fn.z - F.z, Fn.x - F.x);
      const baseH = H_yan(F.x, F.z);
      const W = 5.4 * scale, D = 4.6 * scale, plinthH = 4.2 * scale, midH = 2.6 * scale;
      // 1. Heavy battered granite fortress terrace anchoring deep into ridge
      orientedBox(F.x, baseH - 1.5, F.z, W, plinthH + 1.5, D, ang, 'granite', 'bold', 3);
      // 2. Arched brick casemate body with embrasure windows
      const y1 = baseH + plinthH;
      orientedBox(F.x, y1, F.z, W - 0.4, midH, D - 0.4, ang, 'brick', 'bold', 4);
      const ca = Math.cos(ang), sa = Math.sin(ang);
      [-1.3 * scale, 0, 1.3 * scale].forEach(u => {
        const wx1 = F.x + u * ca - (D * 0.47) * sa, wz1 = F.z + u * sa + (D * 0.47) * ca;
        orientedBox(wx1, y1 + 0.75, wz1, 0.55 * scale, 0.95 * scale, 0.18, ang, 'dark', 'medium');
        const wx2 = F.x + u * ca + (D * 0.47) * sa, wz2 = F.z + u * sa - (D * 0.47) * ca;
        orientedBox(wx2, y1 + 0.75, wz2, 0.55 * scale, 0.95 * scale, 0.18, ang, 'dark', 'medium');
      });
      // 3. Stepped watchtower battlement deck + Upper Timber Watch Pavilion & Swept Hip Roof
      const y2 = y1 + midH;
      orientedBox(F.x, y2, F.z, W + 0.25, 0.42, D + 0.25, ang, 'granite', 'bold');
      const pw = W * 0.62, pd = D * 0.58, ph = 1.65 * scale;
      orientedBox(F.x, y2 + 0.42, F.z, pw, ph, pd, ang, 'timber', 'bold', 2);
      // Two-tiered hip-and-gable roof above timber watch pavilion
      const yR = y2 + 0.42 + ph;
      orientedBox(F.x, yR, F.z, pw + 1.25, 0.35, pd + 1.25, ang, 'roof', 'bold');
      const rot = (lx, ly, lz) => [F.x + lx * ca - lz * sa, ly, F.z + lx * sa + lz * ca];
      const hw = (pw + 1.25) / 2, hd = (pd + 1.25) / 2, rh = 1.55 * scale, rw = hw * 0.45;
      const E0 = rot(-hw, yR + 0.35, hd), E1 = rot(hw, yR + 0.35, hd), E2 = rot(hw, yR + 0.35, -hd), E3 = rot(-hw, yR + 0.35, -hd);
      const R0 = rot(-rw, yR + 0.35 + rh, 0), R1 = rot(rw, yR + 0.35 + rh, 0);
      quadN([E0, E1, R1, R0], 'roof', [-sa, 0.7, ca]);
      quadN([E2, E3, R0, R1], 'roof', [sa, 0.7, -ca]);
      pushTriWorld(E1, E2, R1, PALETTE.roof.shade);
      pushTriWorld(E3, E0, R0, PALETTE.roof.lit);
      addLineWorld(R0, R1, 'bold', 0.02);
      [E0, E1, E2, E3].forEach((e, k) => {
        addLineWorld(e, k < 2 ? (k === 0 ? R0 : R1) : (k === 2 ? R1 : R0), 'bold', 0.02);
      });
      addLineWorld(E0, E1, 'bold', 0); addLineWorld(E1, E2, 'bold', 0);
      addLineWorld(E2, E3, 'bold', 0); addLineWorld(E3, E0, 'bold', 0);
    }

    // Two monumental watchtowers straddling the ridge crests + western wall gate tower
    addMingWatchtower(10, 0.88);
    addMingWatchtower(28, 1.08);
    addMingWatchtower(50, 0.96);

    // Detached Ming Beacon Tower (Fengsui) on the NW crag (-23, -23)
    {
      const bx = -23, bz = -23, by = H_yan(bx, bz);
      orientedBox(bx, by - 1.2, bz, 3.4, 4.4, 3.4, 0.2, 'granite', 'bold', 4);
      orientedBox(bx, by + 3.2, bz, 3.8, 0.45, 3.8, 0.2, 'brick', 'bold');
      // Subtle wolf-dung signal brazier wisps
      addLineWorld([bx, by + 3.65, bz], [bx + 0.6, by + 6.4, bz - 0.5], 'faint', 0);
      addLineWorld([bx + 0.3, by + 4.1, bz], [bx + 1.0, by + 6.9, bz - 0.8], 'faint', 0);
    }

    // =========================================================================
    // 4. MOUNTAIN PINES & PASS TRAILS
    // =========================================================================
    function addMountainPine(px, pz, s) {
      const py = H_yan(px, pz);
      const r = 0.58 * s, h = 1.9 * s;
      const pts = [[px + r, py + 0.25, pz], [px, py + 0.25, pz + r], [px - r, py + 0.25, pz], [px, py + 0.25, pz - r]];
      const top = [px, py + 0.25 + h, pz];
      for (let k = 0; k < 4; k++) {
        const kn = (k + 1) % 4;
        pushTriWorld(pts[k], pts[kn], top, k < 2 ? PALETTE.pine.lit : PALETTE.pine.shade);
        addLineWorld(pts[k], top, 'fine', 0);
      }
      addLineWorld([px, py - 0.05, pz], [px, py + 0.30, pz], 'medium', 0);
    }
    let pineCount = 0;
    for (let k = 0; k < 3200 && pineCount < 210; k++) {
      const px = (rng() * 2 - 1) * (B_TER - 2.0), pz = (rng() * 2 - 1) * (B_TER - 2.0);
      if (Math.abs(pz - ridgeZ(px)) < 3.8) continue;
      if (Math.hypot(px + 23, pz + 23) < 4.5) continue;
      const py = H_yan(px, pz);
      if (py < -2.2 || py > 13.5) continue;
      const dH = Math.abs(H_yan(px + 0.6, pz) - py);
      if (dH > 0.72 || tfbm(px * 0.3, pz * 0.3) < 0.44) continue;
      addMountainPine(px, pz, 0.72 + rng() * 0.78);
      pineCount++;
    }

    // =========================================================================
    // 5. ASSEMBLE WASH & INK LAYERS + RENDER LOOP
    // =========================================================================
    const washGeo = new THREE.BufferGeometry();
    washGeo.setAttribute('position', new THREE.Float32BufferAttribute(washPositions, 3));
    washGeo.setAttribute('color', new THREE.Float32BufferAttribute(washColors, 3));
    scene.add(new THREE.Mesh(washGeo, new THREE.MeshBasicMaterial({
      vertexColors: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1.4, polygonOffsetUnits: 1.4
    })));

    [['bold', 0x211b17, 0.92], ['medium', 0x332a24, 0.80], ['fine', 0x4a3f37, 0.44],
     ['rust', 0x8c4531, 0.64], ['teal', 0x527d80, 0.52], ['faint', 0x6b6157, 0.30]].forEach(([k, c, o]) => {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(inkLayers[k], 3));
      scene.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: o })));
    });

    window.addEventListener('resize', () => {
      const a = window.innerWidth / window.innerHeight;
      camera.left = (-frustumSize * a) / 2;
      camera.right = (frustumSize * a) / 2;
      camera.top = frustumSize / 2;
      camera.bottom = -frustumSize / 2;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      generatePaperOverlay();
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
